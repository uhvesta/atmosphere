[workspace]
members = [
    "tools/swift_catalog",
    "tools/bootstrap/lib",
    "tools/bootstrap/lock",
    "tools/bootstrap/revup",
    "apps/humata/proto/plugin",
    "apps/humata/daemon/agent",
    "apps/humata/daemon/workspace",
    "apps/humata/daemon/wire",
    "apps/humata/daemon/humatad",
    "apps/humata/daemon/cli",
    "apps/humata/e2e/sshd",
    "libs/tca-rust",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
# Workspace crates.
bootstrap = { path = "tools/bootstrap/lib" }

# Third-party crates.
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
plist = "1.10.3"
prost = "0.14.5"
prost-types = "0.14.5"
protoc-gen-prost = "0.5.0"
rand = "0.10"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
ruzstd = "0.9.1"
# Pseudo-terminals for Humata's terminals.
rustix = { version = "1.1.6", features = ["fs", "process", "pty", "termios"] }
# ring, not aws-lc-rs, which needs CMake to build.
russh = { version = "0.65.1", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.8"
ureq = "3.5.1"
uuid = { version = "1.29.2", features = ["v4"] }
versions = "8.0.1"
zip = { version = "9.3.0", default-features = false, features = ["deflate-flate2"] }
