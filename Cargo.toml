[workspace]
members = ["tools/scripts/bootstrap/lib", "tools/scripts/bootstrap/lock"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"

[workspace.dependencies]
bzip2 = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
plist = "1.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
ureq = "3.5.1"
