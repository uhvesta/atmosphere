[package]
name = "humata2-gui-spike"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "humata2_gui_spike"
path = "src/lib.rs"

[[bin]]
name = "humata2-gui-spike"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
libc = "0.2.191"
tca-rust = { path = "../../../../libs/tca-rust" }
terminal_grid = { path = "../../terminal/grid", features = ["fake"] }
terminal_view = { path = "../../terminal/view" }
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
