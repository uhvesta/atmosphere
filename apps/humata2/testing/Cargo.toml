# Humata 2's snapshot and flow testing tools.
#
# Source manifests for dependency resolution. Build, test and lint only
# through Bazel; see README.md. testing/linux is a script, not a crate.
[workspace]
resolver = "3"
members = ["snapshot", "flow"]

[workspace.package]
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
# Workspace crates.
humata2-snapshot = { path = "snapshot" }
# The engine boundary: which GPUI engine, headless contexts, natural frames.
humata2-engine = { path = "../engine", features = ["test-support"] }
tca-rust = { path = "../../../libs/tca-rust" }

# Third-party crates. The repository's .cargo/config.toml keeps cargo from
# taking any version published less than 3 days ago.
gpui-kit = { version = "0.9.1", features = ["test-support"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt"] }
