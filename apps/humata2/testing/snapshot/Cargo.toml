[package]
name = "humata2-snapshot"
description = "State, view and image snapshots for Humata 2's tests, recorded and verified beside each test."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "humata2_snapshot"
path = "src/lib.rs"

[features]
# Build and test against GPUI Fast instead of ordinary GPUI.
fast = ["humata2-engine/fast"]

[dependencies]
gpui-kit.workspace = true
humata2-engine.workspace = true
image.workspace = true
tca-rust.workspace = true
thiserror.workspace = true
