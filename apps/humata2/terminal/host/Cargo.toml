# Dependency-resolution manifest for the Bazel-only persistent host.
# Native local crates and binaries are defined by BUILD.bazel.
[package]
name = "humata2-terminal-host"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "=0.23.1"
axum = { version = "=0.8.9", features = ["ws", "http1", "tokio"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "handshake"] }
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
