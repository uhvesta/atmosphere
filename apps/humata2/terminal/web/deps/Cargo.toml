# Browser GPU dependency closure: no native-only test-support/proptest.
[workspace]
resolver = "3"

[package]
name = "humata2-gpui-web-crates"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[lib]
path = "lib.rs"

[dependencies]
gpui-kit = { version = "=0.9.1", features = ["gpui-fast", "syntect"] }
wasm-bindgen = "=0.2.127"
log = "=0.4.35"
