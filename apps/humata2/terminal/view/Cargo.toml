[package]
name = "terminal_view"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "terminal_view"
path = "src/lib.rs"

[dependencies]
gpui-kit = { workspace = true }
terminal_grid = { path = "../grid" }

[features]
# Draw with GPUI Fast. The view names no engine; this only lets its own tests
# and benchmark run on Fast (`cargo test -p terminal_view --features fast`).
fast = ["gpui-kit/gpui-fast", "humata2-engine/fast"]

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
humata2-engine = { path = "../../engine", features = ["test-support"] }
terminal_grid = { path = "../grid", features = ["fake"] }

[[test]]
name = "view"
path = "tests/view.rs"

[[bench]]
name = "frame"
path = "benches/frame.rs"
harness = false
