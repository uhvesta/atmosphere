[package]
name = "humata2-clients-live"
description = "Humata 2's real daemon client: the app's Daemon and Terminals traits over gRPC to humatad2 on its Unix socket."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

# Also depends on humatad's generated gRPC clients, which Bazel generates
# (//apps/humata2/daemon/humatad:grpc), so this crate builds with Bazel only.
[lib]
name = "humata2_clients_live"
path = "src/lib.rs"

[dependencies]
humata2-clients = { path = ".." }
hyper-util = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tca-rust = { workspace = true }
tempfile = { workspace = true }
