// Settings (ST-1..17, SEC-6, SEC-13), pinned and VIP marks (NV-20..26) and
// the app's view state (AR-5: panels, tabs, folds, scroll positions,
// filters, pane widths, expanded results, pinned order). All live on the host (SL-1). Every write here
// is user-only: no capability lets an agent call them, and MCP has no tool
// for them (BOUNDARIES.md §5). Default access and While I'm away defaults
// (ST-4, ST-6) are AccessService.Get/SetDefaultRules.
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/access.proto";
import "humata/v1/common.proto";

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (Settings);
  // Changes only the sections set. Takes effect at once in every client
  // (SettingsChanged event); ST-7 keeps each view's top line in place.
  rpc UpdateSettings(UpdateSettingsRequest) returns (Settings);
  rpc GetChannelSettings(GetChannelSettingsRequest) returns (ChannelSettings);
  rpc UpdateChannelSettings(UpdateChannelSettingsRequest) returns (ChannelSettings);
}

service AgentService {
  // ST-1: built-in and user-added agents, with what each supports.
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  // ST-2. User-only.
  rpc AddAgent(AddAgentRequest) returns (AgentDefinition);
  // ST-1 Edit. User-only. Running sessions keep the command they started
  // with; the change applies to the next start, fork or resume.
  rpc UpdateAgent(UpdateAgentRequest) returns (AgentDefinition);
  // AGENTSET (D720, D727): Settings › Agents. Turns a kind on or off, and
  // its "Install when missing", in the host's config/agents.toml. Only
  // the fields set change. User-only; peers and agents are refused.
  rpc SetAgentEnabled(SetAgentEnabledRequest) returns (AgentDefinition);
}

service MarkService {
  // NV-20. User-only: agents can't set or clear marks.
  rpc SetMarks(SetMarksRequest) returns (Marks);
  // NV-21: the Pinned section, in the user's order.
  rpc ListPinned(ListPinnedRequest) returns (ListPinnedResponse);
  // NV-25: order within Pinned, by drag there or from the palette. A newly
  // pinned item goes at the end.
  rpc ReorderPinned(ReorderPinnedRequest) returns (ListPinnedResponse);
  // CH-16, CH-17 (D392): the user looks at a session while this stream is
  // open. Opening it clears the session's unread mark, and the first
  // message says whether it had one; while any client holds one open, the
  // session's new output marks nothing. The stream sends nothing more and
  // ends when the client closes it. User-only. A session the host doesn't
  // know is not_found.
  rpc ViewSession(ViewSessionRequest) returns (stream ViewSessionResponse);
}

// AR-5: open panels and tabs, folds, scroll positions, filters (SE-13),
// pane widths and collapsed panes (NV-16) and expanded results (NV-19), kept
// on the host so they survive the app quitting, crashing or being
// reinstalled, and follow the user to a second client. Opaque to the
// daemon. The pinned order is MarkService's, not here.
service ViewStateService {
  rpc GetViewState(GetViewStateRequest) returns (GetViewStateResponse);
  rpc PutViewState(PutViewStateRequest) returns (PutViewStateResponse);
}

// ---------------------------------------------------------------------------

enum LongLines {
  LONG_LINES_UNSPECIFIED = 0;
  LONG_LINES_WRAP = 1;   // default
  LONG_LINES_SCROLL = 2;
}

message TerminalSettings {
  string font = 1;
  float font_size = 2;
  // Empty: follows the system.
  string theme = 3;
  // Kept on each machine (ST-3).
  uint32 scrollback_lines = 4;
}

message DefaultAgent {
  AgentId agent = 1;
  string model = 2;
}

message RetentionRules {
  // 0: off (LD-16 default).
  uint32 archive_pr_reviews_after_days = 1;
  uint32 archive_idle_sessions_after_days = 2;
}

message SkillsSettings {
  bool auto_sync = 1;
  repeated MachineId opted_out = 2;
  repeated string exclude_patterns = 3;
}

message NotificationSettings {
  // Local time, "22:00".."07:30"; empty: no quiet hours.
  string quiet_from = 1;
  string quiet_until = 2;
  // NV-23.
  bool vip_breaks_quiet_hours = 3;
}

message MachineSettings {
  MachineId machine = 1;
  string root = 2;   // changed with MachineService.ChangeRoot
  bool vm_tier = 3;  // changed with MachineService.SetVmTier
}

enum TodoSyncMode {
  TODO_SYNC_MODE_UNSPECIFIED = 0;
  TODO_SYNC_MODE_ASK = 1;
  TODO_SYNC_MODE_AUTO = 2;
}

// FUSEFS (0.6.0): how a host's skills meet a session's own copies.
enum SyncSkillsMode {
  SYNC_SKILLS_MODE_UNSPECIFIED = 0;
  // The host's skill replaces a session's skill of the same name.
  SYNC_SKILLS_MODE_HOST_WINS = 1;
  // A session sees only the host's skills.
  SYNC_SKILLS_MODE_HOST_ONLY = 2;
}

// One machine's departures from SyncSettings; an unset field follows the
// global value.
message MachineSyncOverride {
  optional bool enabled = 1;
  optional bool skills = 2;
  optional bool instructions = 3;
  optional bool mcp = 4;
  optional bool settings = 5;
  optional SyncSkillsMode skills_mode = 6;
}

// FUSEFS (0.6.0) Settings › Sync, kept in config/config-sync.toml. Each
// agent session gets its own native config home composed from the host's
// agent config; nothing writes the user's real agent dotfiles. Turning
// `sync_enabled` off (or on) takes effect in running sessions at once,
// with no holder restart.
message SyncSettings {
  bool sync_enabled = 1;
  bool skills = 2;
  bool instructions = 3;
  bool mcp = 4;
  bool settings = 5;
  SyncSkillsMode skills_mode = 6;
  // Keyed by machine id.
  map<string, MachineSyncOverride> machines = 7;
}

message TodoAutomationSettings {
  TodoSyncMode on_pr_merged = 1;
  TodoSyncMode on_todo_closed_archive_sessions = 2;
  bool auto_wake_on_ci_fail = 3;
  bool auto_wake_on_review_comments = 4;
  // Days of inactivity before offering a soft idle nudge; 0 disables or uses default.
  uint32 idle_nudge_days = 5;
}

message Settings {
  DefaultAgent default_agent = 1;       // ST-15
  TerminalSettings terminal = 2;        // ST-3
  repeated MachineSettings machines = 3;   // ST-5, read-only here
  string branch_prefix = 4;             // ST-13; empty allowed
  bool branch_prefix_is_default = 5;    // the gh login + "/"
  RetentionRules retention_defaults = 6;   // ST-14
  LongLines long_lines = 7;             // ST-7
  SkillsSettings skills = 8;            // ST-16
  NotificationSettings notifications = 9;
  Revision revision = 10;
  SecuritySettings security = 11;       // SEC-6
  AgentSettings agents = 12;            // D199
  TodoAutomationSettings todo_automation = 13;
  SyncSettings sync = 14;               // FUSEFS Settings › Sync
  // FUSEFS: humatad2 mounts the cross-machine view at HUMATA_FUSE_ROOT.
  // Local session folders stay on native disk either way.
  bool fusefs_enabled = 15;
}

// D199, kept for older callers (D782): `permissions_in_agent` reads true
// only when every agent kind has `AgentDefinition.asks_in_inbox` off, and
// writing it sets that switch for every kind. The per-kind switch is
// SetAgentEnabledRequest.asks_in_inbox. Read at each ask, so running
// sessions follow a change with no restart.
message AgentSettings {
  bool permissions_in_agent = 1;
  // D202, output only (writes ignore it): some agent kind carries Codex's
  // `-c hooks=…` and no hook from that exact command has reached the
  // daemon yet, so the user still has to trust them in Codex's /hooks.
  bool codex_hooks_need_trust = 2;
}

message SecuritySettings {
  // SEC-6 Contain agents; off by default. A change applies when a session
  // next launches or resumes. The approval passphrase is
  // AccessService.SetApprovalPassphrase (SEC-13).
  bool contain_agents = 1;
}

message GetSettingsRequest {}

message UpdateSettingsRequest {
  IdempotencyKey idempotency_key = 1;
  // Only the sections present are replaced.
  DefaultAgent default_agent = 2;
  TerminalSettings terminal = 3;
  optional string branch_prefix = 4;
  RetentionRules retention_defaults = 5;
  optional LongLines long_lines = 6;
  SkillsSettings skills = 7;
  NotificationSettings notifications = 8;
  Revision expected_revision = 9;
  PresenceProof presence = 10;
  SecuritySettings security = 11;
  AgentSettings agents = 12;
  TodoAutomationSettings todo_automation = 13;
  // Replaces the whole Sync section when present.
  SyncSettings sync = 14;
  optional bool fusefs_enabled = 15;
}

message ChannelSettings {
  ChannelId channel = 1;
  // Unset: the global default.
  DefaultAgent default_agent = 2;
  optional string branch_prefix = 3;    // FC-12
  RetentionRules retention = 4;         // LD-16
  Revision revision = 5;
  // SEC-6 per-channel override; unset: the global setting.
  optional bool contain_agents = 6;
  TodoAutomationSettings todo_automation = 7;
}

message GetChannelSettingsRequest { ChannelId channel = 1; }

message UpdateChannelSettingsRequest {
  IdempotencyKey idempotency_key = 1;
  ChannelId channel = 2;
  DefaultAgent default_agent = 3;
  bool clear_default_agent = 4;
  optional string branch_prefix = 5;
  bool clear_branch_prefix = 6;
  RetentionRules retention = 7;
  Revision expected_revision = 8;
  PresenceProof presence = 9;
  optional bool contain_agents = 10;
  bool clear_contain_agents = 11;
  TodoAutomationSettings todo_automation = 12;
  bool clear_todo_automation = 13;
}

// ---------------------------------------------------------------------------

message AgentDefinition {
  AgentId id = 1;
  string name = 2;
  bool built_in = 3;
  string launch_command = 4;
  // Names only; values come from host variables (SEC-1).
  repeated string variables = 5;
  // Templates with {conversation_id} and {new_conversation_id}.
  string resume_arguments = 6;
  string fork_arguments = 7;
  // ST-1: a context fork needs the agent to copy its conversation under a
  // new id; without it only code-only forks are offered.
  bool supports_context_fork = 8;
  bool supports_resume = 9;
  // SM-10, PER-17, FK-3: whether Humata can tell when a turn ends.
  bool supports_turn_signal = 10;
  repeated string models = 11;
  Revision revision = 12;
  // SE-21, shown in Settings › Agents.
  TurnEndSource turn_end_source = 13;
  // AGENTSET (D720): offered in pickers and startable. The plain shell is
  // always enabled.
  bool enabled = 14;
  // AGENTSET (D722): Humata installs the CLI on a machine that doesn't
  // have it, and never replaces one that is there. Off by default.
  bool install_when_missing = 15;
  // Whether the kind has an install command, so the option can be on.
  bool can_install = 16;
  // The command "Install when missing" runs (`bash -lc`), shown in
  // Settings › Agents; empty when there is none.
  string install_command = 17;
  // D782: the kind's permission and question asks wait in the Inbox. Off:
  // its permission hook and question hook get no decision, so the agent
  // asks in its own terminal, and a dialog seen on its screen raises no
  // card. RequestAccess, AskUser, file approvals and proposals still go to
  // the Inbox. Read from agents.toml at each ask; true for the shell and
  // when the file is missing or broken.
  bool asks_in_inbox = 18;
}


message ListAgentsRequest {
  // AGENTSET (D720): false lists only enabled kinds (pickers, CLI, MCP);
  // true lists every kind, for Settings › Agents.
  bool include_disabled = 1;
}

message SetAgentEnabledRequest {
  AgentId agent = 1;
  optional bool enabled = 2;
  optional bool install_when_missing = 3;
  // D782: unset leaves it as it is.
  optional bool asks_in_inbox = 4;
}

message ListAgentsResponse { repeated AgentDefinition agents = 1; }

message AddAgentRequest {
  IdempotencyKey idempotency_key = 1;
  AgentDefinition agent = 2;
  PresenceProof presence = 3;
}

message UpdateAgentRequest {
  IdempotencyKey idempotency_key = 1;
  AgentDefinition agent = 2;
  Revision expected_revision = 3;
  PresenceProof presence = 4;
}

// ---------------------------------------------------------------------------

message Marks {
  EntityRef entity = 1;
  bool pinned = 2;
  bool vip = 3;
  Revision revision = 4;
}

message SetMarksRequest {
  IdempotencyKey idempotency_key = 1;
  // Sessions, channels, machines, PR reviews and board items (NV-20); any
  // other kind fails with invalid_field.
  EntityRef entity = 2;
  optional bool pinned = 3;
  optional bool vip = 4;
}

message PinnedEntry {
  EntityRef entity = 1;
  string title = 2;
  // NV-21: the event shown there, if any ("needs input · 2m").
  string event = 3;
  google.protobuf.Timestamp event_at = 4;
  bool vip = 5;
}

message ListPinnedRequest {}

message ListPinnedResponse {
  repeated PinnedEntry entries = 1;
  Revision revision = 2;
}

message ReorderPinnedRequest {
  IdempotencyKey idempotency_key = 1;
  repeated EntityRef order = 2;
  Revision expected_revision = 3;
}

message ViewSessionRequest {
  SessionId session = 1;
}

message ViewSessionResponse {
  // Whether the session was unread until this view cleared it.
  bool was_unread = 1;
}

// ---------------------------------------------------------------------------

message ViewStateEntry {
  // Namespaced by the app: "session/<id>/rows", "diff/<id>/folds",
  // "panes/main". At most 64 KiB each.
  string key = 1;
  bytes value = 2;
  Revision revision = 3;
}

message GetViewStateRequest {
  // Prefix match.
  repeated string key_prefixes = 1;
}

message GetViewStateResponse { repeated ViewStateEntry entries = 1; }

message PutViewStateRequest {
  repeated ViewStateEntry entries = 1;
}

message PutViewStateResponse { repeated ViewStateEntry entries = 1; }
