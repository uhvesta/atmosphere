// The closed set of capabilities every call is checked against. One list for
// gRPC, MCP and the CLI; BOUNDARIES.md has the full table (scope, default,
// who may hold it) and the coverage matrix.
syntax = "proto3";

package humata.v1;

enum Capability {
  CAPABILITY_UNSPECIFIED = 0;

  // ----- Agent rules: one row each on a channel's Agent access tab
  // (IN-17), in the spec's order. Each has a channel-level Allow / Ask me /
  // Never and may get scoped "Always allow …" grants (IN-14, IN-22). What
  // needs no rule at all (IN-16: its own session, its own clones, its own
  // views and requests) has no capability; DecisionSource.OWNED reports it.
  // -----

  // "See its channel": machines of its channel, sessions on each (title,
  // agent, status), the channel board and Activity. Default Allow. (TP-1)
  CAPABILITY_CHANNEL_READ = 1;
  // "Global board, or other channels and their boards: see them". Default
  // Allow (D127.4). Writes there are GLOBAL_BOARD_WRITE (D155).
  CAPABILITY_GLOBAL_READ = 2;
  // Its own session board: add, edit, move, delete. Default Allow. A rule,
  // not part of the no-rule set (IN-16).
  CAPABILITY_OWN_BOARD_WRITE = 3;
  // Channel board: add items. Default Allow.
  CAPABILITY_CHANNEL_BOARD_ADD = 4;
  // Channel board: edit, move or delete items it created. Default Allow.
  CAPABILITY_CHANNEL_BOARD_EDIT_OWN = 5;
  // Channel board: edit, move or delete anyone else's items. Default Ask me.
  CAPABILITY_CHANNEL_BOARD_EDIT_OTHERS = 6;
  // Add, edit, move or delete items on the Global board or another
  // channel's boards, whoever made them. Default Ask me (BD-9, D155).
  CAPABILITY_GLOBAL_BOARD_WRITE = 7;
  // Write its own files into the channel's shared/ on its machine.
  // Default Allow. (FC-8; added row.)
  CAPABILITY_SHARED_WRITE = 8;
  // Prepare views and mark them ready (VW-1). Default Allow.
  CAPABILITY_VIEWS_PREPARE = 9;
  // Draft PR review comments and a review summary (PR-9, PR-12).
  // Default Allow.
  CAPABILITY_REVIEW_DRAFT = 10;
  // Comments sent to its own session are part of reading its own session
  // (IN-16, no rule; D21). Never offered, never checked; kept so the
  // number is not reused.
  CAPABILITY_OWN_COMMENTS_READ = 11 [deprecated = true];
  // "Ask you a question, or ask ahead for access" (IN-25, IN-26). Default
  // Allow. Asking ahead for a user-only action fails with user_only.
  CAPABILITY_INBOX_ASK = 12;
  // Read another session's files on the same machine, or watch its
  // terminal read-only (D21). Default Ask me.
  CAPABILITY_FILES_READ_OTHER_SESSION = 13;
  // Read files on another machine (bridged). Default Ask me.
  CAPABILITY_FILES_READ_OTHER_MACHINE = 14;
  // Copy files into its clone or shared/ from another session or machine.
  // Default Ask me.
  CAPABILITY_FILES_COPY_IN = 15;
  // Send a note or question to another session. Default Ask me.
  CAPABILITY_SESSION_NOTE = 16;
  // Type into another session's terminal. Default Ask me.
  CAPABILITY_SESSION_TYPE = 17;
  // Start or fork sessions on its own machine; also restore or rebuild an
  // archived session there, which launches an agent (D21). Default Ask me.
  CAPABILITY_SESSION_START_SAME_MACHINE = 18;
  // The same on another machine. Default Ask me.
  CAPABILITY_SESSION_START_OTHER_MACHINE = 19;
  // "Open a network connection through the Mac": a port forward over the
  // bridge (HO-10..12, BridgeService). Ask me or Never only: HO-11 opens a
  // forward only on the user's approval, so the rule has no Allow, an
  // "Always allow …" for one machine, host and port is the standing approval,
  // and it is never low-risk (D20). An uncontained agent can open its own
  // connections from its machine whatever this says (SEC-5, HO-12).
  CAPABILITY_NETWORK_REACH = 20;
  // "Stop or archive any session but itself" (D21, D306). Default Ask me.
  // Deleting another session is CAPABILITY_SESSION_DELETE_OTHER.
  CAPABILITY_SESSION_STOP_OTHER = 21;
  // Change channel settings, or remove a repo from a channel (not access:
  // that is user-only; not deleting the channel: that is CHANNEL_DELETE; not
  // adding a repo: that is CHANNEL_REPO_ADD). Default Never.
  CAPABILITY_CHANNEL_CHANGE = 22;
  // "Fetch files from shared/, the channel folder or a main clone on its
  // machine into its own clone" (file_fetch). Default Allow.
  CAPABILITY_FILES_FETCH_LOCAL = 23;

  // ----- More IN-17 rows (default Ask me unless noted). These were
  // escalation-only before the spec listed them; they are ordinary rules
  // now. -----

  // Rename itself, add or drop a repo, Give it its own copy.
  CAPABILITY_OWN_SESSION_MANAGE = 30;
  // Stop, archive or delete itself.
  CAPABILITY_OWN_SESSION_END = 31;
  // Move a session (itself or another) to another machine.
  CAPABILITY_SESSION_MOVE = 32;
  // Push its branch or open a PR through Humata (session_push, IN-24).
  // Only agents are checked against it: the user's own Push and open PR(s)
  // needs no rule. Review sessions follow PR-7 and PR-8 instead, and no
  // grant of this lets them push.
  CAPABILITY_GIT_PUSH = 33;
  // Start a PR review (PR-1).
  CAPABILITY_PR_REVIEW_START = 34;
  // "Add, create, start or stop machines; sync skills" (MP-24), and
  // Reconnect now.
  CAPABILITY_MACHINE_PROVISION = 35;
  // "Remove, forget or delete machines" (MP-24). Default Never.
  CAPABILITY_MACHINE_DESTROY = 36;
  // Restore something from trash.
  CAPABILITY_TRASH_RESTORE = 37;
  // Create a channel.
  CAPABILITY_CHANNEL_CREATE = 38;
  // The review chat's switches (PR-25), checked on the agent's own review.
  // Default Allow; the user turns each off in the review ("Agent may:").
  // A switch that's off is denied with Denied.SOURCE_REVIEW_SWITCH_OFF.
  // "Focus": move the review's view to a file or lines (review_focus).
  CAPABILITY_REVIEW_FOCUS = 39;
  // "Notes": leave, edit or drop notes for the user (review_note*).
  CAPABILITY_REVIEW_NOTE = 40;
  // "Order": reorder and group the review's files (review_prepare in the
  // review chat).
  CAPABILITY_REVIEW_ORDER = 41;
  // "Reply": answer in the thread of a comment typed into its own session
  // (comment_reply, DK-9).
  CAPABILITY_COMMENT_REPLY = 42;
  // "Resolve": resolve one with a note on what was done (comment_resolve,
  // SM-19).
  CAPABILITY_COMMENT_RESOLVE = 43;
  // "Stop or start all sessions on a machine" (STOP, D263). Default Never.
  CAPABILITY_MACHINE_SESSIONS_STOP = 44;
  // "Add a repo to a channel" (CH-26, D304): an agent proposes a GitHub repo
  // for a channel. Default Ask me. No "Always allow ..." (a grant would cover
  // one repo and be spent by its use).
  CAPABILITY_CHANNEL_REPO_ADD = 45;
  // "Move a Desk session into a channel" (DK-15, D305): a Desk session's
  // agent asks to move its own session; the target channel's rule decides.
  // Ask me or Never; no "Always allow ..."; never approved while away.
  CAPABILITY_DESK_MOVE_TO_CHANNEL = 46;
  // "Delete any session but itself" (D306), split from stopping and
  // archiving. Default Never.
  CAPABILITY_SESSION_DELETE_OTHER = 47;
  // SEAM (MACHINESCRIPTS, D688): "Run a machine script now" from an agent
  // (humata machine script run). Default Never. Triggered runs are the
  // owner's own automation and need no capability.
  CAPABILITY_MACHINE_SCRIPT_RUN = 48;

  // ----- User-only: no rule, never granted, no MCP tool. -----

  // SEC-7's list, one value per entry. IN-23: an agent's attempt is denied
  // at once with user_only and adds nothing to the Inbox.

  // Answer Inbox requests (approve, deny, reply, always).
  CAPABILITY_INBOX_ANSWER = 50;
  // Change rules, grants, While I'm away, default access, the approval
  // passphrase, CLI logins and script tokens.
  CAPABILITY_ACCESS_CHANGE = 51;
  // Change Settings (agents and their launch commands, providers, defaults,
  // prefix, retention, skills, notifications, long lines, Contain agents).
  CAPABILITY_SETTINGS_CHANGE = 52;
  // Pin, unpin, mark or clear VIP (NV-20).
  CAPABILITY_MARKS_CHANGE = 53;
  // Submit a PR review to GitHub; set "Let the agent push" (PR-8, PR-12).
  CAPABILITY_PR_SUBMIT = 54;
  // The user's own review state: Mark reviewed, unread marks, view offers
  // (Later, Not now, Revert, Keep), the user's comments and sending them.
  CAPABILITY_USER_REVIEW_STATE = 55;
  // Empty trash.
  CAPABILITY_TRASH_EMPTY = 56;
  // Host variable values, SSH host key pins, provider TOML.
  CAPABILITY_HOST_SECRETS = 57;
  // Delete a channel (CH-25). An agent has no way to ask for it.
  CAPABILITY_CHANNEL_DELETE = 58;
  // Change a machine's Humata root or VM tier.
  CAPABILITY_MACHINE_SETTINGS = 59;
  // Open a shell (a session's shell tab or a machine shell) or attach to a
  // terminal with input. Read-only attach is not this (SE-25).
  CAPABILITY_TERMINAL_INPUT = 60;

  // ----- Daemon to daemon. -----

  // A machine reporting pointers, mirror, status and journal for sessions
  // the host places on it, and forwarding its agents' calls.
  CAPABILITY_PEER_REPORT = 70;
  // The host controlling a machine it enrolled.
  CAPABILITY_HOST_CONTROL = 71;
}

// A rule's setting for one capability in one channel.
enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ALLOW = 1;
  DECISION_ASK = 2;
  DECISION_NEVER = 3;
}

// What a capability is checked against.
enum CapabilityScope {
  CAPABILITY_SCOPE_UNSPECIFIED = 0;
  CAPABILITY_SCOPE_SESSION = 1;  // the caller's own session
  CAPABILITY_SCOPE_CHANNEL = 2;  // the caller's channel
  CAPABILITY_SCOPE_MACHINE = 3;  // a machine
  CAPABILITY_SCOPE_GLOBAL = 4;   // everything
}
