// The host's change feed (TR-3, TR-4). One ordered sequence per host; every
// committed change to host state is one event. Clients read lists once, then
// follow this feed instead of polling. Terminal bytes are not events
// (TerminalService.Attach); transfers and operations appear here only as
// state changes, not per chunk.
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/access.proto";
import "humata/v1/boards.proto";
import "humata/v1/channels.proto";
import "humata/v1/common.proto";
import "humata/v1/desk.proto";
import "humata/v1/errors.proto";
import "humata/v1/files.proto";
import "humata/v1/hosts.proto";
import "humata/v1/inbox.proto";
import "humata/v1/operations.proto";
import "humata/v1/review.proto";
import "humata/v1/sessions.proto";
import "humata/v1/settings.proto";

service EventService {
  // Events after `after`, then live ones. The stream never ends on its own.
  // When `after` is older than the oldest event kept, the first message is
  // Resync and the stream continues from the present (GRPC.md §6).
  // Events the caller may not see are left out; seq numbers then skip.
  rpc Subscribe(SubscribeRequest) returns (stream Event);
}

message SubscribeRequest {
  // Unset: from now.
  EventSeq after = 1;
  // Empty: everything the caller may see.
  repeated ChannelId channels = 2;
  repeated SessionId sessions = 3;
  repeated Topic topics = 4;
}

enum Topic {
  TOPIC_UNSPECIFIED = 0;
  TOPIC_SESSIONS = 1;
  TOPIC_CHANNELS = 2;
  TOPIC_MACHINES = 3;
  TOPIC_BOARDS = 4;
  TOPIC_INBOX = 5;
  TOPIC_ACCESS = 6;
  TOPIC_COMMENTS = 7;
  TOPIC_VIEWS = 8;
  TOPIC_OPERATIONS = 9;
  TOPIC_TRANSFERS = 10;
  TOPIC_ACTIVITY = 11;
  TOPIC_MARKS = 12;
  TOPIC_SETTINGS = 13;
  TOPIC_JOURNAL = 14;
}

message Event {
  EventSeq seq = 1;
  google.protobuf.Timestamp at = 2;
  Actor by = 3;
  Change change = 4;
  // Set when the change came from a journal replay (SL-5).
  JournalPosition journal = 5;
  // The entity as it is after the change.
  oneof payload {
    Session session = 10;
    Channel channel = 11;
    Machine machine = 12;
    BoardItem board_item = 13;
    InboxRequest request = 14;
    Grant grant = 15;
    Comment comment = 16;
    PreparedView view = 17;
    Operation operation = 18;
    Transfer transfer = 19;
    ActivityEvent activity = 20;
    Marks marks = 21;
    Settings settings = 22;
    ChannelRules rules = 23;
    JournalReplayed journal_replayed = 24;
    ProvisionalIdResolved provisional_id_resolved = 25;
    PointersUpdated pointers = 26;
    Resync resync = 27;
    HostLinkChanged host_link = 28;
    PolicyCopyKept policy_copy = 29;
    PullRequestHeadsChanged pull_request_heads = 30;
    FileChanged file_changed = 31;
    // SEAM (D438): the history index caught a session up.
    HistoryIndexed history_indexed = 32;
    // SEAM (DESKWATCH): a Desk session, plain or a channel's own, as it is
    // after the change; on Change DELETED only `session` is set. Scoped to
    // the session (channel "desk" for a plain one), sent as Session is.
    DeskSession desk = 33;
    // SEAM (MACHINESCRIPTS, D686): a machine's script run started, moved or
    // ended; read it with ListMachineScriptRuns. On TOPIC_MACHINES, to the
    // user only.
    MachineScriptRunChanged machine_script_run = 34;
    // SETTINGSFIX: a `humata login` arrived (CREATED) or settled/withdrew
    // (DELETED). On TOPIC_INBOX, to the user only.
    PendingCliLogin pending_cli_login = 35;  // next free: 36
  }
}

// D686: a machine's script run changed. Sent on TOPIC_MACHINES.
message MachineScriptRunChanged {
  MachineId machine = 1;
  string run_id = 2;
}

// AWAY: a machine's daemon gained or lost its host's link (GRPC.md §9).
// Sent on TOPIC_MACHINES, to the user only, by machines' daemons.
message HostLinkChanged {
  bool reachable = 1;
}

// AWAY: a machine's daemon kept a new policy copy from its host (D220).
// Sent on TOPIC_MACHINES, to the user only, by machines' daemons.
message PolicyCopyKept {
  uint64 revision = 1;
}

// D286: on TOPIC_SESSIONS, scoped to the session, when a poll finds a
// review's pull request with new commits, a force push or a new state.
message PullRequestHeadsChanged {
  SessionId session = 1;
  // Same shape and meaning as CheckHeadsResponse.changes.
  repeated HeadChange changes = 2;
}

// Bug 23: a file was added to, removed from or renamed in a session's clone,
// by the user's write or the agent's edit; a changed file's text is not
// news. On TOPIC_SESSIONS, scoped to the session, as PullRequestHeadsChanged
// is. A branch switch tells at most 500 files; read the list again after one.
message FileChanged {
  SessionId session = 1;
  RepoRef repo = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CREATED = 1;
    KIND_DELETED = 2;
    KIND_RENAMED = 3;
  }
  Kind kind = 3;
  // Relative to the clone's root; for a rename, where the file is now.
  string path = 4;
  // Only for a rename: where the file was.
  string old_path = 5;
  bool folder = 6;
}

// D438: the host's history index added entries of a session's conversation,
// read from this host's file or from the session's machine. On
// TOPIC_SESSIONS, scoped to the session, as FileChanged is. A search made
// before it may have missed those entries: search again.
message HistoryIndexed {
  SessionId session = 1;
  // How many entries were added; never 0.
  uint64 added = 2;
}

// AW-6: one machine's journal has been replayed up to `through`.
message JournalReplayed {
  MachineId machine = 1;
  uint64 through_seq = 2;
  uint32 applied = 3;
  // Applied, then overwritten by a later write (SL-6); kept in history.
  uint32 lost_conflicts = 4;
  repeated JournalRejection rejected = 5;
}

// A journaled write the host refused on replay (the rule changed, the item
// was deleted, the session ended). The agent is told through its session.
message JournalRejection {
  JournalPosition position = 1;
  string operation = 2;   // the MCP operation id, "board.item_update"
  Error error = 3;
}

message ProvisionalIdResolved {
  BoardItemId provisional = 1;
  BoardItemId final = 2;
}

// SL-3. Sent when a session's pointers change, coalesced to at most one per
// session per second.
message PointersUpdated {
  SessionId session = 1;
  repeated Pointer pointers = 2;
}

message Resync {
  // The oldest seq still kept. Refetch lists, then continue from this stream.
  EventSeq earliest = 1;
}
