// Sessions: start, fork, move, archive, restore, delete, rebuild, repos,
// push, notes and questions between sessions. The host owns the
// record (SL-1); the session's machine runs it and reports pointers (SL-3).
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/common.proto";
import "humata/v1/operations.proto";
import "humata/v1/channels.proto";
import "humata/v1/errors.proto";

service SessionService {
  // SE-1..4. Returns at once; the operation writes and fsyncs the record
  // (PER-11), makes the clones, launches the agent.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse);
  // FC-15: the branch names Start or Fork would use, with suffixes.
  rpc PreviewBranchNames(PreviewBranchNamesRequest) returns (PreviewBranchNamesResponse);
  rpc GetSession(GetSessionRequest) returns (Session);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // FC-17: never renames the branch.
  rpc RenameSession(RenameSessionRequest) returns (Session);
  // Stops the agent; the session stays (SE-14 then offers Resume).
  rpc StopSession(StopSessionRequest) returns (Session);
  // SE-15, PER-15.
  rpc ResumeSession(ResumeSessionRequest) returns (Operation);
  // FK-3: the turns a fork may start before. From the agent's adapter.
  rpc ListTurns(ListTurnsRequest) returns (ListTurnsResponse);
  // FK-4: the text preview and cost the dialog shows.
  rpc PreviewFork(ForkSessionRequest) returns (ForkPreview);
  rpc ForkSession(ForkSessionRequest) returns (Operation);
  // FK-9.
  rpc GiveOwnCopy(GiveOwnCopyRequest) returns (Operation);
  // MV-1..6.
  rpc MoveSession(MoveSessionRequest) returns (Operation);
  // MV-8, MV-9: forks that keep running and unpushed work per repo.
  rpc PlanArchive(PlanArchiveRequest) returns (ArchivePlan);
  rpc ArchiveSession(ArchiveSessionRequest) returns (Operation);
  // LD-4.
  rpc RestoreSession(RestoreSessionRequest) returns (Operation);
  // LD-5: to trash, after the unpushed-work check.
  rpc PlanDelete(PlanDeleteRequest) returns (DeletePlan);
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  // SL-4, LD-11: rebuild an archived-by-forget session on another machine.
  rpc RebuildSession(RebuildSessionRequest) returns (Operation);
  // CH-21.
  rpc AddRepoToSession(AddRepoToSessionRequest) returns (Operation);
  // CH-23.
  rpc PlanDropRepo(PlanDropRepoRequest) returns (DropRepoPlan);
  rpc DropRepo(DropRepoRequest) returns (Session);
  // MV-12: per repo branch and change totals.
  rpc PlanPush(PlanPushRequest) returns (PushPlan);
  rpc PushAndOpenPullRequests(PushAndOpenPullRequestsRequest) returns (Operation);
  // LD-3: an archived session's conversation, read-only, from the mirror.
  rpc ReadConversation(ReadConversationRequest) returns (ReadConversationResponse);
  // TP-5. Typed into the target as one message naming the sender, when its
  // turn ends.
  rpc SendNote(SendNoteRequest) returns (SendNoteResponse);
  // TP-5. The call returns when the target answers (AnswerQuestion) or
  // declines, or when the question expires.
  rpc AskSession(AskSessionRequest) returns (AskSessionResponse);
  // Called by the target agent (MCP session_answer) for a question typed
  // into its terminal.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  // SE-21, D169: the session's own agent (its hooks, through `humata turn`)
  // says what turn it is in. Anyone else is refused. Repeating the state it
  // has is a no-op.
  rpc ReportTurn(ReportTurnRequest) returns (ReportTurnResponse);
  // HOOKS, D191: the session's own agent's permission hook (`humata hook`)
  // passes on the payload its agent wrote. The daemon raises one Inbox
  // card and answers with keepalives, then once with the bytes the hook
  // prints; empty bytes are no decision, and the agent's TUI asks. The
  // card is withdrawn when the stream drops. Anyone else is refused.
  rpc Hook(HookRequest) returns (stream HookReply);
}

message SessionRepo {
  RepoRef repo = 1;
  string branch = 2;
  string path = 3;
  bool main_clone = 4;
}

// SL-3: what the machine last reported for one repo of a session.
message Pointer {
  RepoRef repo = 1;
  string path = 2;
  string branch = 3;
  string head_sha = 4;
  string upstream = 5;          // "origin/uhvesta/flaky-test-hunt"; empty if none
  bool pushed = 6;              // HEAD is on the upstream
  uint32 unpushed_commits = 7;
  uint32 dirty_files = 8;
  google.protobuf.Timestamp reported_at = 9;
  // The dirty files' paths and the unpushed commits' subjects, as many as
  // fit a report, so a forgotten machine's loss can be named (LD-11, SL-4).
  repeated string dirty_paths = 10;
  repeated string unpushed_subjects = 11;
}

message ForkOrigin {
  SessionId parent = 1;
  ForkKind kind = 2;
  // 0: from now. n: before turn n.
  uint32 before_turn = 3;
}

message PullRequestBinding {
  repeated PullRequestRef pull_requests = 1;
  // PR-8. Only the user sets it.
  bool push_allowed = 2;
}

message ArchiveSummary {
  message Repo {
    RepoRef repo = 1;
    string branch = 2;
    string last_pushed_sha = 3;
    repeated FileChange files = 4;
    // LD-11: the subjects of the commits that were never pushed.
    repeated string unpushed_subjects = 5;
  }
  google.protobuf.Timestamp archived_at = 1;
  repeated Repo repos = 2;
  // LD-11: archived because its machine was forgotten.
  bool machine_lost = 3;
  // What was lost, from the last pointers.
  repeated SessionWork lost = 4;
}

message FileChange {
  string path = 1;
  uint32 added = 2;
  uint32 removed = 3;
}

// AW-9, D267: board writes this session's agent made while the host was away
// that the host's rules no longer allowed at replay, from the latest link-up
// that left any out. Unset when none has.
message AwayWritesLeftOut {
  uint32 count = 1;
  // Items whose history keeps the write as lost (the first few).
  repeated BoardItemId items = 2;
  // Titles of the new items that weren't made (the first few); their only trace.
  repeated string not_made = 3;
  // True if any is now refused (Never); false if all now say Ask me.
  bool refused = 4;
  google.protobuf.Timestamp at = 5;
}

message Session {
  SessionId id = 1;
  ChannelId channel = 2;
  string title = 3;
  AgentId agent = 4;
  string model = 5;
  MachineId machine = 6;
  SessionStatus status = 7;
  repeated SessionRepo repos = 8;
  repeated Pointer pointers = 9;
  ForkOrigin fork_origin = 10;
  repeated SessionId forks = 11;
  // PER-12, pinned at launch.
  string conversation_id = 12;
  // Spec mode, dropped with SM-1 and SM-2 (D104).
  reserved 13, 14;
  reserved "spec_mode", "spec_files";
  PullRequestBinding pull_request = 15;
  ArchiveSummary archive = 16;
  BoardItemId board_item = 17;
  google.protobuf.Timestamp started_at = 18;
  google.protobuf.Timestamp last_output_at = 19;
  int32 exit_code = 20;
  uint32 pending_requests = 21;
  bool unread = 22;
  // NV-20, this user's marks.
  bool pinned = 23;
  bool vip = 24;
  // The session's own operation in progress, if any; others fail with
  // Error.session_busy meanwhile.
  OperationId running_operation = 25;
  Revision revision = 26;
  // SE-21: where this session's turn ends come from.
  TurnEndSource turn_end = 27;
  // SEC-6: launched or last resumed contained.
  bool contained = 28;
  // Set while status is RESUME_FAILED: why the resume failed, so the app
  // can name the fix (frame 46 "Couldn't resume"). Unset otherwise.
  ResumeFailed resume_failed = 29;
  // When a daemon restart interrupted this session's agent; unset if no
  // restart has. The app shows "Restarted at 09:12" from it (frame 46).
  google.protobuf.Timestamp interrupted_at = 30;
  // Set only while status is RESUME_FAILED: what "Start fresh with a summary"
  // would summarize (D143). Unspecified otherwise.
  SummarySource summary_source = 31;
  // AW-9, D267: what the host left out of this session's agent's writes when
  // its machine reconnected. The app draws one line under the agent's
  // terminal output from it; unset when nothing was left out.
  AwayWritesLeftOut away_left_out = 32;

  enum SummarySource {
    SUMMARY_SOURCE_UNSPECIFIED = 0;
    // The old conversation file exists and has something in it.
    SUMMARY_SOURCE_TRANSCRIPT = 1;
    // No transcript, but the terminal's saved output has text.
    SUMMARY_SOURCE_SCROLLBACK = 2;
    // Nothing is left: the new agent is told only the title.
    SUMMARY_SOURCE_NONE = 3;
  }
}

message RepoChoice {
  RepoRef repo = 1;
  // False: "Leave this repo out" (FC-4).
  bool include = 2;
}

message StartSessionRequest {
  IdempotencyKey idempotency_key = 1;
  ChannelId channel = 2;
  string title = 3;
  AgentId agent = 4;
  string model = 5;
  MachineId machine = 6;
  repeated RepoChoice repos = 7;
  // Typed once the agent starts; empty starts at the prompt.
  string first_message = 8;
  BoardItemId board_item = 9;
  // A session's spec files, dropped with SM-2 (D104).
  reserved 10;
  reserved "spec_files";
  // FC-15: a branch edited in the dialog, used as typed for every included
  // repo with no prefix; empty: Humata picks from the title.
  string branch = 11;
  // SL-4: set only by the host, to place a session it rebuilds from its own
  // records on this machine. Any other caller is refused.
  RebuildFrom rebuild = 12;
}

// What the host gives a machine to rebuild a lost session on it: each repo
// is cloned again at its branch (the last pushed sha, main if never pushed),
// the conversation lines are written as the agent's conversation, the agent
// resumes it and `first_message` tells it what was lost.
message RebuildFrom {
  message Repo {
    RepoRef repo = 1;
    string branch = 2;
  }
  repeated Repo repos = 1;
  // The session's folder name under the channel's `sessions/`.
  string folder = 2;
  // Where the lost machine kept the session, so paths in the lines can be
  // made this machine's own.
  string old_folder = 3;
  // The host's scrubbed copy of the conversation file, whole lines. The host
  // now sends it as `conversation_staged` instead, so no message size bounds
  // it; read only when that is empty.
  bytes conversation = 4;
  // Where the host copied that file in the channel's folder on this machine,
  // `.carry/<operation>/conversation.jsonl`; this machine removes the
  // `.carry/<operation>` folder once it has read it. Empty: no file was sent.
  string conversation_staged = 5;
}

message StartSessionResponse {
  SessionId session = 1;
  Operation operation = 2;
}

message PreviewBranchNamesRequest {
  ChannelId channel = 1;
  string title = 2;
  MachineId machine = 3;
  repeated RepoRef repos = 4;
}

message PreviewBranchNamesResponse {
  message Name {
    RepoRef repo = 1;
    string branch = 2;
    // FC-14: why a suffix was added, when one was.
    string suffix_reason = 3;
  }
  repeated Name names = 1;
}

message GetSessionRequest { SessionId id = 1; }

message ListSessionsRequest {
  // Unset: every channel the caller may read.
  ChannelId channel = 1;
  MachineId machine = 2;
  bool include_archived = 3;
  PageRequest page = 4;
}

message ListSessionsResponse {
  // Tree order: parents before forks (CH-12).
  repeated Session sessions = 1;
  PageResponse page = 2;
}

message RenameSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  string title = 3;
  Revision expected_revision = 4;
  // FC-17: also rename the branch from the new title; refused once pushed.
  bool rename_branch = 5;
}

message StopSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
}

message ResumeSessionRequest {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_RESUME = 1;                     // pinned conversation id
    MODE_START_FRESH_WITH_SUMMARY = 2;   // PER-15
  }
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  Mode mode = 3;
}

message ListTurnsRequest {
  SessionId session = 1;
  PageRequest page = 2;
}

message Turn {
  uint32 index = 1;
  string user_text = 2;   // first line of what was asked
  google.protobuf.Timestamp at = 3;
}

message ListTurnsResponse {
  repeated Turn turns = 1;
  PageResponse page = 2;
}

message ForkSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId parent = 2;
  ForkKind kind = 3;
  // 0: from now.
  uint32 before_turn = 4;
  string title = 5;
  AgentId agent = 6;
  string model = 7;
  MachineId machine = 8;
  // FC-15: used as typed for every repo of the fork, as StartSessionRequest.branch;
  // empty: Humata picks one from the title. Context-only forks have no branch to name.
  string branch = 9;
}

message ForkPreview {
  string text = 1;
  repeated PreviewBranchNamesResponse.Name branches = 2;
  uint64 copy_bytes = 3;
  // FK-6: a different agent or no context forks; the summary is seeded.
  bool seeded_with_summary = 4;
}

message GiveOwnCopyRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId fork = 2;
}

message MoveSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  MachineId to = 3;
}

message PlanArchiveRequest { SessionId id = 1; }

message ArchivePlan {
  SessionId id = 1;
  uint32 forks_keep_running = 2;
  repeated UnpushedRepo unpushed = 3;
  repeated ArchiveChoice choices = 4;
  // PR-17: undrafted review comments that would be dropped.
  uint32 unsubmitted_drafts = 5;
  PlanToken token = 6;
}

message UnpushedRepo {
  RepoRef repo = 1;
  string branch = 2;
  uint32 dirty_files = 3;
  uint32 unpushed_commits = 4;
  bool never_pushed = 5;
}

message ArchiveSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  ArchiveChoice choice = 3;
  PlanToken plan = 4;
}

message RestoreSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  MachineId machine = 3;
}

message PlanDeleteRequest { SessionId id = 1; }

message DeletePlan {
  SessionId id = 1;
  repeated UnpushedRepo unpushed = 2;
  PlanToken token = 3;
}

message DeleteSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  PlanToken plan = 3;
}

message DeleteSessionResponse {
  TrashItemId trash_item = 1;
}

message RebuildSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  MachineId machine = 3;
}

message AddRepoToSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  RepoRef repo = 3;
}

message PlanDropRepoRequest {
  SessionId id = 1;
  RepoRef repo = 2;
}

message DropRepoPlan {
  SessionId id = 1;
  UnpushedRepo work = 2;
  PlanToken token = 3;
}

message DropRepoRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  RepoRef repo = 3;
  PlanToken plan = 4;
}

message PlanPushRequest { SessionId id = 1; }

message PushPlan {
  message Repo {
    RepoRef repo = 1;
    string branch = 2;
    uint32 dirty_files = 3;
    uint32 unpushed_commits = 4;
    uint32 added = 5;
    uint32 removed = 6;
    // An open PR for this branch already exists.
    PullRequestRef existing = 7;
  }
  SessionId id = 1;
  repeated Repo repos = 2;
  PlanToken token = 3;
}

message PushChoice {
  RepoRef repo = 1;
  // Commit uncommitted files first with this message; empty: don't commit.
  string commit_message = 2;
  bool open_pull_request = 3;
  string pr_title = 4;
  string pr_body = 5;
}

message PushAndOpenPullRequestsRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId id = 2;
  repeated PushChoice repos = 3;
  PlanToken plan = 4;
  // VW-13: the pull request view this came from, if any; its fields are
  // what was shown, edited.
  ViewId from_view = 5;
}

message ReadConversationRequest {
  SessionId id = 1;
  PageRequest page = 2;
}

message TranscriptEntry {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_USER = 1;
    ROLE_AGENT = 2;
    ROLE_TOOL = 3;
  }
  Role role = 1;
  string text = 2;
  google.protobuf.Timestamp at = 3;
}

message ReadConversationResponse {
  repeated TranscriptEntry entries = 1;
  PageResponse page = 2;
}

message SendNoteRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId to = 2;
  string text = 3;
  // Shown on the Inbox card when the rule asks.
  string reason = 4;
}

message SendNoteResponse {
  Delivery delivery = 1;
  JournalPosition journal = 2;
  // True once typed into the target; false while queued for its turn end.
  bool typed = 3;
}

message AskSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId to = 2;
  string question = 3;
  string reason = 4;
  // 0: the default, 30 minutes.
  uint32 timeout_seconds = 5;
}

// A question between sessions, "qu_<ulid>".
message QuestionId { string value = 1; }

message AskSessionResponse {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    OUTCOME_ANSWERED = 1;
    OUTCOME_DECLINED = 2;
    OUTCOME_EXPIRED = 3;
  }
  Outcome outcome = 1;
  string answer = 2;
}

message AnswerQuestionRequest {
  IdempotencyKey idempotency_key = 1;
  // The id typed into the terminal with the question.
  QuestionId question = 2;
  string answer = 3;
  bool decline = 4;
}

message AnswerQuestionResponse {}

// What an agent's hooks say about its turn (D169).
enum TurnState {
  TURN_STATE_UNSPECIFIED = 0;
  // A turn began or goes on: a prompt was submitted, a tool batch ended.
  TURN_STATE_WORKING = 1;
  // The turn ended.
  TURN_STATE_IDLE = 2;
  // The agent waits for the user: a permission or a question.
  TURN_STATE_NEEDS_INPUT = 3;
}

message ReportTurnRequest {
  TurnState state = 1;
  // When the hook's process started (unix ns). Async hooks can overtake each
  // other, so the daemon keeps the newest report and drops an older one.
  int64 reported_at_unix_ns = 2;
}

message ReportTurnResponse {}

message HookRequest {
  // The agent as the hook command names it: claude, codex or copilot.
  string agent = 1;
  // The hook: permission.
  string event = 2;
  // What the agent wrote to the hook's stdin, as it is (at most 1 MiB).
  bytes payload = 3;
}

message HookReply {
  // Nothing yet: the hold goes on.
  bool keepalive = 1;
  // What the hook prints, sent once and last; empty is no decision.
  bytes stdout = 2;
}

// D195: how a session crosses machines. The host's driver calls these on
// the machine that has the session and on the one that gets it; no one else
// may (the daemon refuses every caller but the host, as it does
// HistoryService.ReadMirror). The folder and the staged files travel through
// TransferEndService; these calls stage, check and tidy. Each is keyed by the
// host's operation id and safe to repeat.
service SessionCarryService {
  // On the old machine: stages the session's records, the agent's files and
  // the move manifest (MV-14) under the channel's `.carry/<operation>/stage`.
  rpc Pack(CarryPackRequest) returns (CarryPackResponse);
  // On the new machine: checks every item of the copy against the manifest,
  // rewrites the old folder's path in the copy, places the agent's files and
  // brings the records in, with the agent saved as one to resume.
  rpc Unpack(CarryUnpackRequest) returns (CarryUnpackResponse);
  // On the old machine, once the session runs on the new one: its folder and
  // the agent's files go to the machine's trash and its records are dropped.
  rpc Release(CarryReleaseRequest) returns (CarryReleaseResponse);
  // On the new machine, for a move that failed or was undone before it
  // switched: removes the copy, the agent's files and the records brought in.
  // On the old machine it removes the staged files.
  rpc Abort(CarryAbortRequest) returns (CarryAbortResponse);
  // On the machine that has the parent of a fork onto another machine: the
  // branch the fork's clones would get there and the bytes they would copy
  // (FK-4). It stages nothing.
  rpc PreviewFork(CarryPreviewForkRequest) returns (CarryPreviewForkResponse);
}

message CarryPackRequest {
  string operation = 1;
  SessionId session = 2;
  // Set: stage a fork of `session` for another machine (FK-8) instead of the session itself.
  CarryFork fork = 3;
}

message CarryFork {
  // The fork's own id, chosen by the host.
  SessionId session = 1;
  string title = 2;
  ForkKind kind = 3;
  uint32 before_turn = 4;
  // As ForkSessionRequest.branch; empty: picked from the title.
  string branch = 5;
}

message CarryPackResponse {
  // The session's folder under the channel's folder, `sessions/<name>`.
  string folder = 1;
  // The staged files under the channel's folder.
  string stage = 2;
  // Equal for two packs of a session that didn't change in between.
  string digest = 3;
  uint32 files = 4;
  uint64 bytes = 5;
  // A staged fork: the branch its clones are on, and its conversation id (empty for a code-only fork).
  string branch = 6;
  string conversation_id = 7;
  // The session's agent was running when it was packed: a move that is
  // undone starts it again on the old machine, and a session the user had
  // stopped stays stopped.
  bool agent_running = 8;
}

message CarryUnpackRequest {
  string operation = 1;
  SessionId session = 2;
  ChannelId channel = 3;
}

message CarryUnpackResponse {
  uint32 files = 1;
  uint64 bytes = 2;
}

message CarryReleaseRequest {
  string operation = 1;
  SessionId session = 2;
}

message CarryReleaseResponse {
  // What went to the trash, as the trash describes it.
  repeated string trashed = 1;
}

message CarryAbortRequest {
  string operation = 1;
  SessionId session = 2;
  ChannelId channel = 3;
  // The session's folder under the channel's, `sessions/<name>`.
  string folder = 4;
  // Whether this is the machine the session was going to (true) or leaving.
  bool incoming = 5;
}

message CarryAbortResponse {}

message CarryPreviewForkRequest {
  // The parent.
  SessionId session = 1;
  // The fork's title, cleaned by the host; the branch is picked from it.
  string title = 2;
  // As ForkSessionRequest.branch; empty: picked from the title.
  string branch = 3;
}

message CarryPreviewForkResponse {
  // The branch every one of the fork's clones would be on.
  string branch = 1;
  // The parent's repositories, which the fork would copy.
  repeated RepoRef repos = 2;
  uint64 copy_bytes = 3;
}
