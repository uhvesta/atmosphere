// Diffs, the one comment model (SM-13), PR reviews and prepared views.
// Diffs are computed on the session's machine; comments, drafts and views
// live on the host (SL-1).
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/access.proto";
import "humata/v1/common.proto";
import "humata/v1/errors.proto";
import "humata/v1/operations.proto";

service DiffService {
  // RV-1, RV-2: per repo, per file totals.
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse);
  // RV-3, RV-17: one file's hunks, with outdated/draft markers left to
  // CommentService.
  rpc GetFileDiff(GetFileDiffRequest) returns (FileDiff);
  // RV-6, RV-28. User-only: it decides what the user sees as new.
  rpc MarkReviewed(MarkReviewedRequest) returns (MarkReviewedResponse);
  // RV-30: the reviews kept per repo, for "Since review 3, Tuesday 14:02".
  rpc ListReviewedSnapshots(ListReviewedSnapshotsRequest)
      returns (ListReviewedSnapshotsResponse);
  // The branches one repository's changes can be compared with, read from
  // refs/remotes/origin/* as of the last fetch (nothing is fetched), with
  // the default branch first.
  rpc ListBases(ListBasesRequest) returns (ListBasesResponse);
  // Frame 98: has Humata ask the remote for its default branch in one
  // repository's clone (`git remote set-head origin --auto`), on the
  // session's machine, when GetDiff answered NoDefaultBranch. User-only,
  // like MarkReviewed. Running it again is harmless.
  rpc FindDefaultBranch(FindDefaultBranchRequest)
      returns (FindDefaultBranchResponse);
}

service CommentService {
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  // The user's comments, and the agent's PR drafts (PR-9).
  rpc CreateComment(CreateCommentRequest) returns (Comment);
  rpc EditComment(EditCommentRequest) returns (Comment);
  rpc DropComment(DropCommentRequest) returns (DropCommentResponse);
  // SM-7 Re-attach.
  rpc ReattachComment(ReattachCommentRequest) returns (Comment);
  // RV-5, SM-9, SM-10: one bracketed paste, typed at once (D151). Only
  // terminal-bound drafts; PR drafts post with SubmitReview.
  rpc SendComments(SendCommentsRequest) returns (SendCommentsResponse);
  rpc ResolveComment(ResolveCommentRequest) returns (Comment);
  // SM-18 Resolve N addressed: every addressed comment of one file, or of the
  // session, resolved as the user. User only.
  rpc ResolveAddressedComments(ResolveAddressedCommentsRequest) returns (ResolveAddressedCommentsResponse);
  // SM-11: back to draft.
  rpc ReopenComment(ReopenCommentRequest) returns (Comment);
  // SE-23 Remove: comments Humata is holding (QUEUED) go back to drafts.
  // For a batch whose delivery is unconfirmed, the whole batch goes back.
  rpc TakeBackComments(TakeBackCommentsRequest) returns (TakeBackCommentsResponse);
  // DK-9: the session's agent answers in a comment's thread.
  rpc ReplyToComment(ReplyToCommentRequest) returns (Comment);
  // SM-20, SM-21: user only. Archive hides a comment everywhere without
  // marking it dealt with; its status is kept for Unarchive.
  rpc ArchiveComment(ArchiveCommentRequest) returns (Comment);
  rpc UnarchiveComment(UnarchiveCommentRequest) returns (Comment);
  // D284: the note becomes a draft for a pull request of its session, in
  // place: the same comment, its id, author and anchor kept; never a copy.
  // The pull request is the one of the session's reviews whose repository
  // the note is on. INVALID_FIELD when the note's repository isn't one of the
  // review's (or, with two pull requests in it, `pr` is missing or not one of
  // the review's); NOT_FOUND when the note isn't there; FAILED_PRECONDITION
  // when it isn't a note.
  rpc MakeNoteADraft(MakeNoteADraftRequest) returns (Comment);
  // D151, D161: the app's feed of one session's comments, every change the
  // daemon saves, in order. The first event is `resync`, so a listing made
  // after it misses nothing; a later `resync` means the feed fell behind
  // and the app lists again. User only.
  rpc WatchComments(WatchCommentsRequest) returns (stream CommentFeedEvent);
}

service PullRequestReviewService {
  // PR-1, PR-3: title, author, branches, size, checks.
  rpc ResolvePullRequest(ResolvePullRequestRequest) returns (PullRequestInfo);
  // PR-4..6.
  rpc StartReview(StartReviewRequest) returns (Operation);
  // PR-15 on demand; the host also polls.
  rpc CheckHeads(CheckHeadsRequest) returns (CheckHeadsResponse);
  // PR-16.
  rpc UpdateClone(UpdateCloneRequest) returns (Operation);
  // PR-8. User-only.
  rpc SetPushAllowed(SetPushAllowedRequest) returns (SetPushAllowedResponse);
  // PR-12: drafts per PR, the drafted summary, verdict choices.
  rpc PlanSubmit(PlanSubmitRequest) returns (SubmitPlan);
  // PR-12..14. User-only. One review per PR; partial failure keeps the
  // unposted drafts (Error.review_partly_posted).
  rpc SubmitReview(SubmitReviewRequest) returns (SubmitReviewResponse);
  // The agent's draft of the review summary (PR-12).
  rpc DraftSummary(DraftSummaryRequest) returns (DraftSummaryResponse);
  // A9 (D299): the PR's commits, which are reviewed, and the history.
  rpc ListPullRequestCommits(ListPullRequestCommitsRequest) returns (PullRequestCommits);
  // A9. User-only.
  rpc MarkCommitsReviewed(MarkCommitsReviewedRequest) returns (PullRequestCommits);
}

service ViewService {
  // VW-1, VW-14. Makes a draft view: not offered and not in the Journal
  // until MarkReady.
  rpc PrepareView(PrepareViewRequest) returns (PreparedView);
  // VW-14: replace a view's content while it is still a draft, as often as
  // the agent likes. A ready view fails with invalid_field.
  rpc ReviseView(ReviseViewRequest) returns (PreparedView);
  // VW-2: the offer bar appears.
  rpc MarkReady(MarkReadyRequest) returns (PreparedView);
  // VW-10.
  rpc ListViews(ListViewsRequest) returns (ListViewsResponse);
  // VW-4..9. User-only. The pre-open screen state for Revert is kept by
  // the app, not here (REVIEW.md).
  rpc SetViewState(SetViewStateRequest) returns (PreparedView);
}

// PR-22–PR-26 (D59): the review chat's agent works the user's view of
// their review. The app reports what is on screen; the agent reads it,
// moves the view and leaves notes (CommentService with a `note`
// destination); each change comes back to the app at once, with Undo.
service ReviewChatService {
  // review_context: what the user is looking at.
  rpc GetReviewContext(GetReviewContextRequest) returns (ReviewContext);
  // The app, debounced while the user scrolls: the view as it is now.
  // User-only.
  rpc ReportReviewView(ReportReviewViewRequest)
      returns (ReportReviewViewResponse);
  // review_focus. Denied (SOURCE_REVIEW_SWITCH_OFF) when "Focus" is off.
  rpc FocusReview(FocusReviewRequest) returns (ReviewChange);
  // The chat line's Undo (PR-24). User-only.
  rpc UndoReviewChange(UndoReviewChangeRequest) returns (ReviewChange);
  // The app's feed of the agent's changes, in order, to apply once the
  // user stops scrolling, typing or selecting (PR-24). Resumes after `seq`.
  rpc WatchReviewChanges(WatchReviewChangesRequest)
      returns (stream ReviewChange);
  // PR-25: "Agent may: Focus, Notes, Order". User-only.
  rpc SetAgentSwitches(SetAgentSwitchesRequest) returns (AgentSwitches);
}

// ---------------------------------------------------------------------------

message DiffBase {
  oneof base {
    OriginMain origin_main = 1;            // where the branch started
    UncommittedOnly uncommitted_only = 2;
    SinceLastReviewed since_last_reviewed = 3;
    SinceFork since_fork = 4;
    SessionId other_session = 5;           // its branch, per repo
    PullRequestBase pull_request_base = 6; // PR-10
    DiffSpec spec = 7;                     // RV-31: any spec, as edited
  }
}

// RV-31: per repo, what a review shows. Every base of RV-1 is one, and
// review_prepare and the skills write one (D55, D57). Computed on the
// session's machine by humata2_review_diff.
message DiffSpec {
  repeated RepoDiffSpec repos = 1;
}

message RepoDiffSpec {
  RepoRef repo = 1;
  // The old side.
  DiffSpecBase base = 2;
  // The new side: how much of the work in progress counts.
  DiffSpecCompare compare = 3;
  // Git pathspecs relative to the repo root (`src/`, `*.sql`). An empty
  // include shows every path.
  repeated string include_paths = 4;
  repeated string exclude_paths = 5;
  DiffWhitespace whitespace = 6;
  // Renames are detected (git -M) unless this is set; then a moved file
  // is a deletion and an addition.
  bool no_renames = 7;
}

message DiffSpecBase {
  oneof base {
    // The merge base of HEAD and this branch, as GitHub shows a pull
    // request (`origin/main...HEAD`).
    string merge_base_with = 1;
    // A branch, tag or commit as it is.
    string rev = 2;
    // A reviewed snapshot of this session (RV-28): its n, or 0 for the
    // latest.
    uint32 reviewed_snapshot = 3;
    // The parent's fork point (forks only).
    ForkPointBase fork_point = 4;
    // What is staged, for "only my unstaged changes".
    IndexBase index = 5;
    // This repo's pull request's base, merge-base form (PR-10). PR review
    // sessions only; a repo that is no pull request's is refused.
    PullRequestBaseRef pull_request_base = 6;
  }
}

message ForkPointBase {}
message IndexBase {}
// PR-10: this repo's pull request's base, merge-base form, PR review
// sessions only.
message PullRequestBaseRef {}

message DiffSpecCompare {
  enum Upto {
    UPTO_UNSPECIFIED = 0;  // as UNSTAGED
    UPTO_COMMITS = 1;      // HEAD's commit only
    UPTO_STAGED = 2;       // plus the index
    UPTO_UNSTAGED = 3;     // plus tracked files as they are on disk
  }
  enum Untracked {
    UNTRACKED_UNSPECIFIED = 0;  // as ALL
    UNTRACKED_NONE = 1;
    UNTRACKED_ALL = 2;          // every file git doesn't ignore
    UNTRACKED_PATHS = 3;        // only under untracked_paths
  }
  Upto upto = 1;
  Untracked untracked = 2;
  repeated string untracked_paths = 3;
  // The new side ends at this commit, branch or tag, not at the
  // checkout (D800). Upto and untracked must then be left unset.
  string head = 4;
  // Working-tree files under these pathspecs (tracked changes and
  // untracked files git doesn't ignore) laid over the new side, which is
  // HEAD unless head is set. Nothing else from the working tree counts.
  repeated string worktree_paths = 5;
}

enum DiffWhitespace {
  DIFF_WHITESPACE_UNSPECIFIED = 0;     // whitespace counts
  DIFF_WHITESPACE_IGNORE_CHANGES = 1;  // git -b
  DIFF_WHITESPACE_IGNORE_ALL = 2;      // git -w
}

// The two trees a repo's diff compared. Passing them back with
// GetFileDiff shows exactly the state the file list came from.
message DiffTrees {
  string old_tree = 1;
  string new_tree = 2;
}

// Where in a file's diff a chunk starts.
message DiffCursor {
  uint32 hunk = 1;
  uint32 line = 2;
}

message OriginMain {}
message UncommittedOnly {}
message SinceLastReviewed {}
message SinceFork {}
message PullRequestBase {}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  CHANGE_KIND_ADDED = 1;
  CHANGE_KIND_MODIFIED = 2;
  CHANGE_KIND_DELETED = 3;
  CHANGE_KIND_RENAMED = 4;
}

message FileSummary {
  string path = 1;
  string old_path = 2;
  ChangeKind change = 3;
  uint32 added = 4;
  uint32 removed = 5;
  bool binary = 6;
  // The sides' git blob ids; new_blob_sha is the content hash per-file
  // Viewed records (RV-29). Empty for a missing side.
  string old_blob_sha = 7;
  string new_blob_sha = 8;
  // git's rename score, 0–100, for CHANGE_KIND_RENAMED.
  uint32 similarity = 9;
}

message RepoDiff {
  RepoRef repo = 1;
  string branch = 2;
  PullRequestRef pull_request = 3;
  uint32 added = 4;
  uint32 removed = 5;
  repeated FileSummary files = 6;
  // RV-31 "Comparing: origin/main...HEAD + staged + unstaged".
  string label = 7;
  DiffTrees trees = 8;
  string head = 9;
}

message GetDiffRequest {
  SessionId session = 1;
  DiffBase base = 2;
  // Empty: every repo of the session.
  repeated RepoRef repos = 3;
}

message GetDiffResponse {
  repeated RepoDiff repos = 1;
  // RV-7: false means "No changes yet".
  bool any_changes = 2;
}

message DiffLine {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_CONTEXT = 1;
    KIND_ADDED = 2;
    KIND_REMOVED = 3;
  }
  Kind kind = 1;
  uint32 old_line = 2;
  uint32 new_line = 3;
  string text = 4;
}

message Hunk {
  string header = 1;
  repeated DiffLine lines = 2;
  uint32 index = 3;
  uint32 old_start = 4;
  uint32 new_start = 5;
  string section = 6;
  // These lines continue the previous chunk's last hunk: append them.
  bool continued = 7;
}

message GetFileDiffRequest {
  SessionId session = 1;
  DiffBase base = 2;
  RepoPath file = 3;
  // RV-21: the whole new file with changes marked.
  bool full_file = 4;
  // From the GetDiff response, so the hunks match its file list. Unset:
  // computed again from base.
  DiffTrees trees = 5;
  // Large diffs come in chunks (TR-11): start here, at most max_lines
  // lines (0: the daemon's default) and 1 MiB.
  DiffCursor from = 6;
  uint32 max_lines = 7;
  // RV-29: the file was marked Viewed at this content hash; show only the
  // change since.
  string viewed_blob_sha = 8;
}

enum ViewedResult {
  VIEWED_RESULT_UNSPECIFIED = 0;  // not asked
  VIEWED_RESULT_UNCHANGED = 1;    // stays folded as viewed
  VIEWED_RESULT_CHANGED = 2;      // hunks are the change since; clear Viewed
  VIEWED_RESULT_FORGOTTEN = 3;    // that content is gone; hunks are the whole diff
}

message FileDiff {
  RepoPath file = 1;
  FileSummary summary = 2;
  repeated Hunk hunks = 3;
  string old_blob_sha = 4;
  string new_blob_sha = 5;
  // Set when more hunks follow: ask again from here.
  DiffCursor next = 6;
  ViewedResult viewed = 7;
}

message MarkReviewedRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  PresenceProof presence = 3;
  // The new tree (DiffTrees.new_tree) of each repo's diff the client
  // showed, when it knows: these win over the daemon's last GetDiff for
  // the repos they name. Empty (the CLI): the last GetDiff's trees.
  repeated ShownTree shown_tree = 4;
}

message ShownTree {
  RepoRef repo = 1;
  string tree = 2;
}

// RV-28: the snapshot is exactly what the user saw: per repo, the new
// tree (DiffTrees.new_tree) of the last GetDiff the daemon answered for
// the session; a repo it hasn't shown yet is snapshotted as its working
// tree is now (staged, unstaged and untracked).
message MarkReviewedResponse {
  repeated ReviewedSnapshot snapshots = 1;
}

// RV-28: under refs/humata/reviewed/<session>/<n> in the repo's clone.
message ReviewedSnapshot {
  RepoRef repo = 1;
  uint32 n = 2;
  string commit = 3;
  string tree = 4;
  string head = 5;
  google.protobuf.Timestamp taken_at = 6;
  // RV-30: kept beyond the last 20 (a comment was sent from it).
  bool pinned = 7;
}

message ListReviewedSnapshotsRequest {
  SessionId session = 1;
  // Empty: every repo of the session.
  repeated RepoRef repos = 2;
}

message ListReviewedSnapshotsResponse {
  // Per repo, oldest first.
  repeated ReviewedSnapshot snapshots = 1;
}

// The branches one repository's changes can be compared with. Names carry
// no `origin/` prefix, and `HEAD` is left out.
message ListBasesRequest {
  SessionId session = 1;
  RepoRef repo = 2;
}

message FindDefaultBranchRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // One of the session's repositories.
  RepoRef repo = 3;
}

message FindDefaultBranchResponse {
  // The branch origin/HEAD names now, without `origin/`.
  string default_branch = 1;
}

message ListBasesResponse {
  repeated string branches = 1;
  // origin/HEAD's branch, which is also first in `branches`. Empty when the
  // clone doesn't know it, or when that branch isn't among the fetched ones.
  string default_branch = 2;
}

// ---------------------------------------------------------------------------

enum CommentStatus {
  COMMENT_STATUS_UNSPECIFIED = 0;
  COMMENT_STATUS_DRAFT = 1;
  COMMENT_STATUS_QUEUED = 2;     // SM-10, typed but not yet taken in by the agent (D151)
  COMMENT_STATUS_SENT = 3;       // typed into the terminal
  // SM-16: an agent change made after it was sent altered any anchored
  // line, beyond whitespace. A passage moved unchanged is re-anchored and
  // stays SENT; the user's own changes never address it.
  COMMENT_STATUS_ADDRESSED = 4;
  COMMENT_STATUS_POSTED = 5;     // PR draft posted to GitHub
  COMMENT_STATUS_RESOLVED = 6;
}

message CommentAnchor {
  RepoPath file = 1;
  LineRange lines = 2;
  DiffSide side = 3;
  // SM-6: the quoted passage, used to re-anchor.
  string quoted = 4;
  // The blob the lines refer to.
  string blob_sha = 5;
  // SM-7: true when the passage is gone.
  bool detached = 6;
  // PR-16: the line changed since the draft.
  bool outdated = 7;
  // RV-27: for a comment made in a diff, what it was compared against, as
  // the user saw it named ("origin/main", "review 3"). Empty outside a diff.
  string base = 8;
  // The stack layer the anchor is on (D800); empty for Whole stack.
  string layer = 9;
}

message CommentDestination {
  oneof destination {
    SessionTerminal terminal = 1;
    PullRequestRef pull_request = 2;
    UserNote note = 3;
  }
}

message SessionTerminal {}

// PR-23: a note for the user from the review chat, shown under its lines;
// never posted. "Make it a draft" turns it into one in place (D284).
message UserNote {}

message Comment {
  CommentId id = 1;
  SessionId session = 2;
  CommentAnchor anchor = 3;
  string text = 4;
  Actor author = 5;
  CommentDestination destination = 6;
  CommentStatus status = 7;
  // PR-14: link to the posted comment.
  string posted_url = 8;
  google.protobuf.Timestamp created_at = 9;
  Revision revision = 10;
  // SM-16: when it became addressed, by which agent change.
  Timestamped addressed = 11;
  // PR-24: a note the review chat left; its change's id for Undo. In
  // the answer to CreateComment or EditComment, that call's change.
  string undo_id = 12;
  // DK-9, SM-19: the thread under the comment, oldest first.
  repeated CommentReply replies = 13;
  // SM-19: who resolved it and when; set only while RESOLVED.
  Timestamped resolved = 14;
  // SM-20: set while archived. The status stays what it was; an archived
  // comment is never sent and is left out of every count.
  google.protobuf.Timestamp archived_at = 15;
  // SM-18: for ADDRESSED, the anchored lines after the agent's change, one
  // per line; anchor.quoted keeps them as they were.
  string addressed_text = 16;
  // SM-10: QUEUED, and Humata can't tell whether an earlier try reached the
  // terminal (it restarted mid-send). The user sends it again or takes it
  // back; Humata never types it again on its own.
  bool delivery_unconfirmed = 17;
  // When the terminal took it; unset until SENT.
  google.protobuf.Timestamp sent_at = 18;
  // A submit was cut short after GitHub may have taken this draft, and
  // GitHub doesn't list a review that holds it. The draft stays a draft;
  // the user decides whether to post again. Never set with POSTED.
  bool post_unconfirmed = 19;  // next free: 20
}

// One answer in a comment's thread (DK-9, SM-19).
message CommentReply {
  // Unique within the comment.
  string id = 1;
  Actor author = 2;
  string text = 3;
  google.protobuf.Timestamp at = 4;
}

message ListCommentsRequest {
  SessionId session = 1;
  // Empty: every status but RESOLVED (SM-12).
  repeated CommentStatus statuses = 2;
  RepoPath file = 3;
  PageRequest page = 4;
  // SM-21: only archived comments, of any status. Unset: archived ones are
  // left out.
  bool archived = 5;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
  // SM-15 badge.
  uint32 draft_count = 2;
  PageResponse page = 3;
}

message CreateCommentRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  CommentAnchor anchor = 3;
  string text = 4;
  CommentDestination destination = 5;
}

message EditCommentRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
  string text = 3;
  Revision expected_revision = 4;
}

message DropCommentRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
  Revision expected_revision = 3;
}

message DropCommentResponse {
  // PR-24: for a review chat note, the drop's change id, for Undo.
  string undo_id = 1;
}

message MakeNoteADraftRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
  // Needed only when the review holds two pull requests in the note's
  // repository: which one the draft is for.
  PullRequestRef pr = 3;
}

message ReattachCommentRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
  CommentAnchor anchor = 3;
  Revision expected_revision = 4;
}

message SendCommentsRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // The drafts the user saw; others stay drafts.
  repeated CommentId ids = 3;
}

message SendCommentsResponse {
  repeated Comment comments = 1;
  bool queued = 2;
}

message ResolveCommentRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
  Revision expected_revision = 3;
  // SM-19: what was done. Required from an agent; shown in the thread.
  string reply = 4;
}

message ResolveAddressedCommentsRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // Unset: the whole session.
  RepoPath file = 3;
}

message ResolveAddressedCommentsResponse {
  // The comments this call resolved, as they are now. A repeat of the call
  // resolves nothing more and answers with none.
  repeated Comment comments = 1;
}

message ReopenCommentRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
  Revision expected_revision = 3;
}

message TakeBackCommentsRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  repeated CommentId ids = 3;
}

message TakeBackCommentsResponse {
  // Every comment that went back to a draft.
  repeated Comment comments = 1;
}

message ReplyToCommentRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
  string text = 3;
}

message ArchiveCommentRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
}

message UnarchiveCommentRequest {
  IdempotencyKey idempotency_key = 1;
  CommentId id = 2;
}

message WatchCommentsRequest {
  SessionId session = 1;
}

message CommentFeedEvent {
  oneof event {
    // Made, edited, sent, addressed, resolved, archived or brought back:
    // the comment as it is now.
    Comment changed = 1;
    // Dropped for good.
    CommentId dropped = 2;
    // List again: first on every stream, and after the feed fell behind.
    bool resync = 3;
  }
}

// ---------------------------------------------------------------------------

message ResolvePullRequestRequest {
  oneof ref {
    string url = 1;            // https://github.com/acme/api/pull/482
    PullRequestRef pr = 2;     // parsed owner/repo#n
  }
}

enum PullRequestState {
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_STATE_OPEN = 1;
  PULL_REQUEST_STATE_MERGED = 2;
  PULL_REQUEST_STATE_CLOSED = 3;
}

message PullRequestInfo {
  PullRequestRef pr = 1;
  string title = 2;
  string author = 3;
  string base_branch = 4;
  string head_branch = 5;
  string head_sha = 6;
  uint32 files = 7;
  uint32 added = 8;
  uint32 removed = 9;
  PullRequestState state = 10;
  // "3 passed, 1 failing".
  string checks = 11;
}

message StartReviewRequest {
  IdempotencyKey idempotency_key = 1;
  repeated PullRequestRef prs = 2;
  MachineId machine = 3;
  AgentId agent = 4;
  string model = 5;
  string first_message = 6;
  // PR-8 in the dialog.
  bool push_allowed = 7;
  PresenceProof presence = 8;
}

message CheckHeadsRequest { SessionId session = 1; }

message HeadChange {
  PullRequestRef pr = 1;
  uint32 new_commits = 2;
  bool force_pushed = 3;
  PullRequestState state = 4;
  // A8 (D298): the new base when it changed since the last recorded one;
  // else empty. A changed base lists the PR even with no new commits.
  string base_branch = 5;
  // D300: where the PR sits among the review's own PRs; unset when it is in
  // no stack. SEAM
  StackPosition stack = 6;
}

// D300: a pull request's place in a stack of the review's own pull requests.
// A stack may be a tree, so a PR can have several children.
message StackPosition {
  // The PR this one is based on; unset for the bottom of the stack.
  PullRequestRef parent = 1;
  repeated PullRequestRef children = 2;
}

message CheckHeadsResponse {
  repeated HeadChange changes = 1;
  google.protobuf.Timestamp checked_at = 2;
}

message UpdateCloneRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
}

message SetPushAllowedRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  bool allowed = 3;
  PresenceProof presence = 4;
}

message SetPushAllowedResponse {}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_COMMENT = 1;
  VERDICT_APPROVE = 2;
  VERDICT_REQUEST_CHANGES = 3;
}

message PlanSubmitRequest { SessionId session = 1; }

message SubmitPlan {
  message PerPullRequest {
    PullRequestRef pr = 1;
    // Only what will be posted.
    repeated Comment drafts = 2;
    string drafted_summary = 3;
    // Drafts that won't be posted with this review, and why. They stay
    // drafts.
    repeated LeftOut left_out = 4;  // next free: 5
  }
  message LeftOut {
    enum Reason {
      REASON_UNSPECIFIED = 0;
      // The lines changed since the draft was written (PR-16).
      REASON_OUTDATED = 1;
      // The lines aren't in the PR's diff; GitHub would refuse it with 422.
      REASON_OUT_OF_DIFF = 2;
    }
    Comment draft = 1;
    Reason reason = 2;
  }
  SessionId session = 1;
  repeated PerPullRequest pull_requests = 2;
  PlanToken token = 3;
}

message ReviewSubmission {
  PullRequestRef pr = 1;
  Verdict verdict = 2;
  string summary = 3;
  // The drafts to post; the rest stay drafts.
  repeated CommentId drafts = 4;
}

message SubmitReviewRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  repeated ReviewSubmission reviews = 3;
  PlanToken plan = 4;
  PresenceProof presence = 5;
}

message SubmitReviewResponse {
  message Result {
    PullRequestRef pr = 1;
    string review_url = 2;
    // Set when this PR's review didn't post.
    Error error = 3;
  }
  repeated Result results = 1;
}

message DraftSummaryRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  PullRequestRef pr = 3;
  string summary = 4;
}

message DraftSummaryResponse {
  Delivery delivery = 1;
  JournalPosition journal = 2;
}

// A9 (D299): commits marked reviewed, per PR, across restarts and force
// pushes. Any review session of the PR sees the same marks and history.
message ListPullRequestCommitsRequest {
  SessionId session = 1;      // a review session holding `pr`
  PullRequestRef pr = 2;
}

// User-only.
message MarkCommitsReviewedRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  PullRequestRef pr = 3;
  repeated string commits = 4;  // shas on the clone's head
  bool reviewed = 5;            // false: unmark
  PresenceProof presence = 6;
}

message PullRequestCommits {
  PullRequestRef pr = 1;
  string head_sha = 2;                    // the clone's head
  repeated PrCommit commits = 3;          // base...head, oldest first
  repeated CommitReviewEntry history = 4; // seq ascending, append-only
}

message PrCommit {
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_UNREVIEWED = 1;
    STATE_REVIEWED = 2;   // this sha was marked
    STATE_CARRIED = 3;    // an earlier sha with the same patch-id was marked
  }
  string sha = 1;
  string subject = 2;
  string patch_id = 3;            // `git patch-id --stable` of `git show <sha>`
  State state = 4;
  string reviewed_as_sha = 5;     // CARRIED: the sha that was marked; else empty
  google.protobuf.Timestamp reviewed_at = 6;  // unset when unreviewed
  string reviewed_head_sha = 7;   // the head when the mark was made
  ReviewedBy by = 8;              // unset when unreviewed
}

message ReviewedBy {
  Actor actor = 1;        // UserActor for every mark
  string gh_login = 2;    // `gh api user` login at the time
}

message CommitReviewEntry {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_MARKED = 1;
    KIND_UNMARKED = 2;
    KIND_CARRIED = 3;
    KIND_WHOLE_PR = 4;
  }
  uint32 seq = 1;
  google.protobuf.Timestamp at = 2;
  Kind kind = 3;
  repeated string commits = 4;
  string head_sha = 5;
  optional uint32 snapshot_n = 6;   // WHOLE_PR only: the RV-6 snapshot's n
  ReviewedBy by = 7;
}

// ---------------------------------------------------------------------------

enum ViewState {
  VIEW_STATE_UNSPECIFIED = 0;
  VIEW_STATE_DRAFT = 1;              // prepared, not ready
  VIEW_STATE_WAITING = 2;            // "Waiting for you"
  VIEW_STATE_LATER = 3;
  VIEW_STATE_NOT_NOW = 4;
  VIEW_STATE_OPENED = 5;
  VIEW_STATE_REVERTED = 6;
  VIEW_STATE_OPENED_AND_CLOSED = 7;
  VIEW_STATE_KEPT = 8;
}

message ReviewWalkthrough {
  message Step {
    RepoPath file = 1;
    LineRange lines = 2;
    string note = 3;
  }
  repeated Step steps = 1;
}

message BoardViewOffer {
  // Must be a channel board scope of the session's channel (VW-1).
  oneof scope {
    ChannelId channel = 1;
    ChannelId channel_with_sessions = 2;
    SessionId session_with_forks = 3;
    SessionId one_session = 4;
  }
}

// VW-13: per repo, a title, a body, a base branch and whether it is a
// draft. Preparing it pushes nothing. Open it shows the fields, editable;
// Push and open PR(s) runs SessionService.PlanPush and
// PushAndOpenPullRequests (MV-12) as the user, with from_view set.
message PullRequestDraft {
  message PerRepo {
    RepoRef repo = 1;
    string title = 2;
    string body = 3;
    string base_branch = 4;
    bool draft = 5;
  }
  repeated PerRepo repos = 1;
}

// RV-32: an agent-prepared review (review_prepare): a diff spec, the
// files in reading order, groups over that order, and notes. Files the
// order leaves out follow it.
message ReviewPlan {
  DiffSpec spec = 1;
  repeated RepoPath order = 2;
  repeated ReviewGroup groups = 3;
  repeated ReviewNote notes = 4;
  // A stack of layers (RV-36, D800): sent instead of spec, which the
  // daemon fills with the Whole stack.
  ReviewStack stack = 5;
}

// The layers of a change, bottom of the stack first (D800).
message ReviewStack {
  repeated ReviewLayer layers = 1;
}

message ReviewLayer {
  // Unique in the stack ignoring case; how every call names the layer.
  string title = 1;
  // At most one line, for navigating, never a finding.
  string purpose = 2;
  repeated ReviewLayerRepo repos = 3;
}

message ReviewLayerRepo {
  RepoRef repo = 1;
  oneof part {
    ReviewLayerRange range = 2;
    ReviewLayerWorktree worktree = 3;
  }
  // owner/repo#n, empty for none.
  string pull_request = 4;
  // Filled by the daemon: the commits the revs resolved to at prepare,
  // and whether they have drifted since.
  ReviewLayerResolved resolved = 5;
}

// `git diff base..head`, the revs as sent.
message ReviewLayerRange {
  string base = 1;
  string head = 2;
}

// Work not committed, on top of HEAD, under these pathspecs.
message ReviewLayerWorktree {
  repeated string include_paths = 1;
}

message ReviewLayerResolved {
  enum Drift {
    DRIFT_UNSPECIFIED = 0;  // as NONE
    DRIFT_NONE = 1;
    DRIFT_MOVED = 2;        // a rev moved and the chain or ancestry broke
    DRIFT_MISSING = 3;      // a rev no longer resolves in this clone
    DRIFT_HEAD_MOVED = 4;   // HEAD left the top head under a worktree layer
  }
  string base_commit = 1;
  string head_commit = 2;
  Drift drift = 3;
  // Files in this layer's diff of this repo (numstat), 0 when drifted.
  uint32 files = 4;
}

// A titled section of the order, from `first` until the next group.
message ReviewGroup {
  string title = 1;
  string note = 2;
  RepoPath first = 3;
}

message ReviewNote {
  enum Target {
    TARGET_UNSPECIFIED = 0;  // as FILE
    TARGET_FILE = 1;
    TARGET_HUNK = 2;         // the hunk covering lines.first
    TARGET_LINES = 3;
  }
  RepoPath file = 1;
  Target target = 2;
  LineRange lines = 3;
  DiffSide side = 4;
  string text = 5;
  // RV-34, set by the daemon when the plan is prepared: the blob and the
  // lines the note was written against.
  string blob_sha = 6;
  LineRange anchored = 7;
  repeated string quoted = 8;
  // Set when read back: its lines changed since (kept, shown at the old
  // lines). `lines` then holds where they are now when they only moved.
  bool outdated = 9;
  // The layer the note is on (D800); empty for Whole stack.
  string layer = 10;
}

message PreparedView {
  ViewId id = 1;
  SessionId session = 2;
  string title = 3;
  string summary = 4;
  oneof content {
    ReviewWalkthrough review = 5;
    BoardViewOffer board = 6;
    PullRequestDraft pull_request = 12;
    ReviewPlan review_plan = 13;
  }
  AgentActor prepared_by = 7;
  google.protobuf.Timestamp prepared_at = 8;
  ViewState state = 9;
  Revision revision = 10;
  JournalPosition journal = 11;
  // PR-24: a review_plan prepared in the session's open review chat
  // applies at once instead of becoming a draft: this is its change's id,
  // for Undo, and nothing else is set but the title.
  string undo_id = 14;
}

message PrepareViewRequest {
  IdempotencyKey idempotency_key = 1;
  string title = 2;
  string summary = 3;
  oneof content {
    ReviewWalkthrough review = 4;
    BoardViewOffer board = 5;
    PullRequestDraft pull_request = 6;
    ReviewPlan review_plan = 7;
  }
}

message ReviseViewRequest {
  IdempotencyKey idempotency_key = 1;
  ViewId id = 2;
  string title = 3;
  string summary = 4;
  oneof content {
    ReviewWalkthrough review = 5;
    BoardViewOffer board = 6;
    PullRequestDraft pull_request = 8;
    ReviewPlan review_plan = 9;
  }
  Revision expected_revision = 7;
}

message MarkReadyRequest {
  IdempotencyKey idempotency_key = 1;
  ViewId id = 2;
}

message ListViewsRequest {
  SessionId session = 1;
  bool include_forks = 2;
  PageRequest page = 3;
}

message ListViewsResponse {
  repeated PreparedView views = 1;
  PageResponse page = 2;
}

message SetViewStateRequest {
  IdempotencyKey idempotency_key = 1;
  ViewId id = 2;
  ViewState state = 3;
}

// ---------------------------------------------------------------------------
// The review chat (PR-22–PR-26, D59)

// PR-25, all on by default.
message AgentSwitches {
  bool focus = 1;  // review_focus
  bool notes = 2;  // review_note, review_note_edit, review_note_drop
  bool order = 3;  // review_prepare
}

message SetAgentSwitchesRequest {
  SessionId session = 1;
  AgentSwitches switches = 2;
}

// Where the user is in the review.
message ReviewPlace {
  RepoPath file = 1;
  // The lines on screen, on `side`.
  LineRange visible = 2;
  // Unset: nothing selected.
  LineRange selection = 3;
  DiffSide side = 4;
}

// RV-29: a file folded as viewed at this content hash.
message ViewedFile {
  RepoPath file = 1;
  string blob_sha = 2;
}

// A labelled range the agent highlighted (PR-23).
message Highlight {
  RepoPath file = 1;
  LineRange lines = 2;
  DiffSide side = 3;
  string label = 4;
}

// The view's state, as the app reports it.
message ReviewViewState {
  // Per repo, what each diff shows.
  DiffSpec spec = 1;
  // Unset: no file open.
  ReviewPlace open = 2;
  repeated RepoPath order = 3;
  repeated ReviewGroup groups = 4;
  repeated ViewedFile viewed = 5;
  repeated Highlight highlights = 6;
  // The stack the review shows, if any (D800).
  ReviewStack stack = 7;
  // The layer showing; empty for Whole stack.
  string layer = 8;
}

message ReportReviewViewRequest {
  SessionId session = 1;
  ReviewViewState view = 2;
}

message ReportReviewViewResponse {}

message GetReviewContextRequest {
  SessionId session = 1;
}

// review_context.
message ReviewContext {
  ReviewViewState view = 1;
  // The quoted lines of the selection, so "what does this do?" needs no
  // copying.
  repeated string selected_text = 2;
  // The review's notes for the user, outdated ones marked (PR-26).
  repeated Comment notes = 3;
  AgentSwitches switches = 4;
}

message FocusReviewRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  RepoPath file = 3;
  // Unset: the top of the file.
  LineRange lines = 4;
  DiffSide side = 5;
  // Replace the agent's highlights; empty clears them.
  repeated Highlight highlights = 6;
  // Move to this stack layer (D800); empty keeps the layer showing
  // unless whole_stack is set.
  string layer = 7;
  bool whole_stack = 8;
}

// One change the agent made to the view, as the app applies it and the
// chat shows it ("● review_focus refund.rs:140  [Undo]").
message ReviewChange {
  string undo_id = 1;
  // Increases per review; WatchReviewChanges resumes after it.
  uint64 seq = 2;
  // "review_focus", "review_note", "review_note_edit", "review_note_drop",
  // "review_prepare", "undo", or "diff": a later diff marked a note
  // outdated or moved it (RV-34); a "diff" change has no undo_id.
  string tool = 3;
  // For the chat line: `refund.rs:140`.
  string summary = 4;
  oneof change {
    ReviewPlace focus = 5;
    Comment note = 6;
    CommentId note_dropped = 7;
    ReviewPlan plan = 8;
  }
  repeated Highlight highlights = 9;
  // The change this one undid, for "undo".
  string undid = 10;
  google.protobuf.Timestamp at = 11;
}

message UndoReviewChangeRequest {
  SessionId session = 1;
  string undo_id = 2;
}

message WatchReviewChangesRequest {
  SessionId session = 1;
  uint64 after_seq = 2;
}
