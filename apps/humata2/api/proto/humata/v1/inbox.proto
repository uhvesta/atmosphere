// The Inbox (IN-1..15, IN-25, IN-26; waiting per TP-11..15). Requests are made only by the daemon, from an
// agent's call that a rule sent to Ask me, or by an agent's question
// (InboxAsk over MCP). Clients list, read and answer them; answering is
// user-only. Served by the host; while the host is away a machine serves
// the requests in its own journal (AW-3, AW-5).
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/access.proto";
import "humata/v1/build.proto";
import "humata/v1/capabilities.proto";
import "humata/v1/common.proto";
import "humata/v1/errors.proto";

service InboxService {
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse);
  rpc GetRequest(GetRequestRequest) returns (InboxRequest);
  // Approve, deny, deny with a note, answer a question, or approve and add
  // the card's scoped grant. Fails with Error.already_answered when another
  // client answered first, and Error.request_withdrawn when the agent
  // stopped waiting.
  rpc AnswerRequest(AnswerRequestRequest) returns (InboxRequest);
  // IN-6. Applies only to the ids listed, which must be what the user saw:
  // requests that arrived since are left pending. Never adds grants.
  rpc AnswerAll(AnswerAllRequest) returns (AnswerAllResponse);

  // ----- Agent side (MCP inbox_*). The requester is always the caller's
  // own session; no field names it. -----

  // A question for the user (INBOX_ASK, IN-25). Waits like any request
  // (TP-11): wait_seconds defaults to 45 and is at most 600. A repeat with
  // the same idempotency key returns the same request (TP-14).
  rpc AskUser(AskUserRequest) returns (WaitResponse);
  // IN-26: ask ahead for a capability on a target, e.g. before a long plan,
  // so the user answers once. Approving adds the card's grant (IN-14);
  // a capability whose rule is Never is denied at once (IN-18), and a
  // user-only one fails with Error.user_only (IN-23).
  rpc RequestAccess(RequestAccessRequest) returns (WaitResponse);
  // TP-12: keep waiting on a request this session made. Returns what the
  // original call would have: its result once approved and run (TP-13), the
  // denial with its note, or PENDING at the deadline. Streams a keepalive
  // every 15 seconds meanwhile.
  rpc WaitForAnswer(WaitForAnswerRequest) returns (stream WaitResponse);
  // The agent no longer needs it; the card greys out (WITHDRAWN, TP-15).
  rpc WithdrawRequest(WithdrawRequestRequest) returns (InboxRequest);

  // INBOXHOOKS Ask why. User-only: holds a pending card from an agent's
  // call and tells the waiting agent the user asked why (WaitResponse
  // .asked_why). The card stays pending; AskedWhy.asked_at is set.
  rpc AskWhy(AskWhyRequest) returns (InboxRequest);
  // INBOXHOOKS: the agent's answer to Ask why on a request its own session
  // made (MCP inbox_explain). Sets AskedWhy.reply; the card stays pending.
  rpc ExplainAsk(ExplainAskRequest) returns (InboxRequest);
}

message AskWhyRequest {
  IdempotencyKey idempotency_key = 1;
  RequestId id = 2;
}

message ExplainAskRequest {
  RequestId id = 1;
  // At most 1000 characters.
  string reply = 2;
}

message AskUserRequest {
  IdempotencyKey idempotency_key = 1;
  string question = 2;
  // Up to 4 one-tap answers (IN-25); more fails with invalid_field. The
  // user can always reply in words.
  repeated string choices = 3;
  uint32 wait_seconds = 4;
}

message RequestAccessRequest {
  IdempotencyKey idempotency_key = 1;
  Capability capability = 2;
  GrantTarget target = 3;
  string reason = 4;
  uint32 wait_seconds = 5;
}

message WaitForAnswerRequest {
  RequestId id = 1;
  uint32 wait_seconds = 2;
}

message WaitResponse {
  RequestId id = 1;
  RequestState state = 2;
  // Set when answered: the reply, the deny note, or the grant made.
  RequestAnswer answer = 3;
  // A keepalive while still pending; the stream's last message has it false.
  bool keepalive = 4;
  // Held in the machine's journal while the host is away (AW-3).
  bool journaled = 5;
  // TP-12, TP-13: when an approved action has run, its result, encoded as
  // the response message the original call returns (result_type names it,
  // e.g. "humata.v1.ReadFilesResponse"), or the error it failed with.
  bytes result = 6;
  string result_type = 7;
  Error error = 8;
  // The result is kept until then (24 hours after it ran), then dropped;
  // waiting after that returns the state without a result.
  google.protobuf.Timestamp result_kept_until = 9;
  // INBOXHOOKS: still pending, and the user pressed Ask why with no reply
  // yet. The agent answers with ExplainAsk (MCP inbox_explain), then waits.
  bool asked_why = 10;
}

message WithdrawRequestRequest {
  IdempotencyKey idempotency_key = 1;
  RequestId id = 2;
}

enum RequestState {
  REQUEST_STATE_UNSPECIFIED = 0;
  REQUEST_STATE_PENDING = 1;
  REQUEST_STATE_APPROVED = 2;
  REQUEST_STATE_DENIED = 3;
  REQUEST_STATE_ANSWERED = 4;    // a question with a reply
  REQUEST_STATE_WITHDRAWN = 5;   // the agent stopped waiting
}

// TP-15: why a request was withdrawn.
enum WithdrawReason {
  WITHDRAW_REASON_UNSPECIFIED = 0;
  WITHDRAW_REASON_AGENT = 1;            // inbox_withdraw
  WITHDRAW_REASON_SESSION_STOPPED = 2;
  WITHDRAW_REASON_SESSION_ARCHIVED = 3;
  WITHDRAW_REASON_SESSION_DELETED = 4;
  // The MCP process exited with the call open and no PENDING returned.
  WITHDRAW_REASON_CALL_ENDED = 5;
  WITHDRAW_REASON_CHANNEL_DELETED = 6;  // CH-25
  // The board item the request is about was deleted or purged (BD-15).
  WITHDRAW_REASON_ITEM_DELETED = 7;
  // D264: the machine's sessions were stopped.
  WITHDRAW_REASON_MACHINE_STOPPED = 8;
  // UP-1: what it asked for came about another way (a Migrate item
  // whose machine is at the host's release again). D781: also a question
  // on the agent's screen that was answered in its terminal.
  WITHDRAW_REASON_RESOLVED = 9;
  // DK-19: a newer request to move the same Desk session took its place.
  WITHDRAW_REASON_SUPERSEDED = 10;
  // DK-18: the session moved from the Desk into a channel.
  WITHDRAW_REASON_SESSION_MOVED = 11;
  // D783: the machine the request came from was removed from Humata, so
  // nothing there can act on an answer. Its sessions are archived.
  WITHDRAW_REASON_MACHINE_REMOVED = 12;
}

enum RequestKind {
  REQUEST_KIND_UNSPECIFIED = 0;
  REQUEST_KIND_BOARD = 1;
  REQUEST_KIND_FILES = 2;
  REQUEST_KIND_SESSION = 3;   // note, question, type, start, fork, move, end
  REQUEST_KIND_BRIDGE = 4;    // cross-machine copy or read, network
  REQUEST_KIND_QUESTION = 5;  // a question for the user
  REQUEST_KIND_CHANNEL = 6;
  REQUEST_KIND_MACHINE = 7;
  // UP-1, D281: no requester, always VIP, answered only with Approve
  // (Migrate): never Deny, Always, a reply or an Approve-all.
  REQUEST_KIND_MIGRATE = 8;
}

// IN-9 item 7.
enum Undo {
  UNDO_UNSPECIFIED = 0;
  UNDO_CAN_BE_UNDONE = 1;
  UNDO_CANNOT_BE_UNDONE = 2;
}

message InboxRequest {
  RequestId id = 1;
  ChannelId channel = 2;
  RequestKind kind = 3;
  RequestState state = 4;
  // IN-9 item 1.
  AgentActor requester = 5;
  // IN-9 item 2: "Read 3 files of “Ledger schema migration”".
  string action_title = 6;
  // IN-9 item 3, in the agent's words.
  string reason = 7;
  // IN-9 item 4.
  RequestPreview preview = 8;
  // IN-9 item 5: the agent's last steps from its adapter, pending call last.
  // Empty when the agent's adapter can't report them.
  repeated string recent_steps = 9;
  // IN-9 item 6.
  Capability capability = 10;
  Decision rule_decision = 11;
  Undo undo = 12;
  // IN-9 item 8: the "Always allow …" checkbox, exactly as the card offers it.
  // Unset for questions and for capabilities that take no grants.
  AlwaysOption always = 13;
  google.protobuf.Timestamp created_at = 14;
  RequestAnswer answer = 15;
  Timestamped answered = 16;
  // Made in a machine's journal while the host was away.
  JournalPosition journal = 17;
  // NV-22: the requester session is VIP for this user.
  bool vip = 18;
  Revision revision = 19;
  // Set when state is WITHDRAWN.
  WithdrawReason withdraw_reason = 20;
  // IN-9 item 2: the call as a dotted operation id, "channel.list" (TP-16).
  // Named by the daemon from the method it routed, never by the agent.
  string operation = 21;
  // D781: set only on a question the agent asks on its own screen (D767),
  // raised while the dialog shows: the app draws that screen's live
  // terminal under the card and offers Dismiss. Unset on every other item,
  // and on items from a daemon older than D781.
  ScreenAsk on_screen = 22;
  // D798: set on the card that says an agent waits in its own terminal. The
  // only thing the app offers on it is Dismiss: nothing is typed anywhere.
  bool dismiss_only = 23;
  // INBOXHOOKS: what the card shows so the owner can decide without opening
  // anything, worked out by Humata (not the agent). Empty on items from a
  // daemon older than INBOXHOOKS; the app then shows the preview alone.
  //
  // The grey box: From / To / Size / Carries / Files, by name, never by id.
  repeated CardFact facts = 24;
  // WHAT ELSE IT AFFECTS: side effects, warnings first.
  repeated CardEffect affects = 25;
  // CAN IT BE UNDONE?: "Yes, for 7 days. Undo moves the folder back …".
  string undo_text = 26;
  // The to-do item the asking session works on: "PAY-3 Ledger schema v2".
  string working_on = 27;
  // The owner asked why (Ask why) and, once it came, the agent's answer.
  AskedWhy asked_why = 28;
  // The Agent access row whose Ask me sent this card: "Move files to
  // another machine". The app links it to that row (Change this rule).
  string rule_label = 29;
}

// INBOXHOOKS: one row of a card's grey box. `lead` is bold: "This Mac".
message CardFact {
  string label = 1;
  string lead = 2;
  string rest = 3;
}

// INBOXHOOKS: one side effect. `lead` is bold and may be empty.
message CardEffect {
  // A warning (!); otherwise fine as it is (✓).
  bool warn = 1;
  string lead = 2;
  string rest = 3;
}

// INBOXHOOKS: Ask why. The card stays pending while the agent answers.
message AskedWhy {
  google.protobuf.Timestamp asked_at = 1;
  // Empty until the agent answers.
  string reply = 2;
  google.protobuf.Timestamp replied_at = 3;
}

// D781: where the dialog an item was read off is.
message ScreenAsk {
  // The agent tab's index among its session's tabs, as ListTabs orders
  // them and a client's link to the session's terminal numbers them.
  uint32 tab = 1;
}

message AlwaysOption {
  // "Always allow this session to read files of “Ledger schema migration”".
  string label = 1;
  GrantTarget target = 2;
}

// IN-10.
message RequestPreview {
  oneof preview {
    BoardChangePreview board_change = 1;
    NewBoardItemPreview new_board_item = 2;
    FileAccessPreview file_access = 3;
    CommandPreview command = 4;
    TypingPreview typing = 5;
    NewSessionPreview new_session = 6;
    CrossMachineCopyPreview cross_machine_copy = 7;
    MessagePreview message = 8;
    QuestionPreview question = 9;
    MovePreview move = 10;
    NetworkPreview network = 11;
    PushPreview push = 12;
    AccessAheadPreview access_ahead = 13;
    MigratePreview migrate = 14;
    ProviderImportPreview provider_import = 15;
  }
}

// HO-11: what a port forward card shows.
message NetworkPreview {
  // The machine it opens from: the requester's own.
  MachineId machine = 1;
  string host = 2;
  uint32 port = 3;
  // Always true: it stays open until the session stops.
  bool until_session_stops = 4;
}

// IN-24: a session_push card.
message PushPreview {
  message Repo {
    RepoRef repo = 1;
    string branch = 2;
    uint32 commits = 3;
    // Empty when only pushing.
    string pull_request_title = 4;
  }
  repeated Repo repos = 1;
}

// IN-26: what the agent asks ahead for.
message AccessAheadPreview {
  Capability capability = 1;
  GrantTarget target = 2;
  // In words: "Read files under src/ledger of “Ledger schema migration”".
  string target_label = 3;
}

message NewBoardItemPreview {
  BoardRef board = 1;
  string title = 2;
  BoardColumn column = 3;
  string description = 4;
}

message FileAccessPreview {
  enum Mode {
    MODE_UNSPECIFIED = 0;
    MODE_READ_THIS_CALL = 1;
    MODE_COPY_INTO_CLONE = 2;
    MODE_COPY_INTO_SHARED = 3;
  }
  SessionId source_session = 1;
  MachineId source_machine = 2;
  Mode mode = 3;
  repeated RepoPath paths = 4;
}

message CommandPreview {
  MachineId machine = 1;
  string command = 2;
  string notes = 3;
}

message TypingPreview {
  SessionId target = 1;
  AgentId target_agent = 2;
  repeated string last_lines = 3;
  string text = 4;
}

message NewSessionPreview {
  enum RepoCopy {
    REPO_COPY_UNSPECIFIED = 0;
    REPO_COPY_NEW_BRANCH_FROM_MAIN = 1;
    REPO_COPY_BRANCH_AND_UNCOMMITTED = 2;
    REPO_COPY_READS_PARENT = 3;   // context-only fork
  }
  message Repo {
    RepoRef repo = 1;
    RepoCopy copy = 2;
    uint64 clone_bytes = 3;
  }
  AgentId agent = 1;
  string model = 2;
  MachineId machine = 3;
  ForkKind fork_kind = 4;    // UNSPECIFIED for a new session
  repeated Repo repos = 5;
  // "A new agent's usage": stated in words, since Humata has no price feed.
  string usage_note = 6;
}

message CrossMachineCopyPreview {
  MachineId source_machine = 1;
  string source_path = 2;
  MachineId destination_machine = 3;
  string destination_path = 4;
  uint64 bytes = 5;
  uint32 files = 6;
  // D467: where the copy lands in words after the machine's name, e.g.
  // "shared" or "api clone"; empty when it has no short name.
  string destination_place = 7;
  // INBOXHOOKS: a move (TRANSFER_MODE_MOVE): the source goes once every
  // file is verified. False for a copy.
  bool moves = 8;
  // INBOXHOOKS: files at the destination this would replace, by path
  // relative to the destination, with what tells them apart ("3 days
  // newer", "same content"). Empty when nothing is replaced.
  repeated ReplacedFile replaced = 9;
}

// INBOXHOOKS: a file a copy or move would replace.
message ReplacedFile {
  string path = 1;
  // "the one there is 3 days newer", "same content"; may be empty.
  string note = 2;
}

message MessagePreview {
  SessionId target = 1;
  bool is_question = 2;
  string text = 3;
}

message QuestionPreview {
  string question = 1;
  // Optional answers the agent offered; the user may also write their own.
  repeated string choices = 2;
}

message MovePreview {
  SessionId session = 1;
  MachineId from = 2;
  MachineId to = 3;
  uint64 bytes = 4;
  // INBOXHOOKS: what the card names, worked out by Humata.
  string session_title = 5;
  string channel_name = 6;
  // The session's repositories by short name.
  repeated string repos = 7;
  // Uncommitted files carried as they are.
  uint32 uncommitted_files = 8;
  // Each running terminal that moves along and keeps running, in words:
  // "codex", "zsh running pgbench".
  repeated string terminals = 9;
  // Forks of the session that stay where they are, by title.
  repeated string forks_staying = 10;
  // Repositories the destination has no clone of yet; Humata clones them
  // there first.
  repeated string clones_needed = 11;
}

enum MigratePhase {
  MIGRATE_PHASE_UNSPECIFIED = 0;
  MIGRATE_PHASE_WAITING = 1;
  MIGRATE_PHASE_MIGRATING = 2;
  MIGRATE_PHASE_FAILED = 3;
}

// MP-23, D792: an agent's ask to import a provider file. The card shows the
// file whole, every command each provider runs (on the Mac, or run_on, when
// a machine is made with it) and the providers it replaces. Approving writes
// it while the providers file is as it was when asked.
message ProviderImportPreview {
  // The file's text exactly as the agent gave it.
  string text = 1;
  // The name the agent gave it; a label only, never read.
  string file_name = 2;
  message Provider {
    ProviderId id = 1;
    string label = 2;
  }
  repeated Provider providers = 3;
  message Command {
    ProviderId provider = 1;
    string action = 2;   // "create", "connect", "start", …
    string command = 3;
  }
  repeated Command commands = 4;
  // Ids already in the providers file (or the built-in Lima) it replaces.
  repeated ProviderId replaces = 5;
}

// UP-1, D281: "Migrate the daemon on gpu". One per (thing, machine)
// while pending, showing what the machine is now.
message MigratePreview {
  MigrateThing thing = 1;
  MachineId machine = 2;
  // What it is now, and the host's build it would become.
  BuildInfo from = 3;
  BuildInfo to = 4;
  repeated string changes = 5;
  repeated string keeps_running = 6;
  MigratePhase phase = 7;
  // Set when phase is FAILED.
  Error last_error = 8;
  repeated SessionId waiting_sessions = 9;
  // D379: what Migrate does, one line per step, in order. Set when Migrate is
  // clicked and empty before; a Holders item has none.
  repeated MigrateStep steps = 10;
  // D379: a Holders item's sessions and shells on old holders, each with what
  // happens to it. waiting_sessions (9) stays filled with the agent rows.
  repeated HolderSession holders = 11;
  // PROGRESS T6: while Migrate moves a Holders item's terminals, how many of
  // this round's terminals are handled. Unset before the first round.
  HoldersMoved moved = 12;
}

// PROGRESS T6: one round of Migrate's moves (LIVEHOLDER). A terminal counts
// as handled once it moved, or once its holder turned out too old to move or
// out of reach (it then keeps running where it is), so the count never
// sticks. A round that stops on a refused or lost move keeps its count.
message HoldersMoved {
  uint32 done = 1;
  uint32 total = 2;
  // When the round began, unix ms.
  int64 started_unix_ms = 3;
}

message MigrateStep {
  string label = 1;
  MigrateStepState state = 2;
}

enum MigrateStepState {
  MIGRATE_STEP_STATE_UNSPECIFIED = 0;
  MIGRATE_STEP_STATE_PENDING = 1;
  MIGRATE_STEP_STATE_DOING = 2;
  MIGRATE_STEP_STATE_DONE = 3;
  // The step that failed; the steps after it stay pending.
  MIGRATE_STEP_STATE_FAILED = 4;
}

// One holder still on an old release's holder file.
message HolderSession {
  // Empty for a shell tab.
  SessionId session = 1;
  string title = 2;
  HolderNote note = 3;
}

enum HolderNote {
  HOLDER_NOTE_UNSPECIFIED = 0;
  // An agent with turns: Migrate restarts it at its next idle moment.
  HOLDER_NOTE_RESTARTS_WHEN_IDLE = 1;
  // Its restart is under way now.
  HOLDER_NOTE_RESTARTING = 2;
  // A shell: it stays on its holder until it is closed.
  HOLDER_NOTE_STAYS_UNTIL_CLOSED = 3;
  // An agent that tells no turns, so it has no idle moment to restart at.
  HOLDER_NOTE_NO_IDLE_MOMENT = 4;
  // A terminal (agent or shell) whose holder can move: Migrate moves it onto
  // the current holder in place; the program keeps running (LIVEHOLDER, D801).
  HOLDER_NOTE_MOVES = 5;
  // Its move is under way now.
  HOLDER_NOTE_MOVING = 6;
}

message RequestAnswer {
  oneof answer {
    Approve approve = 1;
    Deny deny = 2;
    // IN-14: approve and add the card's grant, as offered.
    AlwaysLet always = 3;
    // A question's reply; becomes the result of the agent's call.
    Reply reply = 4;
  }
}

message Approve {}

message Deny {
  // "Deny and reply…" when set.
  string note = 1;
}

message AlwaysLet {
  // Must equal the request's AlwaysOption.target; anything wider fails
  // with Error.invalid_field.
  GrantTarget target = 1;
}

message Reply {
  string text = 1;
}

message InboxScope {
  oneof scope {
    GlobalInbox global = 1;
    ChannelId channel = 2;
    SessionInbox session = 3;
  }
}

message GlobalInbox {}

message SessionInbox {
  SessionId session = 1;
  // IN-2 "With its forks".
  bool with_forks = 2;
}

message ListRequestsRequest {
  InboxScope scope = 1;
  // IN-7: include answered and withdrawn.
  bool include_answered = 2;
  PageRequest page = 3;
  // INBOXHOOKS: only what belongs in the Agent inbox. To-do asks (a board
  // item's change or a new item) are left out of `requests` and
  // `pending_count`; they show on their item in To-do (BoardItem.pending).
  bool agent_inbox = 4;
}

message ListRequestsResponse {
  // VIP first (NV-22), then oldest first.
  repeated InboxRequest requests = 1;
  uint32 pending_count = 2;
  PageResponse page = 3;
  // IN-8: agent actions allowed today by a channel rule, grant, desk switch
  // or review push setting without asking the user.
  uint32 allowed_without_asking_today = 4;
}

message GetRequestRequest { RequestId id = 1; }

message AnswerRequestRequest {
  IdempotencyKey idempotency_key = 1;
  RequestId id = 2;
  RequestAnswer answer = 3;
  // The revision the user saw; a request whose preview changed (e.g. the
  // agent's target moved) fails with Error.revision_conflict.
  Revision expected_revision = 4;
  PresenceProof presence = 5;
}

message AnswerAllRequest {
  IdempotencyKey idempotency_key = 1;
  InboxScope scope = 2;
  repeated RequestId ids = 3;
  bool approve = 4;   // false: Deny all
  PresenceProof presence = 5;
}

message AnswerAllResponse {
  repeated InboxRequest answered = 1;
  // Already answered elsewhere or withdrawn; left as they were.
  repeated RequestId skipped = 2;
}
