// Types shared by every humata.v1 service. See ../../../GRPC.md for the
// rules these follow (ids, revisions, idempotency, paging, offsets).
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Ids. Each is its own message so a SessionId can never be passed where a
// ChannelId is expected. Values are opaque to clients: compare, never parse.
// ---------------------------------------------------------------------------

message ChannelId { string value = 1; }      // "ch_<ulid>"
message SessionId { string value = 1; }      // "se_<ulid>"
message MachineId { string value = 1; }      // "ma_<ulid>"; This Mac included
message RequestId { string value = 1; }      // Inbox request, "rq_<ulid>"
message GrantId { string value = 1; }        // an "Always allow …" grant
message CommentId { string value = 1; }
message ViewId { string value = 1; }
message OperationId { string value = 1; }
message TransferId { string value = 1; }
message TrashItemId { string value = 1; }
message TabId { string value = 1; }          // a terminal tab of a session
message QueuedTypingId { string value = 1; } // text waiting for a turn end
message JournalEntryId { string value = 1; } // "<machine>.<seq>", for display

// A board item's id as people see it ("PAY-7"). Items created in a machine's
// journal while the host is away get a provisional id ("~devbox-1.3") that
// the host replaces on replay; BoardItemChanged carries both.
message BoardItemId { string value = 1; }

// An agent as defined in Settings › Agents (built-in or user-added).
message AgentId { string value = 1; }        // "claude", "codex", "zsh", …

// A provider as named in Settings › Machine providers.
message ProviderId { string value = 1; }

// A GitHub repository.
message RepoRef {
  string owner = 1;
  string name = 2;
}

// A pull request on GitHub.
message PullRequestRef {
  RepoRef repo = 1;
  uint32 number = 2;
  // What a push found about an open pull request it left as it is, such as
  // "PR #3 targets main"; empty otherwise.
  string note = 3;
}

// ---------------------------------------------------------------------------
// Mutations.
// ---------------------------------------------------------------------------

// Chosen by the caller, one per user intent (UUIDv7 recommended). Retrying a
// mutation with the same key returns the first result and does nothing
// again. The host keeps keys for 30 days; journal replays are deduplicated by
// JournalPosition instead, which never expires.
message IdempotencyKey { string value = 1; }

// Every mutable entity carries a revision. Mutations name the revision they
// were made against; a stale one fails with Error.revision_conflict.
message Revision { uint64 value = 1; }

// A plan a destructive call was confirmed against (archive, delete, remove
// or forget a machine, drop a repo, empty trash, submit a review). Returned
// by the Plan* call; the executing call fails with Error.plan_stale when
// what the plan listed has changed since.
message PlanToken { string value = 1; }

// Where a write ended up.
enum Delivery {
  DELIVERY_UNSPECIFIED = 0;
  // Applied on the host; the response holds the result.
  DELIVERY_APPLIED = 1;
  // The host was unreachable: written to the machine's append-only journal
  // and applied on reconnect (SL-5). The final result arrives as an event.
  DELIVERY_JOURNALED = 2;
}

// A write accepted into a machine's journal.
message JournalPosition {
  MachineId machine = 1;
  uint64 seq = 2;
}

// ---------------------------------------------------------------------------
// Paging and streams.
// ---------------------------------------------------------------------------

message PageRequest {
  // 0 means the server's default (50). The server may return fewer.
  uint32 page_size = 1;
  // Empty for the first page; otherwise a previous next_page_token. Tokens
  // pin the snapshot the first page was read from.
  string page_token = 2;
}

message PageResponse {
  // Empty on the last page.
  string next_page_token = 1;
}

// A position in the host's event sequence (EventService). Strictly
// increasing, never reused.
message EventSeq { uint64 value = 1; }

// ---------------------------------------------------------------------------
// Shared vocabulary.
// ---------------------------------------------------------------------------

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_STARTING = 1;
  SESSION_STATUS_WORKING = 2;
  SESSION_STATUS_NEEDS_INPUT = 3;
  SESSION_STATUS_IDLE = 4;
  SESSION_STATUS_EXITED = 5;
  // The session's machine can't be reached; the session may well be running.
  SESSION_STATUS_OFFLINE = 6;
  SESSION_STATUS_MOVING = 7;
  SESSION_STATUS_RESUME_FAILED = 8;
  SESSION_STATUS_ARCHIVED = 9;
  // A plain shell, or an agent with no turn source at all; the session is
  // running and has no turns (SE-21).
  SESSION_STATUS_RUNNING_UNKNOWN_TURN = 10;
  // SE-22: the output fallback says the turn ended. Never shown as Idle;
  // stays until the user types or the agent writes output again.
  SESSION_STATUS_PROBABLY_IDLE = 11;
  // D264: its machine's sessions are stopped; Start brings it back.
  SESSION_STATUS_MACHINE_STOPPED = 12;
  // D784: the person stopped this session's agent; Resume brings it back.
  SESSION_STATUS_STOPPED = 13;
}

// SE-21: where a turn end comes from.
enum TurnEndSource {
  TURN_END_SOURCE_UNSPECIFIED = 0;
  // The agent's own hooks (Claude Code, Copilot CLI): queued messages are
  // typed on their own (SE-23).
  TURN_END_SOURCE_HOOKS = 1;
  // 3 seconds with no output: Probably idle (SE-22); queued messages wait
  // for Send now.
  TURN_END_SOURCE_OUTPUT_FALLBACK = 2;
  // A plain shell: no turns.
  TURN_END_SOURCE_NONE = 3;
}

enum ForkKind {
  FORK_KIND_UNSPECIFIED = 0;
  FORK_KIND_CODE_AND_CONTEXT = 1;
  FORK_KIND_CODE_ONLY = 2;
  FORK_KIND_CONTEXT_ONLY = 3;
}

enum BoardColumn {
  BOARD_COLUMN_UNSPECIFIED = 0;
  BOARD_COLUMN_BACKLOG = 1;
  BOARD_COLUMN_TO_DO = 2;
  BOARD_COLUMN_IN_PROGRESS = 3;
  BOARD_COLUMN_IN_REVIEW = 4;
  BOARD_COLUMN_DONE = 5;
}

enum DiffSide {
  DIFF_SIDE_UNSPECIFIED = 0;
  DIFF_SIDE_OLD = 1;
  DIFF_SIDE_NEW = 2;
}

// Inclusive, 1-based source lines.
message LineRange {
  uint32 first = 1;
  uint32 last = 2;
}

// A file inside one of a session's clones, by repo and repo-relative path.
message RepoPath {
  RepoRef repo = 1;
  string path = 2;
}

// One board (BD-1).
message BoardRef {
  oneof board {
    GlobalBoard global = 1;
    ChannelId channel = 2;
    SessionId session = 3;
  }
}

message GlobalBoard {}

// Something that can be pinned, marked VIP, linked to or audited.
message EntityRef {
  oneof entity {
    ChannelId channel = 1;
    SessionId session = 2;
    MachineId machine = 3;
    BoardItemId board_item = 4;
    RequestId request = 5;
    CommentId comment = 6;
    ViewId view = 7;
    // A PR review session; pinned and VIP apply to it as a session.
    SessionId pr_review = 8;
  }
}

// Who did something, as shown in history, audit and "by <session>" chips.
// Derived by the daemon; never accepted from a caller.
message Actor {
  oneof actor {
    UserActor user = 1;
    AgentActor agent = 2;
    SystemActor system = 3;
    ScriptActor script = 4;
  }
}

// A script calling with a script token (SEC-14).
message ScriptActor {
  string token_id = 1;
  string name = 2;
}

message UserActor {
  enum Via {
    VIA_UNSPECIFIED = 0;
    VIA_APP = 1;
    VIA_CLI_ON_HOST = 2;
    VIA_CLI_ON_MACHINE = 3;
  }
  Via via = 1;
  MachineId machine = 2;
}

message AgentActor {
  SessionId session = 1;
  MachineId machine = 2;
  AgentId agent = 3;
  // The session's title when the action happened.
  string session_title = 4;
}

message SystemActor {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_RETENTION_RULE = 1;   // LD-16..18
    REASON_TRASH_EXPIRY = 2;     // LD-7
    REASON_BOOT_RECONCILE = 3;   // PER-13
    REASON_PR_POLL = 4;          // PR-15
    REASON_SKILLS_AUTO_SYNC = 5; // SK-3
    REASON_JOURNAL_REPLAY = 6;   // SL-5
  }
  Reason reason = 1;
}

// How a chunk's bytes are encoded (TR-11, TR-13, D60, D65). The values
// are the codec ids frames use at rest too: one byte, never reused. NONE is
// 0 so a peer that predates compression sends and expects raw bytes.
enum ChunkCodec {
  CHUNK_CODEC_NONE = 0;
  CHUNK_CODEC_LZ4 = 1;  // LZ4 block format
  CHUNK_CODEC_ZSTD = 2; // one Zstandard frame
}

message Timestamped {
  google.protobuf.Timestamp at = 1;
  Actor by = 2;
}

// D261: a stop of one machine's sessions, as the machine, the host and the
// peer link's Hello tell it.
enum StopVia {
  STOP_VIA_UNSPECIFIED = 0;
  STOP_VIA_APP = 1;
  STOP_VIA_CLI = 2;
  STOP_VIA_SSH = 3;
  STOP_VIA_DIRECT = 4;
}
enum StoppedByKind {
  STOPPED_BY_KIND_UNSPECIFIED = 0;
  STOPPED_BY_KIND_USER = 1;
  STOPPED_BY_KIND_AGENT = 2;
  STOPPED_BY_KIND_TERMINAL = 3;
  STOPPED_BY_KIND_SCRIPT = 4;  // a script token that lists the capability
}
message StoppedBy {
  StoppedByKind kind = 1;
  StopVia via = 2;
  string machine = 3;
  string session = 4;   // the agent's session, when an agent stopped it
}
message StopEnded {
  uint32 agents = 1;
  uint32 shells = 2;
  uint32 killed = 3;    // ended only by SIGKILL after the grace period
  uint32 left = 4;      // processes still alive after the sweep (should be 0)
}
message SessionsStopped {
  string stop_id = 1;
  int64 stopped_at_unix_ms = 2;
  StoppedBy by = 3;
  string reason = 4;
  StopEnded ended = 5;  // unset until the sweep has run
}

// ---------------------------------------------------------------------------
// Shared diff specification and pull request state.
// ---------------------------------------------------------------------------

// RV-31: per repo, what a review shows. Every base of RV-1 is one, and
// review_prepare and the skills write one (D55, D57). Computed on the
// session's machine by humata2_review_diff.
message DiffSpec {
  repeated RepoDiffSpec repos = 1;
}

message RepoDiffSpec {
  RepoRef repo = 1;
  // The old side.
  DiffSpecBase base = 2;
  // The new side: how much of the work in progress counts.
  DiffSpecCompare compare = 3;
  // Git pathspecs relative to the repo root (`src/`, `*.sql`). An empty
  // include shows every path.
  repeated string include_paths = 4;
  repeated string exclude_paths = 5;
  DiffWhitespace whitespace = 6;
  // Renames are detected (git -M) unless this is set; then a moved file
  // is a deletion and an addition.
  bool no_renames = 7;
}

message DiffSpecBase {
  oneof base {
    // The merge base of HEAD and this branch, as GitHub shows a pull
    // request (`origin/main...HEAD`).
    string merge_base_with = 1;
    // A branch, tag or commit as it is.
    string rev = 2;
    // A reviewed snapshot of this session (RV-28): its n, or 0 for the
    // latest.
    uint32 reviewed_snapshot = 3;
    // The parent's fork point (forks only).
    ForkPointBase fork_point = 4;
    // What is staged, for "only my unstaged changes".
    IndexBase index = 5;
    // This repo's pull request's base, merge-base form (PR-10). PR review
    // sessions only; a repo that is no pull request's is refused.
    PullRequestBaseRef pull_request_base = 6;
  }
}

message ForkPointBase {}
message IndexBase {}
// PR-10: this repo's pull request's base, merge-base form, PR review
// sessions only.
message PullRequestBaseRef {}

message DiffSpecCompare {
  enum Upto {
    UPTO_UNSPECIFIED = 0;  // as UNSTAGED
    UPTO_COMMITS = 1;      // HEAD's commit only
    UPTO_STAGED = 2;       // plus the index
    UPTO_UNSTAGED = 3;     // plus tracked files as they are on disk
  }
  enum Untracked {
    UNTRACKED_UNSPECIFIED = 0;  // as ALL
    UNTRACKED_NONE = 1;
    UNTRACKED_ALL = 2;          // every file git doesn't ignore
    UNTRACKED_PATHS = 3;        // only under untracked_paths
  }
  Upto upto = 1;
  Untracked untracked = 2;
  repeated string untracked_paths = 3;
  // The new side ends at this commit, branch or tag, not at the
  // checkout (D800). Upto and untracked must then be left unset.
  string head = 4;
  // Working-tree files under these pathspecs (tracked changes and
  // untracked files git doesn't ignore) laid over the new side, which is
  // HEAD unless head is set. Nothing else from the working tree counts.
  repeated string worktree_paths = 5;
}

enum DiffWhitespace {
  DIFF_WHITESPACE_UNSPECIFIED = 0;     // whitespace counts
  DIFF_WHITESPACE_IGNORE_CHANGES = 1;  // git -b
  DIFF_WHITESPACE_IGNORE_ALL = 2;      // git -w
}

enum PullRequestState {
  PULL_REQUEST_STATE_UNSPECIFIED = 0;
  PULL_REQUEST_STATE_OPEN = 1;
  PULL_REQUEST_STATE_MERGED = 2;
  PULL_REQUEST_STATE_CLOSED = 3;
}

// ---------------------------------------------------------------------------
// Shared session work and archive dispositions.
// ---------------------------------------------------------------------------

message SessionWork {
  SessionId session = 1;
  string title = 2;
  uint32 dirty_files = 3;
  uint32 unpushed_commits = 4;
}

// What to do with one session on a machine that leaves (CH-8, LD-10).
message SessionDisposition {
  SessionId session = 1;
  oneof disposition {
    MachineId move_to = 2;
    ArchiveChoice archive = 3;
  }
}

// MV-9's three answers, minus Cancel.
enum ArchiveChoice {
  ARCHIVE_CHOICE_UNSPECIFIED = 0;
  // Only valid without unpushed work.
  ARCHIVE_CHOICE_ARCHIVE = 1;
  ARCHIVE_CHOICE_COMMIT_PUSH_PR_THEN_ARCHIVE = 2;
  ARCHIVE_CHOICE_ARCHIVE_AND_DELETE_WORK = 3;
}

// ---------------------------------------------------------------------------
// Shared board change previews.
// ---------------------------------------------------------------------------

message FieldChange {
  string field = 1;     // "status"
  string before = 2;    // "To do"
  string after = 3;     // "In review"
}

message BoardChangePreview {
  BoardItemId item = 1;
  string item_title = 2;
  repeated FieldChange changes = 3;
  bool deletes_item = 4;
}

// ---------------------------------------------------------------------------
// Shared file locations and chunks.
// ---------------------------------------------------------------------------

message FileLocation {
  MachineId machine = 1;
  oneof root {
    SessionClone session_clone = 2;
    ChannelShared channel_shared = 3;
    MainClone main_clone = 4;          // read-only (FC-2)
    ChannelFolder channel_folder = 5;  // FM-10, FM-11
    // FM-10: the user's home folder on the machine. The user only: an
    // agent that names it gets Error.outside_humata_folders.
    MachineHome home = 7;
    // D335: what was pasted into a session's terminals, on the session's
    // machine. The user only, like home.
    SessionPastes session_pastes = 8;
    // D382: a session's own folder, where a Desk session's documents sit,
    // outside every clone. An agent reaches it as it reaches a clone of
    // that session: by the session's own grants.
    SessionFolder session_folder = 9;
    // PL-4, D540: where files sent machine-only from a place that is not a
    // channel's land on this machine, `<root>/received/<from>/`. The user
    // only, like home: an agent that names it gets
    // Error.outside_humata_folders.
    MachineReceived received = 10;
    // ATM-3: an agent's read-only session artifacts folder (plans, todos,
    // transcripts). User-only by default; agents get
    // Error.outside_humata_folders unless an explicit rule allows it.
    SessionAgentState session_agent_state = 11;
  }
  // Relative to the root; "..", absolute paths and symlinks out fail with
  // Error.outside_humata_folders.
  string path = 6;
}

message SessionClone {
  SessionId session = 1;
  RepoRef repo = 2;
}

message ChannelShared { ChannelId channel = 1; }

message MainClone {
  ChannelId channel = 1;
  RepoRef repo = 2;
}

message ChannelFolder { ChannelId channel = 1; }

message MachineHome {}

message SessionPastes { SessionId session = 1; }

message SessionFolder { SessionId session = 1; }

message SessionAgentState {
  SessionId session = 1;
  string conversation_id = 2;
}

// The received place for files that came from machine `from` (PL-4). `from`
// is one machine id: no "/" and no "..".
message MachineReceived { MachineId from = 1; }

// At most 1 MiB of the file, before encoding (TR-11).
message FileChunk {
  // Where the chunk's decoded bytes start in the file.
  uint64 offset = 1;
  // The chunk's bytes, encoded with `codec`.
  bytes data = 2;
  // On the last chunk: the whole file's SHA-256.
  string sha256 = 3;
  bool last = 4;
  // Only a codec the receiver listed (accept_codecs, ServerInfo or Hello
  // chunk_codecs); a chunk that doesn't shrink is sent as NONE.
  ChunkCodec codec = 5;
  // The decoded length; 0 with NONE means len(data).
  uint32 raw_size = 6;
  // CRC-32 (IEEE) of the decoded bytes. Always set on a compressed chunk.
  optional uint32 crc32 = 7;
}

// ---------------------------------------------------------------------------
// Shared status and event vocabulary.
// ---------------------------------------------------------------------------

enum Change {
  CHANGE_UNSPECIFIED = 0;
  CHANGE_CREATED = 1;
  CHANGE_UPDATED = 2;
  CHANGE_DELETED = 3;   // the snapshot is the last state, then a tombstone
}

enum DaemonRole {
  DAEMON_ROLE_UNSPECIFIED = 0;
  // The Mac: source of truth (SL-1).
  DAEMON_ROLE_HOST = 1;
  // Any other machine: clones and live context only (SL-2).
  DAEMON_ROLE_MACHINE = 2;
}

enum Reachability {
  REACHABILITY_UNSPECIFIED = 0;
  REACHABILITY_ONLINE = 1;
  REACHABILITY_CONNECTING = 2;
  // HO-5: the link is down; sessions may well be running.
  REACHABILITY_OFFLINE = 3;
  // MP-16: interactive machine whose login lapsed.
  REACHABILITY_NEEDS_LOGIN = 4;
  // MP-21: the provider's status says stopped.
  REACHABILITY_STOPPED = 5;
  // MP-9: the pinned host key no longer matches; nothing is sent.
  REACHABILITY_HOST_KEY_CHANGED = 6;
  // LD-12: the machine answered the peer link without proof that it holds
  // the enrollment key on record (re-imaged, swapped, or posing as it), or
  // refused the host's proof. The host stops dialling it; add it again as
  // a new machine.
  REACHABILITY_IDENTITY_MISMATCH = 7;
}

enum ViewState {
  VIEW_STATE_UNSPECIFIED = 0;
  VIEW_STATE_DRAFT = 1;              // prepared, not ready
  VIEW_STATE_WAITING = 2;            // "Waiting for you"
  VIEW_STATE_LATER = 3;
  VIEW_STATE_NOT_NOW = 4;
  VIEW_STATE_OPENED = 5;
  VIEW_STATE_REVERTED = 6;
  VIEW_STATE_OPENED_AND_CLOSED = 7;
  VIEW_STATE_KEPT = 8;
}
