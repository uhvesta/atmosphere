// Host <-> machine link (AR-4, TR-2, SL-3..6, LD-8, AW-3..6). Served by each
// remote humatad on the stdio of `humatad serve --stdio`, which the host
// starts over SSH (MP-7). Never served on a unix socket: no local client,
// agent or CLI can call these. The host is the gRPC client; machine-to-host
// traffic rides the Uplink stream the host opens.
//
// A machine also serves TerminalService, FileService and DiffService on the
// same link, so the host can relay the app's calls; the host has already
// checked access. The machine trusts the link only once the host has proved
// it holds the machine's enrollment key (Hello, then ProveHost; GRPC.md §8):
// until then it refuses every call but those two and DaemonService.WhoAmI
// with Error.peer_unproven.
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/access.proto";
import "humata/v1/build.proto";
import "humata/v1/capabilities.proto";
import "humata/v1/common.proto";
import "humata/v1/errors.proto";
import "humata/v1/inbox.proto";
import "humata/v1/sessions.proto";

service PeerService {
  // First call on every link, and only one per link. The machine proves it
  // holds the enrollment key and sends a nonce of its own. The host fails
  // the link with Error.identity_mismatch when the proof is wrong or the
  // machine isn't the one on record (a re-imaged or swapped machine, LD-12)
  // and with peer_version_unsupported outside N-2. The machine refuses it
  // with peer_unproven when it has no usable key.
  rpc Hello(HelloRequest) returns (HelloResponse);

  // Second call on every link: the host proves it holds the same key. Until
  // it succeeds, every call but Hello, ProveHost and DaemonService.WhoAmI
  // is refused with peer_unproven. A wrong proof is refused and the machine
  // closes the link.
  rpc ProveHost(ProveHostRequest) returns (ProveHostResponse);

  // One per link, for its life. Ordered both ways; each side acks what it
  // has made durable, and both resume from the acks after a reconnect.
  rpc Uplink(stream HostToMachine) returns (stream MachineToHost);

  // Holders (PER-1, PER-5, PER-11..17). The host writes the session record
  // first (SL-1); the machine fsyncs its own copy before launching (PER-11).
  rpc LaunchSession(LaunchSessionRequest) returns (LaunchSessionResponse);
  rpc StopHolder(StopHolderRequest) returns (StopHolderResponse);
  // PER-13..15: verified resume; returns Error.resume_failed with the
  // reason, never a silent fresh start.
  rpc ResumeHolder(ResumeHolderRequest) returns (LaunchSessionResponse);
  rpc ListHolders(ListHoldersRequest) returns (ListHoldersResponse);

  // Clones (FC-3..9, MV-2, FK-5, SL-4). With gh on the machine it clones
  // from GitHub; without, from a bundle the host streams in (SEC-2).
  rpc PrepareClone(PrepareCloneRequest) returns (PrepareCloneResponse);
  rpc ReceiveBundle(stream BundleChunk) returns (ReceiveBundleResponse);
  rpc CreateBundle(CreateBundleRequest) returns (stream BundleChunk);
  // FC-7: the host pushes with its own token; the machine only packs.
  rpc CreatePushPack(CreatePushPackRequest) returns (stream BundleChunk);

  // Conversations (FK-2, MV-3, SL-4). Import rewrites paths from the old
  // folder to the new and, for a fork, gives the copy a new id.
  rpc ExportConversation(ExportConversationRequest) returns (stream ConversationChunk);
  rpc ImportConversation(stream ImportConversationMessage) returns (ImportConversationResponse);

  // SK-1..7: writes only into the Humata-managed skills folder.
  rpc ApplySkills(stream SkillsMessage) returns (ApplySkillsResponse);

  // HO-1 check, HO-4 health, LD-13 storage.
  rpc Probe(ProbeRequest) returns (ProbeResponse);
}

// ---------------------------------------------------------------------------

// The enrollment key is random bytes the host writes on the machine when it
// adds it, as hex in a 0600 file, and keeps in the Mac's keychain. Both
// proofs are HMAC-SHA256 under it, each over a label naming its side, so
// neither side's proof can be replayed as the other's:
//   machine: HMAC(key, "humata-peer-machine-v1" || nonce || machine_nonce)
//   host:    HMAC(key, "humata-peer-host-v1" || machine_nonce || nonce)
// An uncontained agent on the machine runs as the user (SPEC D1) and can
// read the key, so the proofs keep out a swapped machine and a contained
// agent, not an uncontained one.
message HelloRequest {
  MachineId expected_machine = 1;
  uint32 host_api_major = 2;
  uint32 host_api_minor = 3;
  // The host's nonce: 32 to 64 random bytes, new for each link.
  bytes nonce = 4;
  // MP-15 interactive takeover marker, when the link came up that way.
  string sync_marker = 5;
  // The codecs the host decodes, best first (TR-11).
  repeated ChunkCodec chunk_codecs = 6;
  // UP-1, D281: the host's build.
  BuildInfo host_build = 7;
}

message HelloResponse {
  MachineId machine = 1;
  // The machine's proof, as above.
  bytes proof = 2;
  string daemon_version = 3;
  uint32 api_major = 4;
  uint32 api_minor = 5;
  // Highest journal seq written; the host replays up to it (SL-5).
  uint64 journal_high_water = 6;
  // Holders running now, found after a daemon restart (PER-5).
  repeated SessionId running = 7;
  google.protobuf.Timestamp booted_at = 8;
  // The machine's nonce: exactly 32 random bytes, new for each link, which
  // the host's proof covers.
  bytes machine_nonce = 9;
  // The codecs the machine decodes, best first (TR-11).
  repeated ChunkCodec chunk_codecs = 10;
  // D262: set while this machine's sessions are stopped, read from its stop
  // record by the link itself, so it is told even while the daemon is down.
  SessionsStopped sessions_stopped = 11;
  // UP-1, D281: the build of the daemon the link relays to (not the
  // link's own binary), as its ServerInfo reports it.
  BuildInfo build = 12;
}

message ProveHostRequest {
  // The host's proof, as above HelloRequest.
  bytes proof = 1;
}

message ProveHostResponse {}

// ---------------------------------------------------------------------------

message HostToMachine {
  oneof message {
    UplinkAck ack = 1;
    ForwardedResult result = 2;
    PolicySnapshot policy = 3;
    InboxAnswerRelay answer = 4;
    RequestWithdrawnRelay withdrawn = 5;
    UplinkResume resume = 6;
    PushResult push_result = 7;
  }
}

message MachineToHost {
  oneof message {
    UplinkAck ack = 1;
    PointersReport pointers = 2;
    // Not used (D189). The host reads another machine's conversations itself, by
    // pull: it calls HistoryService.ReadMirror through the relay from the byte
    // offset its mirror saved, and the machine scrubs the lines before they leave
    // it. Offsets there count the machine's own file bytes, not scrubbed bytes.
    // Nothing sends or acks this field.
    MirrorChunk mirror = 3;
    SessionStatusReport status = 4;
    JournalEntry journal = 5;
    ForwardedCall call = 6;
    ForwardedCallCancel cancel = 7;
    LocalAnswer local_answer = 8;
    PushRequested push = 9;
    UplinkResume resume = 10;
    InboxAnswerRefused answer_refused = 11;
    // D378: the holders on this machine that are on an old release's holder
    // file. Pushed on each change, and again after UplinkResume on every link.
    HoldersReport holders = 12;
    // A file created, deleted, or renamed in a live session on this machine.
    FileChangedReport file_changed = 13;
  }
}

message FileChangedReport {
  SessionId session = 1;
  RepoRef repo = 2;
  int32 kind = 3;
  string path = 4;
  string old_path = 5;
  bool folder = 6;
}

// D378: the whole list each time, so a lost one costs nothing. Agent rows and
// shell rows (an empty session) alike; an empty list means none is on an old
// holder.
message HoldersReport {
  repeated HolderSession holders = 1;
  // Added after D378: why the machine's last restart of an agent onto the
  // current holder failed. Its message names the session and the cause, its
  // fix says to click Migrate again or close the session. The host shows the
  // machine's Holders item as Failed with it, and Migrate stays on offer. The
  // machine drops it when it begins the next restart round and when it lists
  // no old holder; a report without it clears the host's Failed. Unset: no
  // failure.
  Error failed = 2;
  // PROGRESS T6: the machine's current or last round of moves; unset when
  // none ran since its daemon started.
  HoldersMoved moved = 3;
}

// What the sender has made durable. The host acks journal seqs once the
// entry is applied or rejected; the machine acks policy revisions and relayed
// answers once stored.
message UplinkAck {
  uint64 journal_through = 1;
  // Not used (D189). The host reads another machine's conversations itself, by
  // pull: it calls HistoryService.ReadMirror through the relay from the byte
  // offset its mirror saved, and the machine scrubs the lines before they leave
  // it. Offsets there count the machine's own file bytes, not scrubbed bytes.
  // Nothing sends or acks this field.
  repeated MirrorOffset mirror = 2;
  uint64 policy_revision = 3;
  uint64 answers_through = 4;
}

// Not used (D189). The host reads another machine's conversations itself, by
// pull: it calls HistoryService.ReadMirror through the relay from the byte
// offset its mirror saved, and the machine scrubs the lines before they leave
// it. Offsets there count the machine's own file bytes, not scrubbed bytes.
// Nothing sends or acks this message.
message MirrorOffset {
  SessionId session = 1;
  uint64 offset = 2;
}

// First message each way after Hello, saying where to resume.
message UplinkResume {
  UplinkAck from = 1;
}

// SL-3. Full set per session each time, so a lost one costs nothing.
message PointersReport {
  SessionId session = 1;
  repeated Pointer pointers = 2;
  google.protobuf.Timestamp at = 3;
}

// LD-8: the conversation file, append-only, offset-keyed.
// Not used (D189). The host reads another machine's conversations itself, by
// pull: it calls HistoryService.ReadMirror through the relay from the byte
// offset its mirror saved, and the machine scrubs the lines before they leave
// it. Offsets there count the machine's own file bytes, not scrubbed bytes.
// Nothing sends or acks this message.
message MirrorChunk {
  SessionId session = 1;
  string conversation_id = 2;
  uint64 offset = 3;
  bytes data = 4;
  // The agent rewrote the file (compaction): the host starts a new
  // generation and keeps the old one in history.
  bool rewritten = 5;
  // Names whose values were replaced in this chunk; never the values.
  repeated string scrubbed_names = 6;
}

message SessionStatusReport {
  SessionId session = 1;
  SessionStatus status = 2;
  // From the agent's adapter; unknown when it gives none (SM-10).
  enum Turn {
    TURN_UNSPECIFIED = 0;
    TURN_UNKNOWN = 1;
    TURN_IDLE = 2;
    TURN_WORKING = 3;
    TURN_WAITING_ON_TOOL = 4;
  }
  Turn turn = 3;
  int32 exit_code = 4;
  Error problem = 5;   // resume_failed, disk_full
  // CH-16, D394: the machine's read mark for the session, so the host shows
  // it unread too and viewing it there clears it here.
  bool unread = 6;
}

// The agent a forwarded call or journal entry speaks for. The host accepts
// it only for sessions it has placed on this machine: a machine can't act
// for a session elsewhere (Error.identity_mismatch).
message AgentPrincipal {
  SessionId session = 1;
  // Which MCP process: its pid and start time, for the audit only.
  uint32 pid = 2;
}

// SL-5: an MCP write made while the host was unreachable, accepted under the
// last PolicySnapshot (GRPC.md §9).
message JournalEntry {
  uint64 seq = 1;
  google.protobuf.Timestamp at = 2;
  AgentPrincipal principal = 3;
  // The MCP operation id ("board.item_update") and its request, as the
  // gRPC request message it maps to.
  string operation = 4;
  bytes request = 5;
  // The entity revision the agent last saw; the host uses it to tell a
  // conflict from a plain update (SL-6).
  Revision base_revision = 6;
  // The policy the machine judged it under.
  uint64 policy_revision = 7;
  // Ids the machine gave things it made ("~devbox-1.3").
  repeated BoardItemId provisional_ids = 8;
  // BD-15, AW-9: the request the user approved for this write, held by this
  // machine. The host applies the entry under an Ask rule only when its
  // mirror of that request is Approved, made by this session and about this
  // item. It never overrides Never.
  RequestId approved_request = 9;
}

// A client call the machine can't answer itself: an MCP tool, or `humata`
// on the machine. The host runs it as that principal and answers with
// ForwardedResult. Cancelled when the caller goes away; a mutation already
// started is not undone (GRPC.md §7).
message ForwardedCall {
  uint64 call_id = 1;
  oneof principal {
    AgentPrincipal agent = 2;
    // `humata` run by the user over SSH on the machine (AW-5), with the
    // presence it proved there.
    MachineUser user = 3;
  }
  // Full gRPC method name, "/humata.v1.BoardService/UpdateItem".
  string method = 4;
  bytes request = 5;
  google.protobuf.Timestamp deadline = 6;
  IdempotencyKey idempotency_key = 7;
}

message MachineUser {
  // Approval passphrase, checked by the host (never by the machine).
  PresenceProof presence = 1;
  // Not inside any Humata session's terminal (PresenceRequired otherwise).
  bool outside_sessions = 2;
}

message ForwardedCallCancel { uint64 call_id = 1; }

message ForwardedResult {
  uint64 call_id = 1;
  oneof outcome {
    bytes response = 2;
    // An Ask on the host comes back here as error.kind approval_pending; the
    // request is the host's, and the agent waits on it through forwarded
    // InboxService calls (D268).
    Error error = 3;
  }
  reserved 4;
  reserved "pending";
}

// What a machine needs to judge its agents' calls while the host is away
// (GRPC.md §9, AW-8). Sent on every change; versioned; the machine applies
// it only forward. Nothing on the machine can change it: only a newer
// snapshot from the host replaces it.
message PolicySnapshot {
  uint64 revision = 1;
  google.protobuf.Timestamp at = 2;
  repeated ChannelRules channels = 3;
  // Grants for sessions on this machine only.
  repeated Grant grants = 4;
  // Board items the machine's sessions own or may edit, with revisions, so
  // journaled edits can be checked for ownership (BD-9).
  repeated OwnedItem owned_items = 5;
  // The capabilities whose Ask is decided by AwayRule while the host is away.
  repeated Capability low_risk = 6;
  // What new channels start with. Unset: every rule at its default and
  // While I'm away at Wait.
  DefaultRules defaults = 7;
  // The approval passphrase's Argon2id hash (PHC string), checked on the
  // machine while the host is away (SEC-13, AW-5); empty when none is set.
  string approval_verifier = 8;
  // Settings › Security › Contain agents (SEC-6, D217).
  bool contain_agents = 9;
  // Channels that chose for themselves; any other channel in `channels`
  // follows contain_agents.
  repeated ChannelContain channel_contain = 10;
  // Settings › General › Git worktrees: synced to linked remote machines (default true).
  optional bool use_worktrees = 11;
}

// A channel's own Contain agents choice (D217).
message ChannelContain {
  ChannelId channel = 1;
  bool contain_agents = 2;
}

message OwnedItem {
  BoardItemId item = 1;
  SessionId owner = 2;
  Revision revision = 3;
  // The board the item is on: the machine judges an edit by it (D227).
  BoardRef board = 4;
}

// AW-6: answered in one place, answered everywhere.
message InboxAnswerRelay {
  uint64 seq = 1;
  RequestId request = 2;
  RequestAnswer answer = 3;
  Actor by = 4;
  google.protobuf.Timestamp at = 5;
}

message RequestWithdrawnRelay {
  uint64 seq = 1;
  RequestId request = 2;
}

// The machine's refusal of an InboxAnswerRelay it could not apply: the request
// was already answered there (the error names who and how), is no longer held
// there, or the answer's principal check failed. The host answers its user
// with `error` at once instead of waiting for a journal entry that won't come.
message InboxAnswerRefused {
  RequestId request = 1;
  Error error = 2;
  // The gRPC status code the host answers with (google.rpc.Code).
  int32 code = 3;
}

// AW-5: the user answered a journaled request on the machine while the host
// was away. The machine already acted on it; the host records it, and the
// first answer recorded at the site holding the call wins (GRPC.md §9).
message LocalAnswer {
  RequestId request = 1;
  RequestAnswer answer = 2;
  google.protobuf.Timestamp at = 3;
}

// FC-7: a session's `git push` on a machine without gh.
message PushRequested {
  uint64 push_id = 1;
  SessionId session = 2;
  RepoRef repo = 3;
  repeated string refs = 4;
}

message PushResult {
  uint64 push_id = 1;
  Error error = 2;   // unset: pushed
}

// ---------------------------------------------------------------------------

message LaunchSessionRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  string folder = 3;
  AgentId agent = 4;
  repeated string argv = 5;
  repeated string variable_names = 6;
  // PER-12.
  string conversation_id = 7;
  uint32 cols = 8;
  uint32 rows = 9;
  // humatad mcp is given this; it binds the server to the session.
  bytes session_token = 10;
}

message LaunchSessionResponse {
  SessionId session = 1;
  TabId agent_tab = 2;
  uint32 holder_pid = 3;
}

message StopHolderRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
}

message StopHolderResponse {
  int32 exit_code = 1;
}

message ResumeHolderRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  string conversation_id = 3;
  // PER-14: what to tell the agent once it has resumed.
  string resume_note = 4;
  bytes session_token = 5;
}

message ListHoldersRequest {}

message ListHoldersResponse {
  repeated SessionId running = 1;
}

message PrepareCloneRequest {
  IdempotencyKey idempotency_key = 1;
  string path = 2;
  RepoRef repo = 3;
  string branch = 4;
  string base_sha = 5;
  enum Method {
    METHOD_UNSPECIFIED = 0;
    METHOD_GH = 1;
    // Wait for ReceiveBundle with this clone's path.
    METHOD_BUNDLE = 2;
    // FC-5: local clone of the channel's main clone.
    METHOD_FROM_MAIN = 3;
  }
  Method method = 6;
  bool read_only = 7;   // main clones (FC-2), PR reviews (PR-7)
}

message PrepareCloneResponse {
  Pointer pointer = 1;
}

message BundleChunk {
  // First chunk only.
  string path = 1;
  uint64 offset = 2;
  bytes data = 3;
  string sha256 = 4;   // last chunk: the whole bundle's
  bool last = 5;
}

message ReceiveBundleResponse {
  Pointer pointer = 1;
}

message CreateBundleRequest {
  string path = 1;
  // Everything not on the remote, plus uncommitted work as a commit on a
  // side ref (MV-2), so a move loses nothing.
  bool include_uncommitted = 2;
}

message CreatePushPackRequest {
  uint64 push_id = 1;
  string path = 2;
  repeated string refs = 3;
}

message ExportConversationRequest {
  SessionId session = 1;
  string conversation_id = 2;
  uint64 offset = 3;
}

message ConversationChunk {
  uint64 offset = 1;
  bytes data = 2;
  string sha256 = 3;
  bool last = 4;
}

message ImportConversationHeader {
  SessionId session = 1;
  AgentId agent = 2;
  // For a fork, a new id; for a move, the same id.
  string conversation_id = 3;
  string old_folder = 4;
  string new_folder = 5;
}

message ImportConversationMessage {
  oneof message {
    ImportConversationHeader header = 1;
    ConversationChunk chunk = 2;
  }
}

message ImportConversationResponse {
  string conversation_id = 1;
  uint32 paths_rewritten = 2;
}

message SkillsManifestEntry {
  string agent = 1;
  string path = 2;
  string sha256 = 3;
  uint64 size = 4;
}

message SkillsMessage {
  oneof message {
    // First message: the full intended state; files not listed are removed
    // from the managed folder only.
    SkillsManifest manifest = 1;
    SkillsFile file = 2;
  }
}

message SkillsManifest {
  uint64 version = 1;
  repeated SkillsManifestEntry entries = 2;
}

message SkillsFile {
  string agent = 1;
  string path = 2;
  uint64 offset = 3;
  bytes data = 4;
  bool last = 5;
}

message ApplySkillsResponse {
  uint64 version = 1;
  // SK-5: same-name skills made on the machine.
  repeated string clashes = 2;
}

message ProbeRequest {
  bool measure_storage = 1;   // LD-14: only when the page opens
}

message ProbeResponse {
  string os = 1;
  string arch = 2;
  string git_version = 3;
  string gh_user = 4;
  repeated string gh_scopes = 5;
  repeated AgentId agents_installed = 6;
  uint64 disk_free_bytes = 7;
  uint64 disk_total_bytes = 8;
  repeated string variable_names = 9;
  bool linger_enabled = 10;
  // Sizes by Humata folder, when measured.
  map<string, uint64> folder_bytes = 11;
  // HO-4: the number in `gh --version`, such as "2.83.0"; empty: no gh, or it said
  // nothing usable in time.
  string gh_version = 12;
  // HO-4: the number in each found agent's `--version`, such as "2.4.1", one for each
  // entry of agents_installed and in its order; empty: it printed none in time.
  repeated string agent_versions = 13;
}
