// The first call on every connection, and who the daemon decided you are.
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/build.proto";
import "humata/v1/common.proto";
import "humata/v1/operations.proto";
import "humata/v1/peer.proto";

service DaemonService {
  // Versions, role and features. Clients call it first and refuse to go on
  // when api_major differs.
  rpc GetServerInfo(GetServerInfoRequest) returns (ServerInfo);
  // The principal this connection was bound to (BOUNDARIES.md §2). Callers
  // can't choose it; there is no field to. Answers a caller with no
  // credential too, which every other call refuses (SEC-9).
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // D144: the peer link's socket connection asks for a nonce, offered to the
  // host as the machine's Hello nonce. Open to any caller; grants nothing.
  rpc BeginRelay(BeginRelayRequest) returns (BeginRelayResponse);
  // D144: the link hands over the host's nonce and ProveHost proof as
  // received; on success this connection is the host's.
  rpc CompleteRelay(CompleteRelayRequest) returns (CompleteRelayResponse);
  // AWAY (GRPC.md §9): the peer link's process opens this on its proven
  // relay connection when the host opens the link's Uplink, before it
  // answers the host's Resume, and carries the Uplink's messages both ways
  // through it. The machine's daemon counts its host reachable exactly
  // while one is open; a newer one ends the older. The host can't relay
  // it, and every other caller is refused.
  rpc PeerUplink(stream HostToMachine) returns (stream MachineToHost);
  // PER-30, D242: the restart doctor's safe repairs. Re-runs the bring-back
  // for one session or shell tab that the last start didn't bring back, or
  // checks the store and, if it is damaged, makes the daemon exit so its
  // next start restores the last good copy. Never loses anything. The user
  // may call it, and an agent under the same rule as ResumeSession.
  rpc RepairRestart(RepairRestartRequest) returns (RepairRestartResponse);
  // D261: stops every session on this machine as a shutdown would, and keeps
  // them stopped across restarts until StartSessions. The reply comes once
  // the stop is recorded; the daemon then restarts itself into the sweep.
  // The user only (with presence); an agent under MachineSessionsStop (D263).
  rpc StopSessions(StopSessionsRequest) returns (StopSessionsResponse);
  // D265: brings back what a stop ended, exactly as after a shutdown. The
  // reply comes once the start is recorded; the daemon then restarts itself.
  rpc StartSessions(StartSessionsRequest) returns (StartSessionsResponse);
  // UP-1, D281: moves this machine's daemon to another release in place.
  // The release's files must already be staged in `~/.humata2/bin` as
  // `.<name>.next` and `.bundle.json.next` (the bundle id is the sha256 of
  // that bundle.json). The daemon checks them, records the upgrade, swaps
  // the files in, answers with the build it was, and then starts itself
  // again from the new file: same process id, holders and sessions kept.
  // Refused with FAILED_PRECONDITION when the staged files are missing or
  // aren't that release. The user (or the host's link) only; an agent or
  // script is refused. Open to a machine at another release (D281 e).
  rpc Upgrade(UpgradeRequest) returns (UpgradeResponse);
}

// Optional behaviour a peer may lack. Unknown values are ignored.
enum Feature {
  FEATURE_UNSPECIFIED = 0;
  FEATURE_ZSTD_STREAMS = 1;
  FEATURE_VM_TIER = 2;
  FEATURE_CRIU = 3;
  FEATURE_GH_SIGNED_IN = 4;
}

message GetServerInfoRequest {}

message ServerInfo {
  // This API is humata.v1; api_major is 1 for its whole life.
  uint32 api_major = 1;
  // Grows with every additive change; clients gate new calls on it.
  uint32 api_minor = 2;
  string daemon_version = 3;
  DaemonRole role = 4;
  MachineId machine = 5;
  repeated Feature features = 6;
  // The codecs this daemon takes in chunks sent to it, best first by its
  // compression setting; senders use the first they support. Empty (an
  // older daemon) or only NONE (compression Off): send raw chunks.
  repeated ChunkCodec chunk_codecs = 7;
  // What this daemon found and brought back when it started (PER-29,
  // PER-31). Only the user gets it; unset for anyone else, and unset
  // while the daemon is still bringing sessions back, which it does while
  // it already serves (an agent may take 30 s to resume).
  LastStart last_start = 8;
  // A machine's daemon: whether its host's link is up now (GRPC.md §9).
  // While it isn't, the machine judges its own clients' calls as AW-7
  // says for the host away. The host's daemon always says true.
  bool host_reachable = 9;
  // UP-1, D281: which release this daemon is.
  BuildInfo build = 10;
}

message LastStart {
  // The restart report's folder (a bug report folder with restart.json
  // beside it). Empty when it couldn't be written.
  string report = 1;
  // Each agent or shell that wasn't brought back, one line each.
  repeated NotBroughtBack not_brought_back = 2;
  // Set when the state was damaged and restored from its last good copy:
  // when that copy was taken. Zero otherwise.
  int64 restored_copy_taken_unix_ms = 3;
  // Rows lost or rolled back by that restore, over all tables.
  uint32 restored_rows_changed = 4;
  // When this daemon started (frame 47: "devbox-1 restarted at 09:12").
  google.protobuf.Timestamp started_at = 5;
  // The sessions whose agents were started again on their conversations
  // ("3 sessions started again"); each id once.
  repeated SessionId resumed = 6;
  // D265: this start was a Start after a stop: which stop.
  AfterStop after_stop = 7;
  // D265: set while this machine's sessions are stopped; nothing was
  // brought back and no report written.
  SessionsStopped sessions_stopped = 8;
}

message NotBroughtBack {
  // The session whose agent it was; empty for a shell.
  string session = 1;
  // The shell's tab; empty for an agent.
  string tab = 2;
  // What went wrong and what to do, as one line.
  string problem = 3;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  // Unset when the call carried no credential.
  Actor actor = 1;
  // For an agent: its channel. Empty for the user.
  ChannelId channel = 2;
  // True when user-only calls on this connection can be confirmed.
  bool presence_possible = 3;
  // SEC-6: for an agent, whether its session runs contained.
  bool contained = 4;
}

message BeginRelayRequest {}

message BeginRelayResponse {
  // 32 random bytes, good for one CompleteRelay on this connection within
  // 30 seconds.
  bytes nonce = 1;
  // UP-1, D281: the socket daemon's build. The link reads it before
  // ProveHost, for Hello; the call is open to anyone already.
  BuildInfo build = 2;
}

message CompleteRelayRequest {
  // The host's nonce from its Hello, as the link received it.
  bytes host_nonce = 1;
  // The host's ProveHost proof, as the link received it.
  bytes proof = 2;
}

message CompleteRelayResponse {}

message RepairRestartRequest {
  oneof target {
    // Resume this session's agent again (ResumeSession's own path).
    SessionId session = 1;
    // Start this shell tab again with the output its old holder saved.
    TabId tab = 2;
    // Check the store. Refused while it is healthy. True only.
    bool store = 3;
  }
}

message RepairRestartResponse {
  // For a session: the operation that brings it back.
  Operation operation = 1;
  // For a damaged store: the daemon is exiting now so that its next start
  // restores the last good copy. Start humatad again (or open the app).
  bool exiting = 2;
}

message StopSessionsRequest {
  // Makes a repeated stop act once; a new one is made when empty.
  string stop_id = 1;
  string reason = 2;
  StopVia via = 3;
  // The machine that asked, when it isn't this one: the host stopping a
  // box. Empty: this machine itself.
  string by_machine = 4;
}
message StopSessionsResponse { SessionsStopped stopped = 1; }
message StartSessionsRequest {}
message StartSessionsResponse {}

message UpgradeRequest {
  // The bundle id (sha256 of bundle.json) of the staged release.
  string to_bundle = 1;
  // Names this upgrade in the machine's upgrade record.
  string upgrade_id = 2;
  // D378: what to upgrade. Unspecified (and DAEMON) is the daemon and its
  // staged release. HOLDERS starts this machine's own restart of the agent
  // sessions on old holders onto the current one, and swaps nothing; asking
  // again while it runs changes nothing.
  MigrateThing thing = 3;
}
message UpgradeResponse {
  // The build the daemon was before it swapped.
  BuildInfo from = 1;
}

message AfterStop {
  SessionsStopped stop = 1;
  StoppedBy started_by = 2;
}
