// Terminals (SE-8..10, SE-16, SE-21..25, PER-1..3, AW-2). Served by the machine that
// holds the session; the host relays the app's streams to remote machines
// over the peer link, one HTTP/2 stream per attached tab.
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/common.proto";

service TerminalService {
  rpc ListTabs(ListTabsRequest) returns (ListTabsResponse);
  // SE-9.
  rpc OpenShellTab(OpenShellTabRequest) returns (Tab);
  // HO-4 "Open a shell" on a remote machine: a tab of no session, in the
  // machine's Humata root. User-only; agents have session_type at most.
  rpc OpenMachineShell(OpenMachineShellRequest) returns (Tab);
  // Ends the tab's shell. The agent's own tab can't be closed (StopSession).
  rpc CloseTab(CloseTabRequest) returns (CloseTabResponse);
  // Attach to one tab. The first client message must be Open. The server
  // sends a Snapshot (or nothing when resuming within what is kept), then
  // Output from the offset on, gapless and without repeats (PER-3, TR-4).
  // Detaching or a dropped stream leaves the process running (PER-4).
  rpc Attach(stream AttachClientMessage) returns (stream AttachServerMessage);
  // Types text into a tab as raw keystrokes, now or when the agent's turn
  // ends. The caller adds the Enter, and wraps the text in a bracketed paste
  // (SM-10) when it must arrive as one paste. Used for comments, notes and
  // session_type.
  rpc Type(TypeRequest) returns (TypeResponse);
  // Withdraws text still waiting for a turn end.
  rpc CancelQueuedTyping(CancelQueuedTypingRequest) returns (CancelQueuedTypingResponse);
  // SE-23: what is queued for a session (comments, notes, queued typing,
  // the IN-12 line), oldest first, and whether each waits on a turn end
  // that is not certain.
  rpc ListQueued(ListQueuedRequest) returns (ListQueuedResponse);
  // SE-23 Send now: types one queued message, or all, now, each whole as
  // one bracketed paste. User-only (TERMINAL_INPUT): an agent types into
  // another session with session_type and when = now.
  rpc SendQueuedNow(SendQueuedNowRequest) returns (SendQueuedNowResponse);
  // An image pasted into a tab: saved on the session's machine, in a folder
  // of the session's own (file 0600), and its path there returned. The
  // client then types the path as Attach input, so the agent reads the
  // file. Text pastes are plain input, never this. The files go when the
  // session does. User-only (TERMINAL_INPUT). No SPEC id yet.
  rpc PasteImage(PasteImageRequest) returns (PasteImageResponse);
}

message Tab {
  TabId id = 1;
  SessionId session = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_AGENT = 1;
    KIND_SHELL = 2;
  }
  Kind kind = 3;
  string title = 4;
  // Current end of output; Attach from here gets only new output.
  uint64 end_offset = 5;
  // Oldest offset still kept (ST-3 scrollback limit).
  uint64 earliest_offset = 6;
  // Set for a machine shell (session unset).
  MachineId machine = 7;
  // What the program in the tab reports about itself (D480): the title it
  // sets (OSC 0/2) and its folder (OSC 7, as a path). Unset until it says.
  // Never the tab's name: `title` stays the user's own.
  optional string program_title = 8;
  optional string pwd = 9;
}

message OpenMachineShellRequest {
  IdempotencyKey idempotency_key = 1;
  MachineId machine = 2;
}

message ListTabsRequest { SessionId session = 1; }
message ListTabsResponse { repeated Tab tabs = 1; }

message OpenShellTabRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // Start in this repo's clone; unset starts in the session folder.
  RepoRef repo = 3;
  // PL-10 "Open terminal here": start in this folder, an absolute path on the
  // session's machine, instead of the session folder or `repo`. It must be
  // inside the session's folder, one of its clones, its channel's folder or
  // the place files from other machines land. It is made canonical first;
  // `..`, a link out of those places, a missing folder and a file are
  // refused. Unset (empty) leaves the start to `repo`.
  string folder = 4;
}

message CloseTabRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  TabId tab = 3;
}

message CloseTabResponse {}

message AttachClientMessage {
  oneof message {
    AttachOpen open = 1;
    TerminalInput input = 2;
    TerminalResize resize = 3;
    // Flow control: the client has drawn output up to this offset.
    OutputAck ack = 4;
  }
}

message AttachOpen {
  // Unset for a machine shell tab.
  SessionId session = 1;
  TabId tab = 2;
  // Resume from here; 0 or older than earliest_offset gets a Snapshot.
  uint64 from_offset = 3;
  // SE-25: watching only. Input is refused and the attach does not count
  // as a writer (other_writers). Without it, an attach with input is
  // user-only (TERMINAL_INPUT); an agent's read-only attach to another
  // session goes through FILES_READ_OTHER_SESSION (D21).
  bool read_only = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // How many unacknowledged output bytes the client can hold. The server
  // stops sending at the limit and, if the client stays behind past the
  // kept scrollback, sends a new Snapshot rather than buffering.
  uint32 window_bytes = 7;
  // The codecs the client decodes, best first (TR-11, D65). Empty: none,
  // and each snapshot comes as one message.
  repeated ChunkCodec accept_codecs = 8;
  // The checkpoint format the client installs (D271). Set: each snapshot
  // is an opaque checkpoint of the daemon's screen for the tab in this
  // format, and TerminalState carries the size viewers draw at. Empty:
  // escape-sequence redraws, for `humata attach`.
  string checkpoint_engine = 9;
}

message TerminalInput {
  bytes data = 1;
  // Client-chosen, increasing; acknowledged once written to the PTY.
  uint64 input_seq = 2;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
  // A cell's size in pixels, which programs can ask for; 0 if unknown.
  uint32 cell_width = 3;
  uint32 cell_height = 4;
}

message OutputAck {
  uint64 offset = 1;
}

message AttachServerMessage {
  oneof message {
    TerminalSnapshot snapshot = 1;
    TerminalOutput output = 2;
    InputAccepted input_accepted = 3;
    TerminalState state = 4;
    // Humata's own lines (reconnected, rebooted, resumed, approved by you),
    // kept apart from the program's bytes so they never reach the PTY.
    TerminalNotice notice = 5;
  }
}

// The VT state at `offset`, encoded as the escape sequences that redraw it
// (screen, scrollback within the limit, modes). Replaying it in an empty
// emulator gives the holder's screen.
message TerminalSnapshot {
  uint64 offset = 1;
  // One piece of the snapshot, encoded with `codec` (TR-11, D65). With
  // accept_codecs set, a snapshot over 1 MiB comes as several messages
  // with the same offset, in order, each a piece of at most 1 MiB decoded;
  // all but the last have `more` set.
  bytes vt = 2;
  uint32 cols = 3;
  uint32 rows = 4;
  ChunkCodec codec = 5;
  // The piece's decoded length; 0 with CHUNK_CODEC_NONE means len(vt).
  uint32 raw_size = 6;
  // CRC-32 of the decoded piece; set whenever codec isn't NONE.
  optional uint32 crc32 = 7;
  bool more = 8;
  // Set when the attach asked for checkpoint_engine: `vt` is then that
  // engine's opaque checkpoint, never bytes to replay.
  string engine = 9;
  // The screen's identity: the tab and its holder's generation. A new one
  // means a new holder, whose offsets start again.
  string terminal_uuid = 10;
}

message TerminalOutput {
  // Offset of the first byte of data, decoded. Offsets, windows and acks
  // all count decoded bytes.
  uint64 offset = 1;
  // Encoded with `codec`, as TerminalSnapshot.vt is.
  bytes data = 2;
  ChunkCodec codec = 3;
  uint32 raw_size = 4;
  optional uint32 crc32 = 5;
}

message InputAccepted {
  uint64 input_seq = 1;
}

message TerminalState {
  enum Writable {
    WRITABLE_UNSPECIFIED = 0;
    WRITABLE_YES = 1;
    WRITABLE_MACHINE_OFFLINE = 2;   // SE-16
    WRITABLE_MOVING = 3;            // MV-4
    WRITABLE_EXITED = 4;            // SE-14
    WRITABLE_READ_ONLY_ATTACH = 5;
  }
  Writable writable = 1;
  SessionStatus status = 2;
  int32 exit_code = 3;
  // SE-24: other clients attached with input (the app, a `humata attach`);
  // read-only attaches are not counted (SE-25).
  uint32 other_writers = 4;
  // With checkpoint_engine: the size the daemon's screen has now, sent in
  // order with the output whenever it changes (D271).
  uint32 cols = 5;
  uint32 rows = 6;
  uint32 cell_width = 7;
  uint32 cell_height = 8;
}

message TerminalNotice {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_DISCONNECTED = 1;
    KIND_RECONNECTED = 2;      // with caught_up_lines
    KIND_REBOOTED = 3;         // PER-17
    KIND_RESUMED = 4;
    KIND_EXITED = 5;
    KIND_REQUEST_ANSWERED = 6; // IN-12, IN-13
    KIND_FORKED_FROM = 7;      // FK-10
    // From a machine, once an attach from an offset has replayed what it
    // missed, with caught_up_lines counting those lines. The host folds it
    // into the KIND_RECONNECTED it shows (SE-16, D345).
    KIND_CAUGHT_UP = 8;
  }
  Kind kind = 1;
  string text = 2;
  uint64 at_offset = 3;
  uint32 caught_up_lines = 4;
  google.protobuf.Timestamp at = 5;
}

message TypeRequest {
  enum When {
    WHEN_UNSPECIFIED = 0;
    WHEN_NOW = 1;
    // SM-10, SE-23. With hooks it is typed at the turn end on its own.
    // With the output fallback, or in a plain shell, it is queued as
    // "waiting: turn end not certain" until Send now, and never fails.
    WHEN_TURN_ENDS = 2;
  }
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // Unset: the agent's tab.
  TabId tab = 3;
  string text = 4;
  When when = 5;
}

message TypeResponse {
  // Set while queued (When = TURN_ENDS and the agent is mid-turn).
  QueuedTypingId queued = 1;
  bool typed = 2;
  // SE-23: queued, and waits for Send now rather than a turn end.
  bool turn_end_uncertain = 3;
  // True only when the daemon wrote the return that submits the text (the
  // text ended in a newline, D671). False when there was no trailing
  // newline, so the text is only in the input, and while queued.
  bool submitted = 4;
  // True when the text was written while the agent was mid-turn: the agent
  // itself decides whether to queue it, and Humata can't tell.
  bool agent_busy = 5;
}

message QueuedMessage {
  QueuedTypingId id = 1;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_COMMENTS = 1;
    KIND_NOTE = 2;
    KIND_TYPING = 3;
    KIND_APPROVAL_LINE = 4;   // IN-12
  }
  Kind kind = 2;
  string preview = 3;
  google.protobuf.Timestamp queued_at = 4;
  bool turn_end_uncertain = 5;
}

message ListQueuedRequest { SessionId session = 1; }

message ListQueuedResponse { repeated QueuedMessage messages = 1; }

message SendQueuedNowRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // Empty: all of them, in order.
  repeated QueuedTypingId ids = 3;
}

message SendQueuedNowResponse {
  repeated QueuedTypingId typed = 1;
}

message CancelQueuedTypingRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  QueuedTypingId queued = 3;
}

message CancelQueuedTypingResponse {
  // False: it had already been typed.
  bool cancelled = 1;
}

enum ImageFormat {
  IMAGE_FORMAT_UNSPECIFIED = 0;
  IMAGE_FORMAT_PNG = 1;
  IMAGE_FORMAT_JPEG = 2;
  IMAGE_FORMAT_GIF = 3;
  IMAGE_FORMAT_WEBP = 4;
  IMAGE_FORMAT_TIFF = 5;
  IMAGE_FORMAT_HEIC = 6;
}

message PasteImageRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // The image as pasted, at most 32 MiB. Its first bytes must match
  // `format`; a mismatch is invalid_field "data", BAD_FORMAT.
  bytes data = 3;
  // Unset or unknown is invalid_field "format", UNKNOWN_VALUE.
  ImageFormat format = 4;
}

message PasteImageResponse {
  // Absolute, on the session's machine: what to type into the tab.
  string path = 1;
  uint64 size_bytes = 2;
}
