// Terminals (SE-8..10, SE-16, PER-1..3, AW-2). Served by the machine that
// holds the session; the host relays the app's streams to remote machines
// over the peer link, one HTTP/2 stream per attached tab.
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/common.proto";

service TerminalService {
  rpc ListTabs(ListTabsRequest) returns (ListTabsResponse);
  // SE-9.
  rpc OpenShellTab(OpenShellTabRequest) returns (Tab);
  // HO-4 "Open a shell" on a remote machine: a tab of no session, in the
  // machine's Humata root. User-only; agents have session_type at most.
  rpc OpenMachineShell(OpenMachineShellRequest) returns (Tab);
  // Ends the tab's shell. The agent's own tab can't be closed (StopSession).
  rpc CloseTab(CloseTabRequest) returns (CloseTabResponse);
  // Attach to one tab. The first client message must be Open. The server
  // sends a Snapshot (or nothing when resuming within what is kept), then
  // Output from the offset on, gapless and without repeats (PER-3, TR-4).
  // Detaching or a dropped stream leaves the process running (PER-4).
  rpc Attach(stream AttachClientMessage) returns (stream AttachServerMessage);
  // Types text into a tab as one bracketed paste (SM-10), now or when the
  // agent's turn ends. Used for comments, notes and session_type.
  rpc Type(TypeRequest) returns (TypeResponse);
  // Withdraws text still waiting for a turn end.
  rpc CancelQueuedTyping(CancelQueuedTypingRequest) returns (CancelQueuedTypingResponse);
}

message Tab {
  TabId id = 1;
  SessionId session = 2;
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_AGENT = 1;
    KIND_SHELL = 2;
  }
  Kind kind = 3;
  string title = 4;
  // Current end of output; Attach from here gets only new output.
  uint64 end_offset = 5;
  // Oldest offset still kept (ST-3 scrollback limit).
  uint64 earliest_offset = 6;
  // Set for a machine shell (session unset).
  MachineId machine = 7;
}

message OpenMachineShellRequest {
  IdempotencyKey idempotency_key = 1;
  MachineId machine = 2;
}

message ListTabsRequest { SessionId session = 1; }
message ListTabsResponse { repeated Tab tabs = 1; }

message OpenShellTabRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // Start in this repo's clone; unset starts in the session folder.
  RepoRef repo = 3;
}

message CloseTabRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  TabId tab = 3;
}

message CloseTabResponse {}

message AttachClientMessage {
  oneof message {
    AttachOpen open = 1;
    TerminalInput input = 2;
    TerminalResize resize = 3;
    // Flow control: the client has drawn output up to this offset.
    OutputAck ack = 4;
  }
}

message AttachOpen {
  // Unset for a machine shell tab.
  SessionId session = 1;
  TabId tab = 2;
  // Resume from here; 0 or older than earliest_offset gets a Snapshot.
  uint64 from_offset = 3;
  // Watching only: input is refused.
  bool read_only = 4;
  uint32 cols = 5;
  uint32 rows = 6;
  // How many unacknowledged output bytes the client can hold. The server
  // stops sending at the limit and, if the client stays behind past the
  // kept scrollback, sends a new Snapshot rather than buffering.
  uint32 window_bytes = 7;
}

message TerminalInput {
  bytes data = 1;
  // Client-chosen, increasing; acknowledged once written to the PTY.
  uint64 input_seq = 2;
}

message TerminalResize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message OutputAck {
  uint64 offset = 1;
}

message AttachServerMessage {
  oneof message {
    TerminalSnapshot snapshot = 1;
    TerminalOutput output = 2;
    InputAccepted input_accepted = 3;
    TerminalState state = 4;
    // Humata's own lines (reconnected, rebooted, resumed, approved by you),
    // kept apart from the program's bytes so they never reach the PTY.
    TerminalNotice notice = 5;
  }
}

// The VT state at `offset`, encoded as the escape sequences that redraw it
// (screen, scrollback within the limit, modes). Replaying it in an empty
// emulator gives the holder's screen.
message TerminalSnapshot {
  uint64 offset = 1;
  bytes vt = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

message TerminalOutput {
  // Offset of the first byte of data.
  uint64 offset = 1;
  bytes data = 2;
}

message InputAccepted {
  uint64 input_seq = 1;
}

message TerminalState {
  enum Writable {
    WRITABLE_UNSPECIFIED = 0;
    WRITABLE_YES = 1;
    WRITABLE_MACHINE_OFFLINE = 2;   // SE-16
    WRITABLE_MOVING = 3;            // MV-4
    WRITABLE_EXITED = 4;            // SE-14
    WRITABLE_READ_ONLY_ATTACH = 5;
  }
  Writable writable = 1;
  SessionStatus status = 2;
  int32 exit_code = 3;
  // Other clients attached with input (the app, a `humata attach`).
  uint32 other_writers = 4;
}

message TerminalNotice {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_DISCONNECTED = 1;
    KIND_RECONNECTED = 2;      // with caught_up_lines
    KIND_REBOOTED = 3;         // PER-17
    KIND_RESUMED = 4;
    KIND_EXITED = 5;
    KIND_REQUEST_ANSWERED = 6; // IN-12, IN-13
    KIND_FORKED_FROM = 7;      // FK-10
  }
  Kind kind = 1;
  string text = 2;
  uint64 at_offset = 3;
  uint32 caught_up_lines = 4;
  google.protobuf.Timestamp at = 5;
}

message TypeRequest {
  enum When {
    WHEN_UNSPECIFIED = 0;
    WHEN_NOW = 1;
    // SM-10. Fails with Error.agent_lacks_feature(TURN_SIGNAL) when the
    // agent's adapter can't tell; the caller then picks NOW.
    WHEN_TURN_ENDS = 2;
  }
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  // Unset: the agent's tab.
  TabId tab = 3;
  string text = 4;
  When when = 5;
}

message TypeResponse {
  // Set while queued (When = TURN_ENDS and the agent is mid-turn).
  QueuedTypingId queued = 1;
  bool typed = 2;
}

message CancelQueuedTypingRequest {
  IdempotencyKey idempotency_key = 1;
  SessionId session = 2;
  QueuedTypingId queued = 3;
}

message CancelQueuedTypingResponse {
  // False: it had already been typed.
  bool cancelled = 1;
}
