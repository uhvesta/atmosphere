// Searching and reading the conversations the host keeps (LD-8, LD-23–LD-25,
// D62, D63). Host only: the host holds every session's mirror and the
// full-text index over it, so one call covers every machine, archived
// sessions included, while a machine is offline. Everything returned has
// been scrubbed of host variable values first (LD-21).
syntax = "proto3";

package humata.v1;

import "google/protobuf/timestamp.proto";
import "humata/v1/common.proto";

service HistoryService {
  // LD-23, LD-24: `humata sessions search`, the palette and the MCP tool
  // `sessions_search` give the same results. An agent searches its own
  // channel; other channels need "Search other channels" (Ask).
  rpc SearchSessions(SearchSessionsRequest) returns (SearchSessionsResponse);
  // LD-25: a session's turns, paged (`session_read`).
  rpc ReadTurns(ReadTurnsRequest) returns (ReadTurnsResponse);
  // LD-8, LD-21, D189: on a machine, the next part of a session's
  // conversation for the host's mirror, from `offset`, scrubbed. Only the
  // host asks, over the peer link's relay, on a connection it proved as its
  // own (D144); every other caller gets permission_denied.
  rpc ReadMirror(ReadMirrorRequest) returns (ReadMirrorResponse);
}

message SearchSessionsRequest {
  // Every word must match; the last also as a prefix. Not empty.
  string query = 1;
  // Unset: every channel the caller may search.
  ChannelId channel = 2;
  MachineId machine = 3;
  // The agent kind, such as "claude". Empty: any.
  string agent = 4;
  google.protobuf.Timestamp since = 5;
  google.protobuf.Timestamp until = 6;
  PageRequest page = 7;
}

// LD-24: a hit names the channel, session, machine, agent and turn.
message SearchHit {
  SessionId session = 1;
  string session_title = 2;
  ChannelId channel = 3;
  string channel_name = 4;
  MachineId machine = 5;
  string machine_name = 6;
  string agent = 7;
  // 1 is the first prompt; 0 is what came before it.
  uint32 turn = 8;
  // The matching entry's place in the session's mirror (`session#seq`).
  uint64 seq = 9;
  // Plain text around the match.
  string snippet = 10;
  google.protobuf.Timestamp at = 11;
  // When the host last heard from this session's machine about it: for a
  // machine that is offline, results are "as of its last sync".
  google.protobuf.Timestamp as_of = 12;
}

message SearchSessionsResponse {
  repeated SearchHit hits = 1;
  PageResponse page = 2;
}

message ReadTurnsRequest {
  SessionId session = 1;
  // Unset: from the first turn / to the last.
  optional uint32 first_turn = 2;
  optional uint32 last_turn = 3;
  PageRequest page = 4;
}

message MirrorEntry {
  enum Role {
    ROLE_UNSPECIFIED = 0;
    ROLE_USER = 1;
    ROLE_AGENT = 2;
    ROLE_TOOL = 3;
  }
  uint64 seq = 1;
  uint32 turn = 2;
  Role role = 3;
  string text = 4;
  google.protobuf.Timestamp at = 5;
}

message ReadTurnsResponse {
  repeated MirrorEntry entries = 1;
  PageResponse page = 2;
}

message ReadMirrorRequest {
  SessionId session = 1;
  // Bytes of the machine's conversation file the host's mirror already has.
  uint64 offset = 2;
  // At most this many bytes are read; 0, or more than 1 MiB, means 1 MiB.
  // The machine always takes at least the first complete line.
  uint32 max_bytes = 3;
  // What the machine said its file was at the last answer; empty at first
  // (which matches only offset 0). Compared, never read as a path.
  string source = 4;
  // The codecs the host decodes, best first. Empty: raw bytes only.
  repeated ChunkCodec accept_codecs = 5;
}

message ReadMirrorResponse {
  // The complete lines of the file from `offset`, each scrubbed (LD-21) and
  // written as one compact JSON line, encoded with `codec`. At most 1 MiB
  // before encoding (TR-11). A last line with no newline is left for later.
  bytes data = 1;
  // Where the next read starts: just past the last line read, in the
  // machine's own file bytes. Past `offset` whenever `more` is set.
  uint64 next_offset = 2;
  // Another complete line follows `next_offset`: ask again at once.
  bool more = 3;
  // The file is not the one `source` named, or is shorter than `offset`
  // (truncated, replaced or rewritten): `data` is from byte 0 of the file
  // as it is now, and the host appends it after what it has.
  bool rewritten = 4;
  // The file's identity: the machine, the device, the inode and the birth
  // time when the file system gives one. Echo it in the next request.
  string source = 5;
  // Names whose values were replaced in `data`; never the values.
  repeated string scrubbed_names = 6;
  // As FileChunk: only a codec the host listed; a chunk that doesn't shrink
  // is sent as NONE.
  ChunkCodec codec = 7;
  // The decoded length; 0 with NONE means len(data).
  uint32 raw_size = 8;
  // CRC-32 (IEEE) of the decoded bytes. Always set on a compressed chunk.
  optional uint32 crc32 = 9;
}
