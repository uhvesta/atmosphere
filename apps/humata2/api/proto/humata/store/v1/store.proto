// What humatad2's store keeps on disk whole rather than in columns (D44).
// Never sent on the wire: the API's messages are in humata/v1. Paths and
// arguments are bytes, as the machine's file system and exec take them.
syntax = "proto3";

package humata.store.v1;

// How an agent was started, so it can be started again in the same
// conversation after a crash or reboot (PER-11, PER-12). Variable values
// are never kept: tokens are minted again on resume.
message AgentLaunch {
  string agent = 1;
  bytes folder = 2;
  repeated bytes argv = 3;
  repeated bytes resume_argv = 4;
  repeated string variable_names = 5;
  string conversation_id = 6;
  bytes conversation_file = 7;
  bytes holder_socket = 8;
  uint32 cols = 9;
  uint32 rows = 10;
  // The agent CLI's version at launch (CV-3); empty when none was recorded.
  string cli_version = 11;
}

// A session's review, so a restart keeps its review chat (PR-26). `chat`
// is a humata.v1.ReviewContext (the view, the notes with their authors,
// the switches) and `shown` a humata.v1.GetDiffResponse per repository
// as the last diff showed it, both as the daemon encodes them.
message ReviewState {
  bytes chat = 1;
  repeated bytes shown = 2;
  uint64 last_seq = 3;
  bool view_reported = 4;
  uint64 last_note = 5;
  // A ReviewHistory, as the daemon encodes it.
  bytes history = 6;
}

// A view a session's agent prepared (VW-1, VW-14; D87). `view` is a
// humata.v1.PreparedView as the daemon encodes it; `keys` are the
// idempotency keys of the calls that made or changed it, newest last.
message View {
  bytes view = 1;
  repeated string keys = 2;
}

// A request a session's agent made in the Inbox (D96). `request` is a
// humata.v1.InboxRequest as it stands; `keys` are the "session/key"
// idempotency keys of the calls that made it; `asked` is the
// humata.v1.GrantTarget an ask-ahead named, from which a restart works out
// again what the policy asks and grants. Empty for a question.
message InboxEntry {
  bytes request = 1;
  repeated string keys = 2;
  bytes asked = 3;
  InboxGrant grant = 4;
  // True for a request made by Inbox::defer: an ordinary call held for
  // the person's answer.
  bool deferred = 5;
  // True for an agent hook's permission card (D191). One a machine saved
  // while pending is withdrawn at the next start: the restart ended the
  // hook that held it (D744).
  bool permission = 6;
}

// The grant an answer made, with what the policy keeps beside it.
message InboxGrant {
  // A humata.v1.Grant.
  bytes grant = 1;
  GrantedBy granted_by = 2;
  string granted_on = 3;
  bool on_host = 4;
  // When the user revoked it; 0 while it stands.
  int64 revoked_unix_ms = 5;
}

// How the user who made a grant showed they were there.
enum GrantedBy {
  GRANTED_BY_UNSPECIFIED = 0;
  GRANTED_BY_CONFIRM_IN_APP = 1;
  GRANTED_BY_CLI_LOGIN = 2;
  GRANTED_BY_APPROVAL_PASSPHRASE = 3;
}

// What a review keeps so a restart doesn't change what a call does
// (D86): the changes Undo can still take back, and the answers to calls
// that carried an idempotency key, oldest first.
message ReviewHistory {
  repeated ReviewUndo undo = 1;
  repeated ReviewAnswer answers = 2;
}

// One change of the review chat and what it replaced. A view is a
// humata.v1.ReviewViewState holding only what the change replaced (the
// open place and highlights, or the order and groups), a note a
// humata.v1.Comment.
message ReviewUndo {
  string undo_id = 1;
  uint64 seq = 2;
  bool undone = 3;
  oneof before {
    bytes focus = 4;
    string added_note = 5;
    bytes note = 6;
    bytes order = 7;
  }
  // For `order`: the notes the plan added, which Undo takes away.
  repeated string added_notes = 8;
}

// The answer a call with idempotency key `key` got, as the humata.v1
// message it returned.
message ReviewAnswer {
  string key = 1;
  oneof answer {
    bytes comment = 2;
    bytes dropped = 3;
    bytes prepared = 4;
    bytes focused = 5;
    bytes marked = 6;
  }
}
