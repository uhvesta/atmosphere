// What humatad2's store keeps on disk whole rather than in columns (D44).
// Never sent on the wire: the API's messages are in humata/v1. Paths and
// arguments are bytes, as the machine's file system and exec take them.
syntax = "proto3";

package humata.store.v1;

// How an agent was started, so it can be started again in the same
// conversation after a crash or reboot (PER-11, PER-12). Variable values
// are never kept: tokens are minted again on resume.
message AgentLaunch {
  string agent = 1;
  bytes folder = 2;
  repeated bytes argv = 3;
  repeated bytes resume_argv = 4;
  repeated string variable_names = 5;
  string conversation_id = 6;
  bytes conversation_file = 7;
  bytes holder_socket = 8;
  uint32 cols = 9;
  uint32 rows = 10;
}

// A session's review, so a restart keeps its review chat (PR-26). `chat`
// is a humata.v1.ReviewContext (the view, the notes with their authors,
// the switches) and `shown` a humata.v1.GetDiffResponse per repository
// as the last diff showed it, both as the daemon encodes them.
message ReviewState {
  bytes chat = 1;
  repeated bytes shown = 2;
  uint64 last_seq = 3;
  bool view_reported = 4;
  uint64 last_note = 5;
}
