<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Humata 2 — UX prototype (dummy data)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#1a1d21; --side:#121417; --rail:#0b0c0e; --panel:#202328; --panel2:#262a30; --line:#33373e;
  --text:#e6e7e9; --dim:#9aa0a8; --faint:#6b7179; --accent:#5b9dff; --accent2:#3d7be0;
  --green:#3fb950; --orange:#e3a13b; --red:#f05d5d; --purple:#b58cff; --yellow:#e5d066;
  --term:#0d0f12; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:#4a505a;background:#2d3239}
button.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.primary:hover{background:var(--accent)}
button.danger{border-color:#6b2c2c;color:#ffb3b3}
button.ghost{background:none;border-color:transparent;color:var(--dim)}
button.ghost:hover{color:var(--text);background:var(--panel2)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--text);background:var(--side);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical;min-height:60px}
label{display:block;color:var(--dim);font-size:12px;margin:10px 0 4px}
code,.mono{font-family:var(--mono);font-size:12px}
a{color:var(--accent);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
.banner{height:26px;background:repeating-linear-gradient(135deg,#5a3f00,#5a3f00 12px,#4a3400 12px,#4a3400 24px);color:#ffd98a;display:flex;align-items:center;gap:14px;padding:0 12px;font-size:12px;font-weight:600;letter-spacing:.3px}
.banner .sp{flex:1}
.banner button{padding:1px 8px;font-size:11px;background:#2a1f00;border-color:#7a5a10;color:#ffd98a}
#app{display:flex;height:calc(100% - 26px)}
.rail{width:62px;background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;border-right:1px solid #000}
.rail .ri{width:44px;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--dim);cursor:pointer;position:relative;font-size:17px}
.rail .ri small{font-size:9px;margin-top:1px}
.rail .ri:hover{background:#1c1f24;color:var(--text)}
.rail .ri.on{background:#24303f;color:#fff}
.rail .logo{font-weight:800;color:#fff;background:linear-gradient(135deg,#5b9dff,#b58cff);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.badge{position:absolute;top:2px;right:2px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;font-weight:700;line-height:16px}
.side{flex:none;width:268px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side .hdr{padding:12px 14px 8px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:space-between}
.side .scroll{overflow:auto;flex:1;padding-bottom:20px}
.sec{color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.6px;padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:center}
.sec button{padding:0 6px;font-size:13px;line-height:18px}
.vip{color:#f5c542;background:rgba(229,72,77,.18);border:1px solid rgba(229,72,77,.6);border-radius:4px;font-size:10px;font-weight:700;padding:0 4px;margin-right:5px;flex:none}
.pinev{font-size:11px;color:var(--faint);padding:0 14px 4px 30px;margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinev.hot{color:#f5c542}
.kept td{padding:3px 8px 3px 0;font-size:12px;vertical-align:top}
.row{display:flex;align-items:center;gap:7px;padding:3px 14px;cursor:pointer;color:var(--dim);white-space:nowrap;overflow:hidden}
.row:hover{background:#1b1e23;color:var(--text)}
.row.on{background:#22354f;color:#fff}
.row .t{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .n{font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:0 5px}
.row.ch{font-weight:600;color:#c9ccd1}
.tw{width:12px;color:var(--faint);font-size:10px;text-align:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.st-working{background:var(--green);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 1.6s infinite}
.st-needs{background:var(--orange)}
.st-idle{background:#6b7179}
.st-exited{border:1.5px solid #8a9099;background:none}
.st-offline{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(63,185,80,.55)}70%{box-shadow:0 0 0 6px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px;flex:none}
.top h1{font-size:16px;margin:0;white-space:nowrap}
.top .meta{color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;flex:none}
.tab{padding:8px 12px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent}
.tab:hover{color:var(--text)}
.tab.on{color:#fff;border-bottom-color:var(--accent)}
.body{flex:1;overflow:auto;padding:16px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:11px;color:var(--dim);white-space:nowrap}
.chip.repo::before{content:"⎇";color:var(--faint)}
.chip.me{color:#9fd0ff;border-color:#2c4a6b}
.chip.agent{color:#d6c1ff;border-color:#4b3a6e}
.chip.host{color:#a6e3b0;border-color:#2e5236}
.chip.warn{color:#ffd28a;border-color:#6b5022}
.chip.bad{color:#ffb3b3;border-color:#6b2c2c}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px}
.muted{color:var(--dim)}
.faint{color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.feed .ev{display:flex;gap:10px;padding:8px 6px;border-radius:6px}
.feed .ev:hover{background:#1f2226}
.av{width:32px;height:32px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.av.claude{background:#4a2d1d;color:#ffb68a}.av.codex{background:#1d3a2d;color:#8ae0b0}.av.copilot{background:#26304a;color:#9fb8ff}.av.opencode{background:#3a3a1d;color:#e8e08a}.av.shell{background:#2b2b2b;color:#ccc}.av.me{background:#1d3550;color:#9fd0ff}.av.sys{background:#2a2a30;color:#aaa}
.ev .who{font-weight:700}
.ev .when{color:var(--faint);font-size:11px;margin-left:6px}
.ev .quote{border-left:3px solid var(--line);padding:2px 8px;margin-top:4px;color:#c7cad0}
/* session */
.split{flex:1;display:flex;min-height:0}
.termwrap{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--term)}
.termbar{height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#15181c;border-bottom:1px solid #000;font-size:11px;color:var(--dim);flex:none}
.termtab{padding:3px 10px;border-radius:5px;cursor:pointer}
.termtab.on{background:#232830;color:#fff}
.term{flex:1;overflow:auto;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.5;white-space:pre-wrap;outline:none;color:#d7dae0}
.term:focus{box-shadow:inset 0 0 0 1px #2c4a6b}
.term .g{color:#7ee787}.term .r{color:#ff7b72}.term .b{color:#79c0ff}.term .y{color:#e3b341}.term .m{color:#d2a8ff}.term .d{color:#6e7681}.term .w{color:#fff;font-weight:600}.term .o{color:#ffa657}
.cursor{display:inline-block;width:7px;height:14px;background:#c9d1d9;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.review{width:48%;min-width:260px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--bg)}
.review.full{width:100%;border-left:none}
.rbody{flex:1;overflow:auto;padding:12px}
.diff{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.diff .fh{background:var(--panel2);padding:6px 10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.diff table{border-collapse:collapse;width:100%}
.diff td{padding:0 8px;white-space:pre;vertical-align:top}
body.wrap .diff td.c, body.wrap .ed-t td.c, body.wrap .fx-ln .tx{white-space:pre-wrap;overflow-wrap:anywhere}
body.wrap .fx-ln .tx{min-width:0}
.rz{width:6px;margin:0 -3px;flex:none;cursor:col-resize;position:relative;z-index:5}
.rz:hover, body.resizing .rz{background:rgba(91,157,255,.4)}
body.resizing{cursor:col-resize;user-select:none}
.pcol{width:26px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:10px;cursor:pointer;color:var(--dim)}
.pcol.r{border-right:none;border-left:1px solid var(--line)}
.pcol:hover{color:var(--text);background:var(--panel2)}
.pcol-t{writing-mode:vertical-rl;font-size:11px;letter-spacing:.06em}
.cbtn{padding:0 6px !important;font-size:13px}
.rg-h{display:flex;gap:8px;align-items:center;padding:6px 8px;margin:6px 0 8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:12.5px}
.rg-h:hover{background:var(--panel2)}
.mgrid td,.mgrid th{vertical-align:top;padding:8px 10px}
.fm{display:flex;gap:10px;height:calc(100vh - 360px);min-height:300px}
.fm-pane{flex:1;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.fm-pane.act{border-color:#2c4a6b}
.fm-pane.over{outline:2px dashed var(--accent);outline-offset:-3px}
.fm-top{display:flex;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.fm-top select{width:auto}
.fm-crumbs{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.fm-tools{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fm-tools button{padding:2px 8px;font-size:12px}
.fm-list{flex:1;overflow:auto;font-size:13px}
.fm-row{display:grid;grid-template-columns:18px 1fr 80px 64px;gap:6px;align-items:center;padding:3px 10px;user-select:none;cursor:default}
.fm-row:hover{background:var(--panel2)} .fm-row.on{background:#24303f;color:#fff}
.fm-foot{padding:4px 10px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint)}
.tr{display:grid;grid-template-columns:190px 1fr 70px 220px 150px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
.bar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden} .bar i{display:block;height:100%;background:var(--accent)} .bar.paused i{background:var(--orange)} .bar.done i{background:var(--green)}
.steps div{padding:3px 0}
.prov{font-size:10px;font-weight:700;letter-spacing:.4px;padding:0 6px;border-radius:4px;background:#22304a;color:#9fc3ff}
.cst{font-size:10px;font-weight:700;padding:0 6px;border-radius:4px;letter-spacing:.3px}.cst.draft{background:#3a2f17;color:#ffd58a}.cst.sent{background:#1d3550;color:#9fc3ff}.cst.addressed{background:#173a26;color:#8fdc9a}.cst.resolved{background:#2b2b2b;color:#aaa}
.cq{border-left:3px solid var(--line);padding:1px 8px;margin:4px 0;color:var(--dim);font:11.5px/1.45 ui-monospace,monospace;white-space:pre-wrap}
.cmtc{border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin:4px 0;background:var(--panel2,#151820);font-size:12.5px}
.md{font-size:13.5px;line-height:1.55} .md h1{font-size:20px;margin:6px 0} .md h2{font-size:16px;margin:14px 0 4px} .md h3{font-size:14px;margin:10px 0 2px} .md p{margin:6px 0}
.md-code{background:#0b0d11;border:1px solid var(--line);border-radius:6px;padding:8px;font:11.5px/1.45 ui-monospace,monospace;white-space:pre;overflow:auto}
.md table{border-collapse:collapse;margin:6px 0} .md td,.md th{border:1px solid var(--line);padding:3px 8px;font-size:12.5px}
.md code{background:#22262f;padding:0 4px;border-radius:3px;font-size:12px} .md li{margin:2px 0}
.mdrow{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px} .mdrow>.mg{border-left:1px dashed var(--line);padding-left:8px}
.chg{background:rgba(229,181,103,.08);box-shadow:inset 3px 0 0 #e5b567;padding-left:8px}
#selbtn{position:fixed;z-index:60;padding:3px 10px;font-size:12px}
.amlog{background:#0b0d11;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:11.5px/1.5 var(--mono,ui-monospace,monospace);max-height:170px;overflow:auto;white-space:pre-wrap;margin-top:8px}
.amlog .p{color:#8ab4ff} .amlog .e{color:#ff9a9a} .amlog .g{color:#8fdc9a}
.diff td.ln{width:38px;color:var(--faint);text-align:right;cursor:pointer;user-select:none}
.diff td.ln:hover{color:var(--accent);background:#1c2a3d}
.diff tr.add{background:#12261a}
.diff tr.del{background:#2a1515}
.diff tr.hunk td{background:#18202b;color:#7d8fa8;padding:2px 8px}
.cmt{background:#1e2530;border:1px solid #2c4a6b;border-radius:6px;margin:4px 8px 6px 46px;padding:6px 8px;font-family:-apple-system,sans-serif;font-size:12px;white-space:normal}
.cmt .by{color:#9fd0ff;font-weight:600;font-size:11px}
.cmt.sent{opacity:.6}
/* board */
.board{display:flex;gap:12px;align-items:flex-start;overflow:auto;padding-bottom:10px}
.col{width:250px;flex:none;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:8px}
.col h4{margin:2px 4px 8px;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between}
.item{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;margin-bottom:8px;cursor:pointer}
.item:hover{border-color:#4a505a}
.item .k{color:var(--faint);font-family:var(--mono);font-size:11px}
.item .ttl{margin:3px 0 6px}
.item .meta{display:flex;gap:4px;flex-wrap:wrap}
.item.drag{opacity:.4}
.col.over{border-color:var(--accent)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding-top:6vh;z-index:50}
.modal{width:640px;max-height:86vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{margin:0 0 4px;font-size:17px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.opt{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:var(--side)}
.opt:hover{border-color:#4a505a}
.opt.on{border-color:var(--accent);background:#17243a}
.opt b{display:block;margin-bottom:3px}
.drawer{position:fixed;top:26px;right:0;bottom:0;width:440px;background:var(--panel);border-left:1px solid var(--line);z-index:40;padding:16px;overflow:auto;box-shadow:-10px 0 40px rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#26303d;border:1px solid #3b4c63;border-radius:8px;padding:10px 14px;z-index:70;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.overlay{position:fixed;inset:26px 0 0 0;background:rgba(10,12,14,.92);z-index:80;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:15px}
.spin{width:26px;height:26px;border:3px solid #333;border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.req{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--panel)}
.req.done{opacity:.55}
.req .why{font-size:12px;color:#ffd28a;margin-top:4px}
.req pre{background:var(--side);border-radius:6px;padding:6px 8px;margin:6px 0 0;font-size:11.5px;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--dim)}
.tree{font-family:var(--mono);font-size:12px;line-height:1.7}
.tree .node{cursor:pointer;padding:0 4px;border-radius:4px}
.tree .node:hover{background:var(--panel2)}
.tree .node.on{background:#22354f}
.ascii{font-family:var(--mono);font-size:12px;line-height:1.35;background:var(--side);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre;overflow:auto;color:#cfd3d9}
table.list{width:100%;border-collapse:collapse}
table.list td,table.list th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:12.5px}
table.list th{color:var(--faint);font-weight:500;font-size:11px;text-transform:uppercase}
/* feedback */
.fbbtn{position:fixed;right:18px;bottom:18px;z-index:60;background:#7a3fd1;border:none;color:#fff;border-radius:22px;padding:9px 16px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.fbbtn:hover{background:#8d52e6}
.fbpanel{position:fixed;right:18px;bottom:64px;width:400px;max-height:72vh;overflow:auto;z-index:60;background:var(--panel);border:1px solid #5a3a8a;border-radius:10px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.fbitem{border-top:1px solid var(--line);padding:7px 0;font-size:12px}
.fbitem .where{color:#c8a8ff;font-family:var(--mono);font-size:11px}
body.pinning *{cursor:crosshair !important}
body.pinning [data-fb]:hover{outline:2px dashed #b58cff;outline-offset:2px}
.pinmark{position:fixed;z-index:65;background:#7a3fd1;color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.case{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.case .num{color:var(--faint);width:22px;flex:none;font-family:var(--mono)}
.case .tx{flex:1}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--dim);text-align:center}
.empty .big{font-size:42px}
.pill{display:inline-block;padding:0 6px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.4px}
.pill.ask{background:#4a3a12;color:#ffd28a}.pill.ok{background:#173a22;color:#8ae0a6}.pill.no{background:#3a1717;color:#ffb3b3}
.hl{animation:hl 1.5s}
@keyframes hl{0%{background:#3b3412}100%{background:transparent}}

/* ── declutter (keeps the original look) ── */
.navbtns{display:flex;gap:2px}
.offer{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:rgba(181,140,255,.10);font-size:13px}.offer .ic{color:var(--purple);font-size:16px}
.vbar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--line);background:rgba(181,140,255,.18);font-size:12.5px;color:#e4d9ff}
.tk-kw{color:#ff7b72}.tk-str{color:#a5d6ff}.tk-num{color:#79c0ff}.tk-cm{color:#8b949e;font-style:italic}.tk-ty{color:#ffa657}.tk-fn{color:#d2a8ff}
.termtab .x{margin-left:6px;color:var(--faint)} .termtab .x:hover{color:#fff}
.termtab.vt{color:#c9b6ff} .newdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--purple);margin-left:4px;vertical-align:middle}
.editor{flex:1;display:flex;min-height:0;background:var(--bg)}
.ed-side{width:250px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:8px 0;background:var(--side)}
.ed-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:4px 10px 6px}

Billing v2 moves invoices off the nightly batch and onto **events**, so a customer sees a charge within a minute.

- [x] One ledger for cards and bank transfers
- [ ] Refunds without a support ticket

## Flow

\`\`\`
 usage ──▶ meter ──▶ invoice ──▶ ledger
              │                   ▲
              └──── refunds ──────┘
\`\`\`

| Plan | Price | Included |
| --- | --- | --- |
| Starter | $0 | 1k events |
| Team | $49 | 100k events |
| Scale | $399 | 5M events |

## Refunds

A refund posts a negative line to the ledger in the same transaction as the event that asked for it.
Refunds over **$500** need a second person to approve.

\`\`\`

// One list of requests, used by the global, channel and session inboxes.
function inboxList(sids, opts={}){
  const set = sids ? new Set(sids) : null;
  const reqs = D.inbox.filter(r=>(!set||set.has(r.sid)) && (UI.inboxDone || r.state==='pending'));
  const waiting = reqs.filter(r=>r.state==='pending').map(r=>r.id);
  const by = {}; reqs.forEach(r=>{(by[r.sid]=by[r.sid]||[]).push(r)});
  let h = `<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">${opts.lead||''}<span class="sp" style="flex:1"></span>
    <label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--dim);font-size:12.5px"><input type="checkbox" style="width:auto" ${UI.inboxDone?'checked':''} onchange="UI.inboxDone=this.checked;render()"> show answered</label>
    ${waiting.length>1?`<button onclick='answerIds(${JSON.stringify(waiting)},"approved")'>Approve all ${waiting.length}</button><button class="danger" onclick='answerIds(${JSON.stringify(waiting)},"denied")'>Deny all</button>`:''}</div>`;
  if(!reqs.length) h += `<div class="card faint">${opts.empty||'Nothing waiting.'}</div>`;
  if(!reqs.length) return h;
  // Wide: a list on the left, the picked request in full on the right. Narrow (the session strip): rows that open in place.
  const sel = reqs.find(r=>r.id===UI.reqSel) || (UI.reqSel==='none' && opts.narrow ? null : reqs.find(r=>r.state==='pending'&&vipHot(ss(r.sid))) || reqs.find(r=>r.state==='pending') || (opts.narrow ? null : reqs[0]));
  let list = '';
  for(const sid of Object.keys(by).sort((a,b)=>vipHot(ss(b))-vipHot(ss(a)))){
    const s = ss(sid);
    if(!opts.single) list += `<div class="rq-grp">${vipTag(s)}${s.id===opts.self?'This session':esc(s.title)}${opts.chan===false?'':` <span class="faint">#${esc(ch(s.cid).name)}</span>`}</div>`;
    for(const r of by[sid]){
      const on = sel && sel.id===r.id;
      list += `<div class="rq-row ${on?'on':''} ${r.state!=='pending'?'done':''}" onclick="UI.reqSel=${on&&opts.narrow?`'none'`:`'${r.id}'`};render()" data-fb="Request ${r.id}"><span class="rq-ic">${RQ_IC[r.kind]||'•'}</span><span class="t">${esc(r.action)}</span><span class="faint" style="font-size:11px;flex:none">${r.state==='pending'?esc(r.at):r.state==='denied'?'denied':'approved'}</span></div>`;
      if(on && opts.narrow) list += `<div class="rq-inline">${reqCard(r)}</div>`;
    }
  }
  if(opts.narrow) return h + `<div class="card" style="padding:4px 0">${list}</div>`;
  return h + `<div class="rq-split"><div class="card rq-list">${list}</div><div class="card rq-detail">${sel?reqCard(sel):''}</div></div>`;
}

}

function bridgeAscii(){
  const rem = HOSTS().filter(h=>h.id!=='mac'); const W = 24;
  const box = h => { const n=D.sessions.filter(s=>s.host===h.id).length; return [`┌${'─'.repeat(W)}┐`, `│ ${(h.name.padEnd(10)+(h.status==='online'?'● online':'○ '+h.status)).padEnd(W-1)}│`, `│ ${('humatad · '+n+' session'+(n===1?'':'s')).padEnd(W-1)}│`, `└${'─'.repeat(W)}┘`] };
  const boxes = rem.map(box); const row = i => boxes.map(b=>b[i]).join(' ');
  const width = row(0).length; const mid = Math.max(0, Math.floor((width-60)/2));
  const pad = ' '.repeat(mid);
  return `${pad}┌──────────── This Mac (Humata app + humatad) ────────────┐
${pad}│  ${('sessions: '+D.sessions.filter(s=>s.host==='mac').length).padEnd(14)}Inbox · access checks · bridge   │
${pad}└───────────────────────────▲────────────────────────────┘
${' '.repeat(mid+20)}SSH, one link each · gRPC streams inside
${rem.map((_,i)=>' '.repeat(i*(W+3)+W/2)+'│').reduce((a,l)=>a.split('').map((ch,i)=>l[i]==='│'?'│':ch).join('').padEnd(Math.max(a.length,l.length)), ' '.repeat(width))}
${[0,1,2,3].map(row).join('\n')}
  devbox-1 → gpu-box files:   devbox-1 ─▶ Mac ─▶ gpu-box   (checked on the Mac, streamed, not stored)
  devbox-1 → Mac session:     devbox-1 ─▶ Mac              (checked on the Mac)`;
}

document.addEventListener('keydown', e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='['){e.preventDefault();back()} if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault(); openModal('palette')} if(e.key==='Escape'){ if(UI.modal) closeModal(); else if(UI.drawer){UI.drawer=null;render()} else if(UI.fbOpen){UI.fbOpen=false;render()} } });
