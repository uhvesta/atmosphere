version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
name = "humata2_passphrase"
path = "src/lib.rs"

[dependencies]
argon2 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
