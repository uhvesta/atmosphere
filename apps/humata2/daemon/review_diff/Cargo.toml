[package]
name = "humata2-review-diff"
description = "Humata 2's review diffs: diff specs computed with the git CLI into files, hunks and lines, reviewed snapshots as git objects, per-file Viewed, and agent-prepared review plans."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

# The proto conversions (src/wire.rs) use the message types Bazel generates
# (//apps/humata2/api/proto:humata2_rust), so this crate builds with Bazel
# only.
[lib]
name = "humata2_review_diff"
path = "src/lib.rs"

[dependencies]
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
