[package]
name = "humatad2"
description = "Humata 2's daemon: the gRPC API on a Unix socket, the peer link on stdio, and a stdio bridge to the socket."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

# Also depends on the protocol's Rust types and its tonic services, which
# Bazel generates (//apps/humata2/api/proto:humata2_rust and :grpc here), so
# this crate builds with Bazel only.
[[bin]]
name = "humatad2"
path = "src/main.rs"

[[bin]]
name = "protoc-gen-tonic"
path = "codegen/protoc_gen_tonic.rs"

[features]
# Test daemons only: `humatad2 serve --admin` takes a call with no
# credential for the user. Release builds never turn this on.
admin = []
# Test daemons only: the points of this crate and the crates under it are
# live (HUMATA2_STOP_AT, HUMATA2_FAULT_TRACE), and SIGUSR2 is a power cut.
faults = ["admin", "humata2-store/faults", "humata2-durable/faults"]

[dependencies]
clap = { workspace = true }
hmac = { workspace = true }
humata2-access = { path = "../access" }
humata2-app-peer = { path = "../app_peer" }
humata2-chunk = { path = "../../chunk" }
humata2-holder = { workspace = true }
humata2-machines = { path = "../machines" }
humata2-marks = { path = "../marks" }
humata2-mirror = { path = "../mirror" }
humata2-mcp = { path = "../mcp" }
humata2-passphrase = { path = "../passphrase" }
humata2-repo-library = { path = "../repo_library" }
humata2-review-diff = { path = "../review_diff" }
humata2-revive = { workspace = true }
humata2-store = { workspace = true }
humata2-durable = { workspace = true }
http-body = { workspace = true }
hyper-util = { workspace = true }
notify = { workspace = true }
prost = { workspace = true }
protoc-gen-prost = { workspace = true }
protoc-gen-tonic = { workspace = true }
rand = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tower = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
hmac = { workspace = true }
humata2-conversation = { path = "../conversation" }
rusqlite = { workspace = true }
rustix = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
