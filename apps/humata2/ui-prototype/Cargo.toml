[package]
name = "humata2-ui-prototype"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
fast = ["gpui-kit/gpui-fast", "humata2-engine/fast"]
# Headless automation tests; they draw off screen and open no window.
automation = ["humata2-engine/test-support"]

[dependencies]
gpui-kit = { workspace = true, features = ["syntect"] }
humata2-engine = { path = "../engine" }
terminal_view = { path = "../terminal/view" }
terminal_grid = { path = "../terminal/grid" }
markdown = "=1.0.0"
# Upstream PR #125: layout profiling must not call std::time::Instant on wasm.
mermaid-rs-renderer = { git = "https://github.com/research-developer/mermaid-rs-renderer", rev = "2cdc01421a153bc33d010ddadddf5aefbbf1e38d", default-features = false }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
console_error_panic_hook.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

