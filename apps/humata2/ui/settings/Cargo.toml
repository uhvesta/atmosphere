[package]
name = "humata2-ui-settings"
description = "Settings and access views for Humata 2."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "humata2_ui_settings"
path = "src/lib.rs"

[dependencies]
gpui-kit = { workspace = true }
humata2-app = { path = "../../features/app" }
humata2-clients = { path = "../../clients" }
humata2-hosts = { path = "../../features/hosts" }
humata2-settings = { path = "../../features/settings" }
humata2-ui-core = { path = "../core" }
