[package]
name = "humata2-ui-core"
description = "Shared GPUI primitives, theme, keybindings, widgets, and store bridge for Humata 2's UI crates."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "humata2_ui_core"
path = "src/lib.rs"

[dependencies]
gpui-kit = { workspace = true }
humata2-app = { path = "../../features/app" }
humata2-clients = { path = "../../clients" }
humata2-session = { path = "../../features/session" }
tca-rust = { workspace = true }
tokio = { workspace = true }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
