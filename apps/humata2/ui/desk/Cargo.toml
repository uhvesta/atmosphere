[package]
name = "humata2-ui-desk"
description = "Desk views, channel Desk tab, and sidebar Desk rows for Humata 2."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "humata2_ui_desk"
path = "src/lib.rs"

[dependencies]
gpui-kit = { workspace = true }
humata2-app = { path = "../../features/app" }
humata2-clients = { path = "../../clients" }
humata2-desk = { path = "../../features/desk" }
humata2-session = { path = "../../features/session" }
humata2-sidebar = { path = "../../features/sidebar" }
humata2-ui-core = { path = "../core" }
