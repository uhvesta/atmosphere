[package]
name = "humata2-ui-machines"
description = "Hosts, machine page, running holders, and transfers tray views for Humata 2."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "humata2_ui_machines"
path = "src/lib.rs"

[dependencies]
gpui-kit = { workspace = true }
humata2-app = { path = "../../features/app" }
humata2-clients = { path = "../../clients" }
humata2-files = { path = "../../features/files" }
humata2-hosts = { path = "../../features/hosts" }
humata2-mass-delete = { path = "../../features/mass_delete" }
humata2-ui-core = { path = "../core" }
