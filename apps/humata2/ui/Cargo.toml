[package]
name = "humata2-ui"
description = "Humata 2's GPUI views over the feature states, and the one bridge between a tca-rust store and GPUI entities."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "humata2_ui"
path = "src/lib.rs"

[dependencies]
gpui-kit = { workspace = true }
humata2-app = { path = "../features/app" }
humata2-board = { path = "../features/board" }
humata2-clients = { path = "../clients" }
humata2-desk = { path = "../features/desk" }
humata2-files = { path = "../features/files" }
humata2-hosts = { path = "../features/hosts" }
humata2-inbox = { path = "../features/inbox" }
humata2-markdown = { path = "../markdown" }
humata2-palette = { path = "../features/palette" }
humata2-report = { path = "../report" }
humata2-review = { path = "../features/review" }
humata2-session = { path = "../features/session" }
humata2-settings = { path = "../features/settings" }
humata2-sidebar = { path = "../features/sidebar" }
humata2-views = { path = "../features/views" }
image = { workspace = true }
tca-rust = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"
