[package]
name = "humata2-app"
description = "Humata 2's root feature: routes and Back, overlays, pane sizes, toasts, loading, the daemon's event stream, and saving where the person was across restarts."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "humata2_app"
path = "src/lib.rs"

[dependencies]
humata2-clients = { path = "../../clients" }
humata2-desk = { path = "../desk" }
humata2-files = { path = "../files" }
humata2-find = { path = "../find" }
humata2-hosts = { path = "../hosts" }
humata2-inbox = { path = "../inbox" }
humata2-mass-delete = { path = "../mass_delete" }
humata2-palette = { path = "../palette" }
humata2-pr-review = { path = "../pr_review" }
humata2-review = { path = "../review" }
humata2-session = { path = "../session" }
humata2-settings = { path = "../settings" }
humata2-sidebar = { path = "../sidebar" }
humata2-views = { path = "../views" }
serde = { workspace = true }
serde_json = { workspace = true }
tca-rust = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
