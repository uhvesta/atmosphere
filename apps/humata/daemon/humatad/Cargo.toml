[package]
name = "humatad"
description = "Humata's daemon, and the host role that runs sessions on any machine."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[lib]
name = "humatad"
path = "src/lib.rs"

[[bin]]
name = "humatad"
path = "src/main.rs"

[dependencies]
clap.workspace = true
prost.workspace = true
rusqlite.workspace = true
ruzstd.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
