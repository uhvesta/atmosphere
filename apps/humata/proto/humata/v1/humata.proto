// The one protocol Humata speaks: between the app, the command-line tool and
// the MCP server and the daemon on your Mac, and between that daemon and the
// host role on each machine (over a local socket, or over SSH's stdin and
// stdout).
//
// On the wire each message is one Envelope, preceded by its length as a
// 4-byte big-endian unsigned integer. Both sides send a Hello first and
// refuse a peer whose protocol_version differs.
syntax = "proto3";

package humata.v1;

// Bump when a change breaks older peers. Additive changes keep the number.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 1;
}

message Envelope {
  // The request this belongs to. A response, the events of a stream and its
  // end all carry their request's id. Hello uses 0.
  uint64 id = 1;

  oneof body {
    Hello hello = 2;
    Request request = 3;
    Response response = 4;
    // One item of the stream a request opened (for example WatchSession).
    StreamItem item = 5;
    // The stream a request opened has ended, normally or with an error.
    StreamEnd end = 6;
    // The sender no longer wants the stream its request opened.
    Cancel cancel = 7;
  }
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  // The daemon on your Mac, which owns the board.
  ROLE_DAEMON = 1;
  // The host role, which runs sessions next to the code.
  ROLE_HOST = 2;
  // The app, the command-line tool or the MCP server.
  ROLE_CLIENT = 3;
}

message Hello {
  ProtocolVersion protocol_version = 1;
  Role role = 2;
  // The program's own version, for messages about updating it.
  string program_version = 3;
  // Whether this side reads envelopes compressed with zstd. A side
  // compresses only what it sends to a peer that does.
  bool accepts_zstd = 4;
}

message Request {
  oneof kind {
    StartSession start_session = 1;
    SendMessage send_message = 2;
    Approve approve = 3;
    ForkSession fork_session = 4;
    ReadHistory read_history = 5;
    WatchSession watch_session = 6;
    ListSessions list_sessions = 7;
    AbortTurn abort_turn = 8;
    SetApprovalMode set_approval_mode = 9;
    // Projects live in the daemon; a host refuses these.
    CreateProject create_project = 10;
    ListProjects list_projects = 11;
    UpdateSession update_session = 12;
    ReadChanges read_changes = 13;
    // The board lives in the daemon; a host refuses these.
    CreateItem create_item = 14;
    UpdateItem update_item = 15;
    ListItems list_items = 16;
    ReadBoardLog read_board_log = 17;
    RevertBoardChange revert_board_change = 18;
    ListInbox list_inbox = 19;
    // Hosts are the daemon's; a host refuses these.
    ListHosts list_hosts = 20;
    AddHost add_host = 21;
    UpdateHost update_host = 22;
    RemoveHost remove_host = 23;
    CheckHost check_host = 24;
    InstallHost install_host = 25;
    ListSshHosts list_ssh_hosts = 26;
    // The daemon sends a host these itself; the daemon refuses them.
    ConfigureHost configure_host = 27;
    ReadHostStatus read_host_status = 28;
    CloneRepositories clone_repositories = 29;
    EditChanges edit_changes = 30;
    // Review threads are the daemon's; a host refuses these.
    MarkViewed mark_viewed = 31;
    CreateThread create_thread = 32;
    ReplyToThread reply_to_thread = 33;
    ResolveThread resolve_thread = 34;
    DeleteComment delete_comment = 35;
    ListThreads list_threads = 36;
    SendReview send_review = 37;
    // A session's folder, to browse.
    ListFiles list_files = 38;
    ReadFile read_file = 39;
    // Seen state is the daemon's; a host refuses it.
    MarkSeen mark_seen = 40;
    Unqueue unqueue = 41;
    // Refused while any of its sessions isn't archived.
    DeleteProject delete_project = 42;
    ListImportable list_importable = 43;
    ImportSession import_session = 44;
    // From the daemon to a host: the host's agents' calls to the humata MCP
    // tools, streamed for the daemon to answer. A daemon refuses both.
    WatchToolCalls watch_tool_calls = 45;
    AnswerToolCall answer_tool_call = 46;
    // From an agent, through the humata tools: something for the person.
    AskPerson ask_person = 47;
    RequestMove request_move = 48;
    // From the person, in the inbox.
    AnswerRequest answer_request = 49;
    // The models a backend on a host offers, to pick from when starting.
    ListModels list_models = 50;
    // Sessions on a host that couldn't be opened, and removing one.
    ListSkipped list_skipped = 51;
    RemoveSkipped remove_skipped = 52;
    StopHost stop_host = 53;
    // From the daemon to a host: a session's recovery copy, and setting a
    // session up again from one. A daemon refuses both.
    BackupSession backup_session = 54;
    RestoreBackup restore_backup = 55;
    // From a client: the Mac's recovery copies, and restoring from them.
    ListRecoveries list_recoveries = 56;
    RestoreSession restore_session = 57;
    RestoreHost restore_host = 58;
    // Terminals on a host, in a session's folder or any of the host's. The
    // daemon sends each to the host its `host` field names.
    OpenTerminal open_terminal = 59;
    AttachTerminal attach_terminal = 60;
    TerminalInput terminal_input = 61;
    ResizeTerminal resize_terminal = 62;
    ListTerminals list_terminals = 63;
    CloseTerminal close_terminal = 64;
    // A folder's entries, a level at a time, in a session's folder or any
    // folder on a host.
    ListFolder list_folder = 65;
    // Port forwarding: the Mac listens on a local port and carries each
    // connection to a port on a host, over the host's connection.
    ForwardPort forward_port = 66;
    ListForwards list_forwards = 67;
    StopForward stop_forward = 68;
    // For hosts only: one connection to a port, its bytes as a stream.
    ConnectPort connect_port = 69;
    WritePort write_port = 70;
    ClosePort close_port = 71;
    // The tasks and spec edits a session's agent proposed, from its
    // history, with what the person did about each.
    ListProposals list_proposals = 72;
    ApplyProposal apply_proposal = 73;
    DeclineProposal decline_proposal = 74;
    UpdateProject update_project = 75;
    // For hosts only: the daemon's copy of the specs a session reads, kept
    // on its host so its agent reads them while the Mac is away.
    SetSpecs set_specs = 76;
    // A spec on the session's board, or the host's copy of it.
    ReadSpec read_spec = 77;
    // For the Mac only: link its humata and humatad into ~/.local/bin, or
    // say how they're linked.
    LinkCommands link_commands = 78;
    // For the Mac only: what every session said and did that has these words.
    Search search = 79;
    // Commit a session's changes on a branch, and push it and open pull
    // requests, between turns.
    LandSession land_session = 80;
    // For the Mac only: a session's or a task's pull requests.
    ListPullRequests list_pull_requests = 81;
    // Merge each repository's base branch into the session's copy.
    UpdateFromBase update_from_base = 82;
    // For the Mac only: make tasks of a project's repositories' open issues.
    ImportIssues import_issues = 83;
    // For hosts only: delete branches a merged session landed on.
    DeleteBranches delete_branches = 84;
    // For the Mac only: the app serves the Mac's models on this port of
    // 127.0.0.1, for local-model sessions on the Mac and, forwarded over
    // SSH, on its hosts.
    SetModelServer set_model_server = 85;
    DeleteSession delete_session = 86;
    DeleteItem delete_item = 87;
    Propose propose = 88;
    // Admin actions from a client other than the app wait for the person:
    // reading how one stands, the app deciding them, and grants.
    WaitForApproval wait_for_approval = 89;
    ListApprovals list_approvals = 90;
    DecideApprovals decide_approvals = 91;
    RevokeGrant revoke_grant = 92;
    // For the Mac only: what humatad's files take on the Mac, and cleaning
    // them up. Changing the settings and cleaning up are the app's only.
    GetStorage get_storage = 93;
    SetStorageSettings set_storage_settings = 94;
    CleanUpStorage clean_up_storage = 95;
    EditQueued edit_queued = 96;
    ReadImage read_image = 97;
    // Cuts a session's chat back to before one of the person's messages,
    // and with files, its code too. The cut can be undone until the next
    // message.
    RewindSession rewind_session = 98;
    UndoRewind undo_rewind = 99;
    ScanSkills scan_skills = 100;
    ListSkills list_skills = 101;
    PickSkill pick_skill = 102;
  }
}

message Response {
  oneof kind {
    Error error = 1;
    SessionStarted session_started = 2;
    MessageSent message_sent = 3;
    Approved approved = 4;
    SessionForked session_forked = 5;
    History history = 6;
    Sessions sessions = 7;
    TurnAborted turn_aborted = 8;
    // A stream request was accepted; its items follow as StreamItem.
    Watching watching = 9;
    ApprovalModeSet approval_mode_set = 10;
    ProjectCreated project_created = 11;
    Projects projects = 12;
    SessionUpdated session_updated = 13;
    Changes changes = 14;
    ItemCreated item_created = 15;
    ItemUpdated item_updated = 16;
    Items items = 17;
    BoardLog board_log = 18;
    BoardChangeReverted board_change_reverted = 19;
    Inbox inbox = 20;
    Hosts hosts = 21;
    HostSaved host_saved = 22;
    HostRemoved host_removed = 23;
    HostHealth host_health = 24;
    HostInstalled host_installed = 25;
    SshHosts ssh_hosts = 26;
    HostConfigured host_configured = 27;
    HostStatus host_status = 28;
    RepositoriesCloned repositories_cloned = 29;
    ChangesEdited changes_edited = 30;
    FileViewed file_viewed = 31;
    ThreadSaved thread_saved = 32;
    CommentDeleted comment_deleted = 33;
    Threads threads = 34;
    ReviewSent review_sent = 35;
    Files files = 36;
    FileContents file_contents = 37;
    Seen seen = 38;
    Unqueued unqueued = 39;
    ProjectDeleted project_deleted = 40;
    Importable importable = 41;
    ToolCallsWatched tool_calls_watched = 42;
    ToolCallAnswered tool_call_answered = 43;
    RequestMade request_made = 44;
    RequestAnswered request_answered = 45;
    Models models = 46;
    Skipped skipped = 47;
    SkippedRemoved skipped_removed = 48;
    HostStopping host_stopping = 49;
    SessionBackup session_backup = 50;
    SessionRestored session_restored = 51;
    Recoveries recoveries = 52;
    HostRestored host_restored = 53;
    TerminalOpened terminal_opened = 54;
    TerminalInputSent terminal_input_sent = 55;
    TerminalResized terminal_resized = 56;
    Terminals terminals = 57;
    TerminalClosed terminal_closed = 58;
    Folder folder = 59;
    PortForwarded port_forwarded = 60;
    Forwards forwards = 61;
    ForwardStopped forward_stopped = 62;
    // A ConnectPort stream was accepted; its bytes follow as PortData.
    PortConnected port_connected = 63;
    PortWritten port_written = 64;
    PortClosed port_closed = 65;
    Proposals proposals = 66;
    ProposalApplied proposal_applied = 67;
    ProposalDeclined proposal_declined = 68;
    ProjectUpdated project_updated = 69;
    SpecsSet specs_set = 70;
    Spec spec = 71;
    CommandsLinked commands_linked = 72;
    SearchResults search_results = 73;
    SessionLanded session_landed = 74;
    PullRequests pull_requests = 75;
    BaseUpdated base_updated = 76;
    IssuesImported issues_imported = 77;
    BranchesDeleted branches_deleted = 78;
    ModelServerSet model_server_set = 79;
    SessionDeleted session_deleted = 80;
    ItemDeleted item_deleted = 81;
    Proposed proposed = 82;
    // An admin action asked for by a client other than the app, waiting for
    // the person: sent instead of the action's own response.
    NeedsApproval needs_approval = 83;
    ApprovalStatus approval_status = 84;
    Approvals approvals = 85;
    ApprovalsDecided approvals_decided = 86;
    GrantRevoked grant_revoked = 87;
    Storage storage = 88;
    QueuedEdited queued_edited = 89;
    ImageData image_data = 90;
    SessionRewound session_rewound = 91;
    RewindUndone rewind_undone = 92;
    SkillsScanned skills_scanned = 93;
    SkillList skill_list = 94;
    SkillPicked skill_picked = 95;
  }
}

message Error {
  ErrorCode code = 1;
  // For the person who has to fix it: what failed and how to resolve it.
  string message = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNKNOWN_SESSION = 1;
  ERROR_CODE_UNKNOWN_EVENT = 2;
  ERROR_CODE_UNKNOWN_PERMISSION_REQUEST = 3;
  ERROR_CODE_UNKNOWN_BACKEND = 4;
  ERROR_CODE_BUSY = 5;
  ERROR_CODE_INVALID_REQUEST = 6;
  ERROR_CODE_BACKEND_FAILED = 7;
  ERROR_CODE_STORAGE_FAILED = 8;
  ERROR_CODE_HOST_UNAVAILABLE = 9;
  ERROR_CODE_UNKNOWN_PROJECT = 10;
  // The session is archived; unarchive it first.
  ERROR_CODE_ARCHIVED = 11;
  ERROR_CODE_UNKNOWN_ITEM = 12;
  ERROR_CODE_UNKNOWN_BOARD_CHANGE = 13;
  ERROR_CODE_UNKNOWN_HOST = 14;
  ERROR_CODE_UNKNOWN_THREAD = 15;
  // What the request worked on changed since it was read; read it again.
  ERROR_CODE_CHANGED = 16;
  // The queued message already started or was taken out.
  ERROR_CODE_UNKNOWN_QUEUED_MESSAGE = 17;
  // The session to import isn't one the backend has, or has nothing in it.
  ERROR_CODE_UNKNOWN_IMPORT = 18;
  // The session was imported before; open that one.
  ERROR_CODE_ALREADY_IMPORTED = 19;
  // No such request waits in the inbox; it may have been answered.
  ERROR_CODE_UNKNOWN_REQUEST = 20;
  // No such terminal on the host; it was closed, or the host restarted.
  ERROR_CODE_UNKNOWN_TERMINAL = 21;
  // The connection to a forwarded port closed already.
  ERROR_CODE_UNKNOWN_CONNECTION = 22;
  ERROR_CODE_UNKNOWN_FORWARD = 23;
  // The session has no such proposal, or it was applied or declined.
  ERROR_CODE_UNKNOWN_PROPOSAL = 24;
  // GitHub refused the request or couldn't be reached.
  ERROR_CODE_GITHUB = 25;
  // Only the Humata app may send this request, as deciding approvals.
  ERROR_CODE_APP_ONLY = 26;
  // No such approval or grant; it may have been dropped.
  ERROR_CODE_UNKNOWN_APPROVAL = 27;
  // No such image in the session; it went with the session's files.
  ERROR_CODE_UNKNOWN_IMAGE = 28;
  // Two skills a new session would get share a name, and nobody has picked
  // which wins; pick in Settings › Skills, or with `humata pick-skill`.
  ERROR_CODE_SKILL_CLASH = 29;
}

enum Backend {
  BACKEND_UNSPECIFIED = 0;
  BACKEND_SCRIPTED = 1;
  BACKEND_LOCAL = 2;
  BACKEND_COPILOT = 3;
  // Claude Code, on the `claude` CLI signed in on the host.
  BACKEND_CLAUDE = 4;
}

message StartSession {
  Backend backend = 1;
  // The folder the agent works in, on the host. Ignored when it works in
  // repositories: then it works in its own copy of them. With neither, nor
  // a project to take repositories from, it gets an empty folder of its own
  // on the host, kept with the host's state: a chat that works in no folder
  // of yours.
  string working_directory = 2;
  // The model to use; empty for the backend's default.
  string model = 3;
  // Instructions for the agent, set for the life of the session.
  string instructions = 4;
  string name = 5;
  // The host to run on, as the daemon names it; empty for this machine.
  string host = 6;
  // Settings only the backend reads, as JSON; for the scripted backend, its
  // script. A fork keeps them.
  string backend_config = 7;
  ApprovalMode approval_mode = 8;
  // The project it belongs to. Its repositories and instructions, if empty,
  // are the project's.
  string project_id = 9;
  // The repositories, on the host, it works in. Each gets a git worktree of
  // its own, made before its first turn and saved after each one, without a
  // commit.
  repeated Repository repositories = 10;
  // The task or subtask it works on, in the project; the project is the
  // item's if not given. Empty for the project itself.
  string item_id = 11;
  // Which specs it reads, ahead of its instructions.
  SpecScope specs = 12;
  // Plans in its project rather than changing code: it gets no copy of the
  // repositories, only an empty folder of its own, so it starts at once.
  bool planning = 13;
}

enum SpecScope {
  // The same as ITEM.
  SPEC_SCOPE_UNSPECIFIED = 0;
  // Its item's spec alone.
  SPEC_SCOPE_ITEM = 1;
  // Its item's, and the task's above a subtask.
  SPEC_SCOPE_WITH_PARENTS = 2;
}

// A git repository a session works in.
message Repository {
  // Its folder's name in the session's copy; unique within a session.
  string name = 1;
  // The repository's folder. For one added by its URL, the Mac's clone of
  // it, which the daemon makes.
  string path = 2;
  // Where it's cloned from, for one added by its URL rather than a folder,
  // such as https://github.com/owner/name.git. The Mac's clone is fetched
  // before each session there; hosts clone it from here.
  string url = 3;
}

// What a session may do without asking. A fork keeps its parent's.
enum ApprovalMode {
  // The same as ASK_EVERY_TIME.
  APPROVAL_MODE_UNSPECIFIED = 0;
  APPROVAL_MODE_ASK_EVERY_TIME = 1;
  // Reads and file writes go ahead; commands and anything else still ask.
  APPROVAL_MODE_ALLOW_EDITS = 2;
  APPROVAL_MODE_ALLOW_EVERYTHING = 3;
  // The agent's own judge lets through what it finds safe and in line with
  // what was asked; the rest asks. Only for Claude Code and Copilot.
  APPROVAL_MODE_AUTO = 4;
}

// Sets a session's approval mode from now on. Requests waiting for an
// answer that the new mode allows go ahead.
message SetApprovalMode {
  string session_id = 1;
  ApprovalMode mode = 2;
}

message ApprovalModeSet {}

message Project {
  string id = 1;
  string name = 2;
  reserved 3;
  reserved "repository";
  // The repositories on this Mac its sessions work in.
  repeated Repository repositories = 6;
  // Instructions for every session in it.
  string instructions = 4;
  // Milliseconds since 1970 in UTC.
  int64 created_unix_ms = 5;
  // Skills every session in it reads after its instructions.
  repeated Skill skills = 7;
}

// A named piece of know-how, such as how to cut a release, in Markdown.
message Skill {
  string name = 1;
  string text = 2;
}

message CreateProject {
  string name = 1;
  reserved 2;
  reserved "repository";
  string instructions = 3;
  // At least one, each a folder or a URL. A repository without a name is
  // named after its folder or URL.
  repeated Repository repositories = 4;
  repeated Skill skills = 5;
}

// Changes a project. Unset fields are left as they are; sessions started
// after read the new instructions and skills.
message UpdateProject {
  string project_id = 1;
  optional string name = 2;
  optional string instructions = 3;
  // Replaces every skill when set.
  Skills skills = 4;
  // Replaces every repository when set, for sessions started after; those
  // running keep their copies. Named as in CreateProject.
  Repositories repositories = 5;
}

message Repositories {
  repeated Repository repositories = 1;
}

message Skills {
  repeated Skill skills = 1;
}

message ProjectUpdated {
  Project project = 1;
}

message ProjectCreated {
  Project project = 1;
}

// Removes a project and its board from the daemon. Its archived sessions
// stay on their hosts, with no project, so their code and history are kept.
message DeleteProject {
  string project_id = 1;
}

message ProjectDeleted {}

// The sessions the backends on a host ran outside Humata, newest first.
message ListImportable {
  // The host to look on, as the daemon names it; empty for this machine.
  string host = 1;
}

message Importable {
  repeated ImportableSession sessions = 1;
}

// The models a backend offers. A backend that can't list them, such as
// Copilot on an account without the feature, answers with an error and the
// app takes a typed model name instead.
message ListModels {
  // The host to ask, as the daemon names it; empty for this machine.
  string host = 1;
  Backend backend = 2;
  // As in `StartSession`: a local model server or a Copilot provider, whose
  // models are listed instead.
  string backend_config = 3;
}

message ListSkipped {
  // The host to ask, as the daemon names it; empty for this machine.
  string host = 1;
}

message Skipped {
  repeated SkippedSession sessions = 1;
}

// A session on a host whose files couldn't be read, so it is left as it is.
message SkippedSession {
  Backend backend = 1;
  // Its folder's name, which is its id.
  string id = 2;
  // Its folder, on the host.
  string folder = 3;
  // Why it couldn't be opened, and what fixing it would take.
  string reason = 4;
}

// Deletes a skipped session's folder, with its history.
message RemoveSkipped {
  string host = 1;
  Backend backend = 2;
  string id = 3;
}

message SkippedRemoved {}

// Asks a host serving on its own socket to stop, once its replacement is
// installed. It removes its socket first, so the next connection starts the
// new one. Daemon to host only.
message StopHost {}

message HostStopping {}

// A session's recovery copy, from the host it runs on. Daemon to host only.
message BackupSession {
  string session_id = 1;
  // What the daemon's copy of each repository has already, so the bundles
  // leave out what is reachable from it.
  repeated RepositoryCommits haves = 2;
}

// Commits in one of a session's repositories, by the name the session
// gives it.
message RepositoryCommits {
  string name = 1;
  repeated string commits = 2;
}

// What sets a session up again on a host that lost it, or on another one.
message SessionBackup {
  Backend backend = 1;
  // The session's record as its host keeps it, as JSON.
  bytes record = 2;
  // Its history as its host keeps it, as a JSON array of events.
  bytes events = 3;
  // The backend's own state of it, such as Claude Code's transcript.
  repeated BackendFile backend_files = 4;
  // Its snapshots' commits in each repository that the haves didn't
  // have; a repository with nothing new isn't listed.
  repeated RepositoryBundle bundles = 5;
  // How many turns it had finished.
  uint32 turns = 6;
}

message BackendFile {
  string name = 1;
  bytes contents = 2;
}

// A git bundle of a session's snapshot refs in one repository.
message RepositoryBundle {
  string name = 1;
  bytes bundle = 2;
}

// Sets a session up again on this host from its recovery copy, at its last
// snapshot. Refused if the host has the session already. Daemon to host
// only.
message RestoreBackup {
  SessionBackup backup = 1;
  // The clones on this host it works in, by the names its record gives.
  repeated Repository repositories = 2;
}

message SessionRestored {
  SessionInfo session = 1;
}

// The daemon's recovery copies of sessions on other machines.
message ListRecoveries {}

message Recoveries {
  repeated Recovery recoveries = 1;
}

message Recovery {
  string session_id = 1;
  string name = 2;
  // The host it was backed up from.
  string host = 3;
  // Turns finished when it was last backed up, and as its host last said.
  // The copy is behind while the first is less.
  uint32 backed_up_turns = 4;
  uint32 turns = 5;
  int64 backed_up_unix_ms = 6;
  // Its host is reachable and has it, so there is nothing to restore
  // there.
  bool on_host = 7;
  // Why its last backup failed; empty when it worked. Tried again after its
  // next turn, or ten minutes on.
  string problem = 8;
}

// Sets a session up again from the Mac's recovery copy on `host`, empty for
// This Mac. Onto a host other than its own, it moves: its host changes and
// its id, tree and task stay.
message RestoreSession {
  string session_id = 1;
  string host = 2;
}

// Restores every session the Mac has a copy of from `host` that the host
// doesn't have, such as after it was reinstalled.
message RestoreHost {
  string host = 1;
}

message HostRestored {
  repeated SessionInfo restored = 1;
  // Sessions that couldn't be restored, with why.
  repeated RestoreFailure failed = 2;
}

message RestoreFailure {
  string session_id = 1;
  string message = 2;
}

message Models {
  repeated ModelChoice models = 1;
}

message ModelChoice {
  // What `StartSession` takes as the model.
  string id = 1;
  string name = 2;
  // Such as what a turn costs; empty when there is nothing to say.
  string detail = 3;
  // Whether it can see images sent with a message.
  bool reads_images = 4;
}

message ImportableSession {
  Backend backend = 1;
  // The backend's own id for it.
  string id = 2;
  // The folder it worked in, on the host.
  string working_directory = 3;
  // Its first message, on one line.
  string summary = 4;
  int64 updated_unix_ms = 5;
}

// Brings a session from `ListImportable` into Humata, with its history, to
// carry on in the folder it worked in. Answered with `SessionStarted`.
message ImportSession {
  Backend backend = 1;
  string external_id = 2;
  string host = 3;
  // Empty to name it after its summary.
  string name = 4;
  string project_id = 5;
}

message ListProjects {}

message Projects {
  repeated Project projects = 1;
}

message SessionStarted {
  SessionInfo session = 1;
}

enum SendMode {
  SEND_MODE_UNSPECIFIED = 0;
  // Start a turn now, or wait for the running one to finish.
  SEND_MODE_ENQUEUE = 1;
  // Steer the running turn.
  SEND_MODE_IMMEDIATE = 2;
  // As ENQUEUE, unless the same text already waits in the queue, so a
  // repeated notice starts one turn, not one each time.
  SEND_MODE_ENQUEUE_ONCE = 3;
}

message SendMessage {
  string session_id = 1;
  string text = 2;
  SendMode mode = 3;
  // Names this send, so one sent again after its answer was lost runs
  // once: the host takes an id it took lately as done. Empty for none.
  string client_id = 4;
  // Sent with the text. A steer with images goes next in the queue
  // instead, as a running turn can't take them.
  // ERROR_CODE_INVALID_REQUEST for a kind other than PNG, JPEG, GIF or
  // WebP, or one over 20 MB.
  repeated Image images = 5;
}

// An image sent with a message.
message Image {
  // image/png, image/jpeg, image/gif or image/webp.
  string media_type = 1;
  bytes data = 2;
}

message MessageSent {}

// An image a UserMessage names. ERROR_CODE_UNKNOWN_IMAGE when the
// session has no image by that name.
message ReadImage {
  string session_id = 1;
  string name = 2;
}

message ImageData {
  Image image = 1;
}

message Approve {
  string session_id = 1;
  string permission_request_id = 2;
  bool approved = 3;
}

message Approved {}

// Something a session's agent proposed with `propose_task` or
// `propose_spec_edit`. It lives in the session's history, on its host, so
// proposing needs nothing from the Mac; nothing reaches the board until the
// person applies it. An agent outside Humata proposes through `humata mcp`:
// its proposals have no session and are kept by the daemon, for a project.
message Proposal {
  // The tool call's id, unique in the session; for an outside agent's, unique.
  string id = 1;
  // Empty for an outside agent's.
  string session_id = 2;
  ProposalKind kind = 3;
  // For a task: its title, its spec, and the task it goes under, if any.
  // For a spec edit: the item's title and its whole new spec.
  string title = 4;
  string spec = 5;
  string parent_id = 6;
  // For a spec edit, the item it changes.
  string item_id = 7;
  // Why, in the agent's words.
  string note = 8;
  ProposalState state = 9;
  // The item applying it made or changed.
  string applied_item_id = 10;
  // The turn it was proposed in, from 1.
  uint32 turn = 11;
  int64 time_unix_ms = 12;
  // For a pending spec edit, the item's spec as it is now, to compare.
  string current_spec = 13;
  // For an outside agent's, the project whose board it's for.
  string project_id = 14;
}

enum ProposalKind {
  PROPOSAL_KIND_UNSPECIFIED = 0;
  PROPOSAL_KIND_TASK = 1;
  PROPOSAL_KIND_SPEC_EDIT = 2;
}

enum ProposalState {
  PROPOSAL_STATE_UNSPECIFIED = 0;
  PROPOSAL_STATE_PENDING = 1;
  PROPOSAL_STATE_APPLIED = 2;
  PROPOSAL_STATE_DECLINED = 3;
}

// A session's proposals or, with no session, what outside agents proposed
// for `project_id`.
message ListProposals {
  string session_id = 1;
  string project_id = 2;
}

// Oldest first.
message Proposals {
  repeated Proposal proposals = 1;
}

// Adds the proposed task, or changes the item's spec, as proposed or as
// edited here.
message ApplyProposal {
  // Empty for an outside agent's proposal.
  string session_id = 1;
  string proposal_id = 2;
  optional string title = 3;
  optional string spec = 4;
}

message ProposalApplied {
  Proposal proposal = 1;
  Item item = 2;
}

message DeclineProposal {
  string session_id = 1;
  string proposal_id = 2;
}

message ProposalDeclined {
  Proposal proposal = 1;
}

// An outside agent proposes, through `humata mcp`, a task or a change to an
// item's title or spec. It waits on the board until the person applies or
// declines it; only a dev build's admin tools may apply one, as the
// person approves.
message Propose {
  string project_id = 1;
  ProposalKind kind = 2;
  string title = 3;
  string spec = 4;
  string parent_id = 5;
  string item_id = 6;
  string note = 7;
}

message Proposed {
  Proposal proposal = 1;
}

// A spec as a session reads it.
message Spec {
  string item_id = 1;
  string title = 2;
  string spec = 3;
  // The task above a subtask; empty for a task.
  string parent_id = 4;
}

message SetSpecs {
  string session_id = 1;
  // Every spec the session reads; those not here are forgotten.
  repeated Spec specs = 2;
}

message SpecsSet {}

message ReadSpec {
  string session_id = 1;
  string item_id = 2;
}

message ForkSession {
  string session_id = 1;
  // The fork keeps the events before this one, not including it. Empty keeps
  // them all.
  string before_event_id = 2;
  string name = 3;
  // The fork shares its parent's copy of the code instead of getting its
  // own as it was at the fork.
  bool chat_only = 4;
  // The task or subtask of the project the fork works on, reading its
  // specs; empty stays on the parent's. A planning session's fork works in
  // its own copy of the project's repositories.
  string item_id = 5;
  // Filled in by the daemon, for the host: the repositories a fork of a
  // planning session gets a copy of, and the instructions it reads instead
  // of its parent's.
  repeated Repository repositories = 6;
  optional string instructions = 7;
}

// Changes a session's record. Unset fields are left as they are.
message UpdateSession {
  string session_id = 1;
  optional string name = 2;
  // An archived session's copy of the code is saved and removed, and it
  // takes no messages. Unarchived, its code comes back as it was.
  optional bool archived = 3;
  // Marks the session whose changes are the ones to keep.
  optional bool keeper = 4;
  // Moves the session to this task or subtask of its project; empty moves
  // it to the project itself. Only the daemon keeps this.
  optional string item_id = 5;
}

message SessionUpdated {
  SessionInfo session = 1;
}

// Deletes an archived session for good: its folder, its backend's files,
// its worktrees, and its refs and branch. Refused while it isn't archived,
// while a fork of it exists, or while its host can't be reached.
message DeleteSession {
  string session_id = 1;
  // Unless no other branch, remote branch or tag holds its branch's
  // commits; then SessionDeleted says it was kept.
  bool only_if_held = 2;
}

message SessionDeleted {
  // With `only_if_held`: it has commits nothing else holds, so it stays.
  bool kept = 1;
}

// Read with GetStorage; SetStorageSettings and CleanUpStorage answer it
// too, as it is after the change.
message GetStorage {}

message SetStorageSettings {
  StorageSettings settings = 1;
}

// Starts a cleanup on the Mac, in the background; Storage's `job` shows
// how far it is. Refused while one runs.
message CleanUpStorage {
  // Deletes archived sessions not used for this many days, with their
  // snapshots; 0 deletes none. Never one that is a keeper, has forks, has
  // commits nothing else holds, or is on a host that can't be reached:
  // those are listed in `skipped`.
  uint32 delete_archived_after_days = 1;
  // Packs the clones and recovery copies, drops archived sessions' saves
  // from part way through turns, trims the board's history and compacts
  // the store.
  bool compact = 2;
  // Removes the worktrees archived sessions still have; unarchiving one
  // makes them again.
  bool put_away_worktrees = 3;
  // Deletes humatad's clones no project or session on this Mac uses, with
  // their branches and snapshots.
  bool remove_unused_clones = 4;
}

message StorageSettings {
  // Off unless the person turns it on: once a day, while no session works,
  // a cleanup deletes archived sessions after `days` and compacts.
  bool auto_delete = 1;
  uint32 days = 2;
}

enum StorageKind {
  STORAGE_KIND_UNSPECIFIED = 0;
  // Repositories added by their URLs, with the sessions' branches and
  // snapshots.
  STORAGE_KIND_CLONES = 1;
  // The sessions' working copies.
  STORAGE_KIND_WORKTREES = 2;
  // Sessions' records and histories.
  STORAGE_KIND_HISTORIES = 3;
  // Copies of other machines' sessions, to recover them from.
  STORAGE_KIND_RECOVERY = 4;
  // Projects, the board and reviews.
  STORAGE_KIND_STORE = 5;
  STORAGE_KIND_LOGS = 6;
  // The index Search looks in, inside the store.
  STORAGE_KIND_SEARCH = 7;
}

message StorageUse {
  StorageKind kind = 1;
  uint64 bytes = 2;
  // The folder or file, to show in Finder.
  string path = 3;
}

// A cleanup going on: which step, and how far through it.
message StorageJob {
  string step = 1;
  uint32 done = 2;
  uint32 total = 3;
}

// An archived session a cleanup left, and why.
message StorageSkip {
  string session_id = 1;
  string name = 2;
  string reason = 3;
}

message Storage {
  repeated StorageUse uses = 1;
  StorageSettings settings = 2;
  // Unset when no cleanup runs.
  StorageJob job = 3;
  // From the last cleanup.
  repeated StorageSkip skipped = 4;
  uint64 deleted_sessions = 5;
  // When the last cleanup finished; 0 if none has since humatad started.
  int64 cleaned_unix_ms = 6;
  // Why the last cleanup stopped short, if it did.
  string failure = 7;
  // What removing archived sessions' worktrees would free.
  uint64 archived_worktrees_bytes = 8;
  // What removing the clones no project uses would free.
  uint64 unused_clones_bytes = 9;
}

// Removes a task or subtask, logged so Board History can bring it back.
// Refused while it has subtasks or sessions that aren't archived; its
// archived sessions move to the project.
message DeleteItem {
  string item_id = 1;
  // Where the person deleted it from.
  ChangeSurface surface = 2;
}

message ItemDeleted {}

// What a session changed in each repository over a range of its history.
message ReadChanges {
  string session_id = 1;
  // Unset: everything since its copy was made.
  ChangeRange range = 2;
  // Unchanged lines shown around each change; unset is 3.
  optional uint32 context = 3;
  // Only this file. With whole_file, every line of it, with its lines even
  // when it didn't change.
  FileRef file = 4;
  bool whole_file = 5;
}

enum ChangeRangeKind {
  // Everything since the session's copy was made.
  CHANGE_RANGE_KIND_SESSION = 0;
  // In the copy, not staged yet.
  CHANGE_RANGE_KIND_UNSTAGED = 1;
  // Staged in the copy, not committed yet.
  CHANGE_RANGE_KIND_STAGED = 2;
  // From where the copy's work and `branch` meet to the files in the copy.
  CHANGE_RANGE_KIND_BRANCH = 3;
  // What turn `turn` changed; the session's first turn is 1.
  CHANGE_RANGE_KIND_TURN = 4;
}

message ChangeRange {
  ChangeRangeKind kind = 1;
  string branch = 2;
  uint32 turn = 3;
}

// A file, by its repository's name in the session and its path there.
message FileRef {
  string repository = 1;
  string path = 2;
}

message Changes {
  repeated RepositoryChanges repositories = 1;
}

message RepositoryChanges {
  string name = 1;
  // A unified diff; empty if nothing changed.
  string patch = 2;
  repeated FileDiff files = 3;
}

enum FileStatus {
  FILE_STATUS_MODIFIED = 0;
  FILE_STATUS_ADDED = 1;
  FILE_STATUS_DELETED = 2;
  FILE_STATUS_RENAMED = 3;
  // Read as a whole file, and the same at both ends of the range.
  FILE_STATUS_UNCHANGED = 4;
}

message FileDiff {
  string path = 1;
  // Where a renamed file was.
  string old_path = 2;
  FileStatus status = 3;
  bool binary = 4;
  // Names its contents at the end of the range; empty for a deleted file.
  string blob = 5;
  repeated Hunk hunks = 6;
  // Marked viewed, with these contents. The daemon fills it in.
  bool viewed = 7;
}

message Hunk {
  uint32 old_start = 1;
  uint32 old_count = 2;
  uint32 new_start = 3;
  uint32 new_count = 4;
  // What git shows after the hunk's range, such as the function it's in.
  string header = 5;
  repeated DiffLine lines = 6;
}

enum DiffLineKind {
  DIFF_LINE_KIND_CONTEXT = 0;
  DIFF_LINE_KIND_ADDED = 1;
  DIFF_LINE_KIND_REMOVED = 2;
}

message DiffLine {
  DiffLineKind kind = 1;
  // Its number before the change; 0 for an added line.
  uint32 old = 2;
  // Its number after; 0 for a removed line.
  uint32 new = 3;
  string text = 4;
}

enum ChangeAction {
  CHANGE_ACTION_UNSPECIFIED = 0;
  // Stages the copy's unstaged changes.
  CHANGE_ACTION_STAGE = 1;
  // Unstages staged changes, keeping them in the copy.
  CHANGE_ACTION_UNSTAGE = 2;
  // Throws away the copy's unstaged changes; a file git didn't know is
  // removed.
  CHANGE_ACTION_REVERT = 3;
}

// A hunk, by where it starts in the diff the action works on, read with
// `context` lines: the unstaged changes to stage or revert, the staged ones
// to unstage.
message HunkAt {
  uint32 old_start = 1;
  uint32 new_start = 2;
  uint32 context = 3;
}

// Stages, unstages or reverts a file or, given `hunk`, one of its hunks.
message EditChanges {
  string session_id = 1;
  FileRef file = 2;
  ChangeAction action = 3;
  HunkAt hunk = 4;
}

message ChangesEdited {}

// Marks a file viewed with the contents `blob` names, or not viewed. It
// stays viewed until its contents change.
message MarkViewed {
  string session_id = 1;
  FileRef file = 2;
  string blob = 3;
  bool viewed = 4;
}

message FileViewed {}

// The person has seen the session's first `turns` finished turns. Seen
// turns only go up.
message MarkSeen {
  string session_id = 1;
  uint32 turns = 2;
}

message Seen {}

// Takes a queued message out before its turn starts.
message Unqueue {
  string session_id = 1;
  // The id its MessageQueued event gave it.
  string queue_id = 2;
}

message Unqueued {}

// Changes a queued message's text before its turn starts. Its
// MessageQueued event comes again, with the same id and the new text.
// ERROR_CODE_UNKNOWN_QUEUED_MESSAGE when its turn already started or it
// was taken out.
message EditQueued {
  string session_id = 1;
  string queue_id = 2;
  string text = 3;
}

message QueuedEdited {}

// Comments on lines `start_line` to `end_line` of a file as it is in the
// session's copy; in rendered Markdown, on `quote`, the text picked there.
message CreateThread {
  string session_id = 1;
  FileRef file = 2;
  uint32 start_line = 3;
  uint32 end_line = 4;
  string quote = 5;
  string text = 6;
}

// Adds a comment to the thread, sent with the next review.
message ReplyToThread {
  string thread_id = 1;
  string text = 2;
}

message ResolveThread {
  string thread_id = 1;
  bool resolved = 2;
}

message ThreadSaved {
  ReviewThread thread = 1;
}

// Deletes a comment not sent yet; a thread left without comments goes too.
message DeleteComment {
  string comment_id = 1;
}

message CommentDeleted {}

// The files in a session's folder, hidden ones and their contents left out.
message ListFiles {
  string session_id = 1;
}

message ChatFile {
  // Relative to the session's folder, with "/" between folders.
  string path = 1;
  uint64 size = 2;
  // Milliseconds since 1970 in UTC.
  int64 modified_unix_ms = 3;
}

message Files {
  // By path.
  repeated ChatFile files = 1;
  // There were more than are listed.
  bool truncated = 2;
}

// One file in a session's folder, by its path from ListFiles, or under
// `root` on `host` when no session is given.
message ReadFile {
  string session_id = 1;
  // Relative to the session's folder or the root, with "/" between folders.
  string path = 2;
  string host = 3;
  // An absolute folder on the host; empty for its home.
  string root = 4;
}

message FileContents {
  string path = 1;
  // The text, or its start when truncated.
  string text = 2;
  // It isn't UTF-8 text, so text is empty.
  bool binary = 3;
  // An image's bytes, when it isn't too large to send.
  bytes data = 4;
  uint64 size = 5;
  // Only the start of a large text file was read.
  bool truncated = 6;
}

// One level of a folder: in a session's folder when `session_id` is given,
// else under `root` on `host`.
message ListFolder {
  string host = 1;
  string session_id = 2;
  // An absolute folder on the host; empty for its home.
  string root = 3;
  // Under the root, with "/" between folders; empty for the root itself.
  string directory = 4;
}

message FolderEntry {
  string name = 1;
  bool is_directory = 2;
  uint64 size = 3;
  // Milliseconds since 1970 in UTC.
  int64 modified_unix_ms = 4;
}

message Folder {
  // The root as an absolute path on the host, to copy or open.
  string root = 1;
  string directory = 2;
  // Folders first, then files, each by name; hidden ones aren't listed.
  repeated FolderEntry entries = 3;
  // There were more than are listed.
  bool truncated = 4;
}

message ListThreads {
  string session_id = 1;
}

message Threads {
  repeated ReviewThread threads = 1;
}

// Sends every comment not sent yet, on threads not resolved, to the agent
// as one message, asking it to answer each thread.
message SendReview {
  string session_id = 1;
}

message ReviewSent {
  uint32 comments = 1;
}

message ReviewThread {
  string id = 1;
  string session_id = 2;
  FileRef file = 3;
  // Where it is in the file as it is now, from 1.
  uint32 start_line = 4;
  uint32 end_line = 5;
  // The lines it was left on have changed, so it's where they were.
  bool outdated = 6;
  // The lines as they were when it was left.
  repeated string code = 7;
  string quote = 8;
  bool resolved = 9;
  repeated ReviewComment comments = 10;
}

enum CommentAuthor {
  COMMENT_AUTHOR_YOU = 0;
  COMMENT_AUTHOR_AGENT = 1;
  // A reviewer on GitHub, named by login.
  COMMENT_AUTHOR_GITHUB = 2;
}

message ReviewComment {
  string id = 1;
  CommentAuthor author = 2;
  string text = 3;
  // Sent to the agent; only a comment not sent yet can be deleted.
  bool sent = 4;
  int64 time_unix_ms = 5;
  // The agent's: the turn it answered in, whose changes are its fix.
  uint32 turn = 6;
  // A GitHub reviewer's login.
  string login = 7;
}

message SessionForked {
  SessionInfo session = 1;
}

message ReadHistory {
  string session_id = 1;
}

message History {
  repeated SessionEvent events = 1;
}

// Streams the session's events: first every event so far, then each new one
// as it happens.
message WatchSession {
  string session_id = 1;
}

message Watching {}

message ListSessions {
  // Only this project's sessions; empty for every session.
  string project_id = 1;
}

message Sessions {
  repeated SessionInfo sessions = 1;
}

message AbortTurn {
  string session_id = 1;
}

message TurnAborted {}

// Stops the turn if one is running and drops what's queued, then cuts the
// chat back to before `before_event_id`, which must be the person's
// message. With `files`, the session's code goes back to how it was then;
// a session sharing its code with another can't. ERROR_CODE_INVALID_REQUEST
// when the event isn't a message of the person's.
message RewindSession {
  string session_id = 1;
  string before_event_id = 2;
  bool files = 3;
}

message SessionRewound {}

// Undoes the session's last rewind, unless a message was sent since.
message UndoRewind {
  string session_id = 1;
}

message RewindUndone {}

message StreamItem {
  oneof kind {
    SessionEvent session_event = 1;
    ToolCall tool_call = 2;
    TerminalOutput terminal_output = 3;
    PortData port_data = 4;
  }
}

message WatchToolCalls {}

message ToolCallsWatched {}

// A request an agent on the host made through `humatad mcp`, for the daemon,
// which keeps the board and review threads, to answer.
message ToolCall {
  uint64 id = 1;
  Request request = 2;
}

message AnswerToolCall {
  uint64 id = 1;
  // What the agent gets back, an error included.
  Response response = 2;
}

message ToolCallAnswered {}

message StreamEnd {
  // Unset when the stream ended normally.
  Error error = 1;
}

message Cancel {}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_IDLE = 1;
  SESSION_STATE_WORKING = 2;
  SESSION_STATE_WAITING_FOR_APPROVAL = 3;
  SESSION_STATE_FAILED = 4;
}

message SessionInfo {
  string id = 1;
  string name = 2;
  Backend backend = 3;
  string working_directory = 4;
  string model = 5;
  SessionState state = 6;
  // The session this was forked from, and the event it was forked before.
  // Empty for a root session.
  string parent_id = 7;
  string forked_before_event_id = 8;
  // The host it runs on, as the daemon names it; empty for this machine.
  string host = 9;
  ApprovalMode approval_mode = 10;
  // The project it belongs to, as the daemon records it; empty for none.
  string project_id = 11;
  // Its copy of each repository; empty before its first turn, while
  // archived, or if it works in none.
  repeated Checkout checkouts = 12;
  bool archived = 13;
  bool keeper = 14;
  // The task or subtask it works on, as the daemon records it; empty for
  // the project itself or none.
  string item_id = 15;
  // How many turns it has finished.
  uint32 turns = 16;
  // Its host couldn't be reached, so this is the daemon's copy from when it
  // last could: it may have moved on since.
  bool host_offline = 17;
  // How many of its finished turns the person has seen. The daemon fills
  // it in; the inbox lists a reply only while turns is more.
  uint32 seen_turns = 18;
  // The requests for permission the running turn waits on, oldest first,
  // so they can be answered without opening the session.
  repeated PermissionRequested pending = 19;
  // When its last event happened; 0 before it has any.
  int64 last_active_unix_ms = 20;
  // It plans in its project, in no copy of the code; the daemon keeps it.
  bool planning = 21;
  // It waits on the person to answer its question or its move request.
  // The daemon fills it in.
  bool asking = 22;
  // Its last turn's failure, or else the agent's last reply, cut to about
  // 300 characters; empty before either.
  string last_message = 23;
  // The title of the task or subtask it works on; empty for none. The
  // daemon fills it in.
  string item_title = 24;
}

// A session's git worktree of one repository.
message Checkout {
  string name = 1;
  // The worktree's folder, on the session's host.
  string path = 2;
  string branch = 3;
}

// One thing that happened in a session. Its id is stable for the life of the
// session, and a fork's copies keep their ids.
message SessionEvent {
  string id = 1;
  // Milliseconds since 1970 in UTC.
  int64 time_unix_ms = 2;

  oneof kind {
    UserMessage user_message = 3;
    TurnStarted turn_started = 4;
    AssistantDelta assistant_delta = 5;
    AssistantMessage assistant_message = 6;
    Reasoning reasoning = 7;
    ToolStarted tool_started = 8;
    ToolCompleted tool_completed = 9;
    PermissionRequested permission_requested = 10;
    PermissionCompleted permission_completed = 11;
    TurnEnded turn_ended = 12;
    SessionIdle idle = 13;
    SessionFailed failed = 14;
    Usage usage = 15;
    Checkpoint checkpoint = 16;
    MessageQueued message_queued = 17;
    Dequeued dequeued = 18;
    Saved saved = 19;
    Waiting waiting = 20;
    Notice notice = 21;
    Rewound rewound = 22;
    RewindUndoneEvent rewind_undone = 23;
    Compacted compacted = 24;
  }
}

// The chat was cut back to before the message here, which the app offers
// back to edit. Its history starts over from this event: a watcher reads
// the session again. Every later event is gone until the rewind is undone.
message Rewound {
  // The message cut, and the names of its images.
  string text = 1;
  repeated string images = 2;
  // Whether the code was put back as it was then, too.
  bool files = 3;
}

// The last rewind was undone: the history is as it was before it. A watcher
// reads the session again.
message RewindUndoneEvent {}

// The agent summed up its earlier context to make room; it keeps the gist,
// not every word. The code is saved here.
message Compacted {}

// Something the person should know about the session that isn't from the
// agent, such as that it started over without its earlier conversation.
message Notice {
  string text = 1;
}

// The turn is waiting for something outside it, such as the model server,
// and goes on when it's back. Whatever comes next ends the wait.
message Waiting {
  // What it waits for, and what brings it back.
  string reason = 1;
}

// The code was saved part way through a turn, after a tool call. Unlike a
// checkpoint it doesn't divide turns; a fork after it starts from it.
message Saved {
  repeated Snapshot snapshots = 1;
}

// The code was saved: before the first turn and after each one. A fork
// before an event starts from the last checkpoint ahead of it.
message Checkpoint {
  repeated Snapshot snapshots = 1;
}

message Snapshot {
  // The repository's name in the session.
  string name = 1;
  // The commit its worktree was on.
  string head = 2;
  // A commit, on no branch, of the worktree's files.
  string commit = 3;
}

message UserMessage {
  string text = 1;
  // Names of the images sent with it; ReadImage gives each.
  repeated string images = 2;
}

message TurnStarted {}

// Part of the reply as it streams. The AssistantMessage that follows holds
// the whole of it.
message AssistantDelta {
  string text = 1;
}

message AssistantMessage {
  string text = 1;
}

message Reasoning {
  string text = 1;
}

message ToolStarted {
  string call_id = 1;
  string tool = 2;
  // The tool's arguments, as JSON.
  string arguments_json = 3;
}

message ToolCompleted {
  string call_id = 1;
  bool success = 2;
  string output = 3;
}

enum PermissionKind {
  PERMISSION_KIND_UNSPECIFIED = 0;
  PERMISSION_KIND_SHELL = 1;
  PERMISSION_KIND_WRITE = 2;
  PERMISSION_KIND_READ = 3;
  PERMISSION_KIND_OTHER = 4;
}

message PermissionRequested {
  string request_id = 1;
  PermissionKind kind = 2;
  // What the agent wants to do, for the person deciding.
  string summary = 3;
}

message PermissionCompleted {
  string request_id = 1;
  bool approved = 2;
  // Answered by the session's approval mode, not by a person.
  bool automatic = 3;
  // Let through by the agent's own judge, in Auto.
  bool judged = 4;
}

message TurnEnded {
  // Set when the turn was stopped before it finished.
  bool aborted = 1;
}

// A message waits for the running turn to end.
message MessageQueued {
  // Names it until it leaves the queue.
  string queue_id = 1;
  string text = 2;
  // Names of its images; ReadImage gives each.
  repeated string images = 3;
}

// The queued message left the queue: its turn is starting, or the person
// took it out.
message Dequeued {
  string queue_id = 1;
  // Humata stopped before its turn, so it never ran; the app offers its
  // text back rather than sending it unasked.
  bool dropped = 2;
}

message SessionIdle {}

message SessionFailed {
  string message = 1;
}

message Usage {
  string model = 1;
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
  // Copilot's premium requests; 0 for other backends.
  double premium_requests = 4;
}

// Where an item is on the board.
enum ItemStatus {
  // The same as TODO.
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_TODO = 1;
  ITEM_STATUS_IN_PROGRESS = 2;
  ITEM_STATUS_WAITING_ON_YOU = 3;
  ITEM_STATUS_IN_REVIEW = 4;
  ITEM_STATUS_DONE = 5;
  ITEM_STATUS_WONT_DO = 6;
}

enum Priority {
  PRIORITY_NONE = 0;
  PRIORITY_LOW = 1;
  PRIORITY_MEDIUM = 2;
  PRIORITY_HIGH = 3;
  PRIORITY_URGENT = 4;
}

// A task, or a subtask of one, on a project's board.
message Item {
  string id = 1;
  string project_id = 2;
  // The task a subtask is under; empty for a task.
  string parent_id = 3;
  string title = 4;
  // Markdown.
  string spec = 5;
  // Where it shows on the board. While one of its sessions, or for a task
  // one of its subtasks' sessions, is working, waiting or has finished a
  // turn, that decides; otherwise, and always once Done or Won't do, it is
  // given_status.
  ItemStatus status = 6;
  // The status it was given, by hand or when added.
  ItemStatus given_status = 7;
  Priority priority = 8;
  // Milliseconds since 1970 in UTC.
  int64 created_unix_ms = 9;
  int64 updated_unix_ms = 10;
  // The sessions that work on it, archived ones too.
  repeated string session_ids = 11;
}

message CreateItem {
  string project_id = 1;
  // The task to add a subtask under; empty adds a task.
  string parent_id = 2;
  string title = 3;
  string spec = 4;
  ItemStatus status = 5;
  Priority priority = 6;
  // Where the person added it from.
  ChangeSurface surface = 7;
}

message ItemCreated {
  Item item = 1;
}

// Changes an item. Unset fields are left as they are.
message UpdateItem {
  string item_id = 1;
  optional string title = 2;
  optional string spec = 3;
  optional ItemStatus status = 4;
  optional Priority priority = 5;
  // The session whose agent made the change, which isn't told of its own
  // spec edit. Empty when the person made it.
  string by_session_id = 6;
  // Where the change was made from.
  ChangeSurface surface = 7;
}

message ItemUpdated {
  Item item = 1;
}

message ListItems {
  string project_id = 1;
}

// Tasks first by priority, then by when they were added; each task's
// subtasks follow it in the same order.
message Items {
  repeated Item items = 1;
}

// An item's fields that the board's changes record.
message ItemFields {
  string parent_id = 1;
  string title = 2;
  string spec = 3;
  ItemStatus status = 4;
  Priority priority = 5;
}

// Where a board change was made from, for the board's journal.
enum ChangeSurface {
  CHANGE_SURFACE_UNSPECIFIED = 0;
  // The person, in the app.
  CHANGE_SURFACE_APP = 1;
  // The person, with the humata command.
  CHANGE_SURFACE_COMMAND_LINE = 2;
  // An outside agent, through humata mcp.
  CHANGE_SURFACE_MCP = 3;
  // Humata itself, such as a task marked done when its pull request merged
  // or one brought in from a GitHub issue.
  CHANGE_SURFACE_HUMATA = 4;
}

// An item's field, as a board change names it.
enum ItemField {
  ITEM_FIELD_UNSPECIFIED = 0;
  ITEM_FIELD_TITLE = 1;
  ITEM_FIELD_SPEC = 2;
  ITEM_FIELD_STATUS = 3;
  ITEM_FIELD_PRIORITY = 4;
}

// One change to a project's board.
message BoardChange {
  uint64 id = 1;
  string item_id = 2;
  int64 time_unix_ms = 3;
  // Unset when the change added the item.
  ItemFields before = 4;
  // Unset when the change removed it.
  ItemFields after = 5;
  // The change this one reverted; 0 for none.
  uint64 reverts = 6;
  // Where it was made from.
  ChangeSurface surface = 7;
  // The session whose proposal or request it applied; empty for none.
  string session_id = 8;
  // The approval or grant it ran under, when a client other than the app
  // made it; empty for none.
  string approval_id = 9;
  string grant_id = 10;
}

message ReadBoardLog {
  string project_id = 1;
}

// Newest first.
message BoardLog {
  repeated BoardChange changes = 1;
}

// Puts an item back as it was before a change. Reverting the change that
// added an item removes it, which it refuses while the item has subtasks or
// sessions.
message RevertBoardChange {
  uint64 change_id = 1;
  // Where the person reverted it from.
  ChangeSurface surface = 2;
}

message BoardChangeReverted {
  // The item as it is now; unset if it was removed.
  Item item = 1;
  // The fields the change set that were left alone, because they have
  // changed again since.
  repeated ItemField kept = 2;
}

// Every session, across projects, waiting on you.
message ListInbox {}

enum AgentRequestKind {
  AGENT_REQUEST_KIND_UNSPECIFIED = 0;
  AGENT_REQUEST_KIND_QUESTION = 1;
  AGENT_REQUEST_KIND_MOVE = 2;
}

// Something an agent asks of the person, kept until they answer it.
message AgentRequest {
  string id = 1;
  string session_id = 2;
  AgentRequestKind kind = 3;
  // The question, or for a move what the agent did.
  string text = 4;
  // For a move: the task or subtask, and the status asked for.
  string item_id = 5;
  ItemStatus status = 6;
  int64 created_unix_ms = 7;
}

message AskPerson {
  string session_id = 1;
  string text = 2;
  // Set by the host relay, so a question it hands over again after an
  // unanswered try reaches the inbox once.
  string client_id = 3;
}

// Only to in review, done or won't do; the person approves it.
message RequestMove {
  string session_id = 1;
  // Empty for the session's own task.
  string item_id = 2;
  ItemStatus status = 3;
  string summary = 4;
  // As for AskPerson.
  string client_id = 5;
}

message RequestMade {
  // Unset when the host keeps it until the Mac reconnects, as it does while
  // Humata on the Mac isn't connected.
  AgentRequest request = 1;
}

message AnswerRequest {
  string request_id = 1;
  oneof answer {
    // Sent to the session as a message, which it carries on from.
    string reply = 2;
    // Moves the item as asked.
    bool approve = 3;
    // Moves the item to another status of the person's choosing.
    ItemStatus move_to = 4;
    // Takes it out of the inbox without doing anything.
    bool dismiss = 5;
  }
}

message RequestAnswered {}

enum InboxReason {
  INBOX_REASON_UNSPECIFIED = 0;
  // It asked to run a command, write or read and waits for your answer.
  INBOX_REASON_APPROVAL = 1;
  // It finished a turn: a question to answer or work to review.
  INBOX_REASON_REPLY = 2;
  // Its turn failed.
  INBOX_REASON_FAILED = 3;
  // It asked you a question or for your opinion.
  INBOX_REASON_QUESTION = 4;
  // It finished and asks to move its task.
  INBOX_REASON_MOVE = 5;
}

message InboxEntry {
  SessionInfo session = 1;
  InboxReason reason = 2;
  // Its project's and item's names; empty for none.
  string project_name = 3;
  string item_title = 4;
  // What it asks, for a question or a move.
  AgentRequest request = 5;
}

// Approvals first, then what agents ask, then failures, then replies.
message Inbox {
  repeated InboxEntry entries = 1;
  // Admin actions waiting for the person, oldest first.
  repeated Approval approvals = 2;
}

// What an admin action may do. The app runs its admin actions at once; from
// any other client, as `humata` or `humata mcp`, one runs only once the
// person approves it, or under a grant for its scope.
enum ApprovalScope {
  APPROVAL_SCOPE_UNSPECIFIED = 0;
  // Applying and declining proposals.
  APPROVAL_SCOPE_PROPOSALS = 1;
  // Adding and changing items and their specs, and importing issues.
  APPROVAL_SCOPE_BOARD = 2;
  // Deleting items and reverting board changes. Only a grant naming this
  // scope covers it.
  APPROVAL_SCOPE_DESTRUCTIVE = 3;
}

enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  // Approved and run; `result` has what it answered.
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_DENIED = 3;
}

// An admin action a client asked for, and what became of it.
message Approval {
  string id = 1;
  // The program that asked, with its arguments, such as `humata mcp`.
  string client = 2;
  // The program that started it, such as `claude`; empty if unknown.
  string parent = 3;
  ApprovalScope scope = 4;
  // What it will do, in a line.
  string summary = 5;
  // For a spec or title it changes: the text now and the text it sets.
  string before = 6;
  string after = 7;
  ApprovalState state = 8;
  int64 asked_unix_ms = 9;
  int64 decided_unix_ms = 10;
  // Once approved: what it answered, which may be an error.
  Response result = 11;
  // The grant it ran under; empty when the person approved it.
  string grant_id = 12;
  // The project it's for; empty if none.
  string project_id = 13;
}

// Lets admin actions in `scopes` from clients other than the app run
// without asking, until it expires or is revoked.
message Grant {
  string id = 1;
  repeated ApprovalScope scopes = 2;
  int64 granted_unix_ms = 3;
  int64 expires_unix_ms = 4;
  bool revoked = 5;
  // How many actions ran under it.
  uint32 used = 6;
}

message NeedsApproval {
  Approval approval = 1;
}

// How approval `id` stands, waiting up to `wait_seconds` for the person to
// decide it.
message WaitForApproval {
  string id = 1;
  uint32 wait_seconds = 2;
}

message ApprovalStatus {
  Approval approval = 1;
}

// The pending and recent approvals, newest first, and the grants not
// expired or revoked.
message ListApprovals {}

message Approvals {
  repeated Approval approvals = 1;
  repeated Grant grants = 2;
}

// The app only: approves or denies the pending approvals `ids`. Approving
// can also grant `grant_scopes` for `grant_seconds`, to the actions after.
message DecideApprovals {
  repeated string ids = 1;
  bool approve = 2;
  repeated ApprovalScope grant_scopes = 3;
  uint32 grant_seconds = 4;
}

message ApprovalsDecided {
  repeated Approval approvals = 1;
  // The grant made, if one was asked for.
  Grant grant = 2;
}

// The app only.
message RevokeGrant {
  string id = 1;
}

message GrantRevoked {}

// A machine the daemon runs sessions on over SSH.
message HostInfo {
  string name = 1;
  // What `ssh` connects to, such as a Host in ~/.ssh/config; empty for a
  // host reached by a command of its own, which Humata can't install on.
  string ssh_destination = 2;
  // The names of the variables set for its agents. Their values never leave
  // the daemon but to the host.
  repeated string env_names = 3;
  // Run on the host when it changes, or until it succeeds.
  string setup_script = 4;
}

message ListHosts {}

message Hosts {
  repeated HostInfo hosts = 1;
  // The coordinator, the Mac the daemon runs on, with no name: the
  // variables for its agents. `UpdateHost` with
  // no name changes them; it takes no setup script.
  HostInfo coordinator = 2;
}

message AddHost {
  string name = 1;
  string ssh_destination = 2;
  // An ssh_config to use instead of ~/.ssh/config; empty for the default.
  string ssh_config = 3;
  // Where Humata keeps its program and state on the host, relative to the
  // home folder there; empty for .humata.
  string folder = 4;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

// Changes a host's setup; it takes effect the next time the daemon connects.
message UpdateHost {
  string name = 1;
  repeated EnvVar set_env = 2;
  repeated string unset_env = 3;
  optional string setup_script = 4;
}

message HostSaved {
  HostInfo host = 1;
}

message RemoveHost {
  string name = 1;
}

message HostRemoved {}

// Connects to a host, installing or updating Humata's program there first if
// it can, and reports how it is.
message CheckHost {
  string name = 1;
}

message HostHealth {
  string name = 1;
  bool reachable = 2;
  // Why it couldn't be reached, for the person who has to fix it.
  string problem = 3;
  HostStatus status = 4;
}

// Copies Humata's program to a host over SSH.
message InstallHost {
  string name = 1;
  // The program to copy, for a host of another platform; empty for this
  // daemon's own.
  string binary = 2;
}

message HostInstalled {
  string program_version = 1;
}

// The hosts named in ~/.ssh/config, to add one from.
message ListSshHosts {}

message SshHosts {
  repeated string names = 1;
}

message ConfigureHost {
  repeated EnvVar env = 1;
  string setup_script = 2;
  // The port of the Mac's model server, forwarded to the same port on the
  // host's 127.0.0.1; 0 leaves the one it has.
  uint32 model_server_port = 3;
}

message SetModelServer {
  uint32 port = 1;
}

message ModelServerSet {}

message HostConfigured {
  SetupResult setup = 1;
}

message SetupResult {
  // False when there is no setup script.
  bool ran = 1;
  bool succeeded = 2;
  // What it printed, cut to the end if it was long.
  string output = 3;
  // Milliseconds since 1970 in UTC.
  int64 ran_unix_ms = 4;
}

message ReadHostStatus {}

message HostStatus {
  string program_version = 1;
  // Its system and architecture, as `uname -sm` prints them.
  string platform = 2;
  uint64 free_disk_bytes = 3;
  // Empty, with the reason in copilot_problem, if it couldn't be run.
  string copilot_version = 4;
  string copilot_problem = 5;
  // Whether its agents have a GitHub token: GH_TOKEN, GITHUB_TOKEN or
  // COPILOT_GITHUB_TOKEN. Without one, Copilot needs `copilot login` there.
  bool github_token = 6;
  SetupResult setup = 7;
  // Empty, with the reason in claude_problem, if it couldn't be run.
  string claude_version = 8;
  string claude_problem = 9;
  // Whether its agents have ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN.
  // Without one, Claude Code needs `claude` signed in there.
  bool anthropic_key = 10;
  // Empty, or why its login shell's variables couldn't be read when it
  // started, so its agents run without them.
  string environment_problem = 11;
}

message RemoteRepository {
  string name = 1;
  // What `git clone` takes.
  string url = 2;
}

// Clones each repository on the host, or fetches it if it is there already.
message CloneRepositories {
  // The folder to clone into, under the host's own; one per project.
  string folder = 1;
  repeated RemoteRepository repositories = 2;
}

message RepositoriesCloned {
  // Each clone's folder on the host.
  repeated Repository repositories = 1;
  // The commits each clone's refs point at, by name, so what is sent to it
  // can leave out what it has.
  repeated RepositoryCommits tips = 2;
}

// A shell on a host, opened in a session's folder, a folder named, or the
// host's home. It keeps running when no one is attached, until it exits or
// is closed.
message Terminal {
  string id = 1;
  // As the daemon names it; empty for this Mac.
  string host = 2;
  // The session it was opened for; empty for none.
  string session_id = 3;
  // Where it started, on the host.
  string folder = 4;
  // The shell's program.
  string shell = 5;
  int64 opened_unix_ms = 6;
  bool exited = 7;
  // How it exited, when exited; -1 when it was killed by a signal.
  int32 exit_code = 8;
}

// Opens a terminal in the session's folder, else in `folder`, else in the
// host's home.
message OpenTerminal {
  // Ignored when a session is given: it opens on the session's host.
  string host = 1;
  string session_id = 2;
  string folder = 3;
  uint32 rows = 4;
  uint32 columns = 5;
}

message TerminalOpened {
  Terminal terminal = 1;
}

// A stream: the terminal's recent output, then what it prints from then on,
// as TerminalOutput items, until it exits.
message AttachTerminal {
  string host = 1;
  string terminal_id = 2;
}

message TerminalOutput {
  bytes data = 1;
  // The data is the terminal's recent output from the start: clear what's
  // shown first. The first item is one, and so is one after a watcher fell
  // behind.
  bool replay = 2;
  // The shell exited; the stream ends after this.
  bool exited = 3;
  int32 exit_code = 4;
}

// Typed into the terminal.
message TerminalInput {
  string host = 1;
  string terminal_id = 2;
  bytes data = 3;
}

message TerminalInputSent {}

message ResizeTerminal {
  string host = 1;
  string terminal_id = 2;
  uint32 rows = 3;
  uint32 columns = 4;
}

message TerminalResized {}

// The terminals on one host, running and exited, oldest first.
message ListTerminals {
  string host = 1;
}

message Terminals {
  repeated Terminal terminals = 1;
}

// Ends the terminal's shell, if it still runs, and forgets the terminal.
message CloseTerminal {
  string host = 1;
  string terminal_id = 2;
}

message TerminalClosed {}

// Listens on 127.0.0.1 on the Mac and carries each connection to `port` on
// the host, for a dev server there to open in the browser.
message ForwardPort {
  // Empty for this Mac.
  string host = 1;
  uint32 port = 2;
  // The session it's for, if any, to list it with.
  string session_id = 3;
}

message Forward {
  string id = 1;
  string host = 2;
  // The port on the host.
  uint32 port = 3;
  // Where it listens on the Mac: http://127.0.0.1:local_port.
  uint32 local_port = 4;
  string session_id = 5;
}

message PortForwarded {
  Forward forward = 1;
}

message ListForwards {}

message Forwards {
  repeated Forward forwards = 1;
}

message StopForward {
  string id = 1;
}

message ForwardStopped {}

message ConnectPort {
  string host = 1;
  uint32 port = 2;
}

message PortConnected {
  string connection_id = 1;
}

// Bytes the server sent; the stream ends when it closes.
message PortData {
  bytes data = 1;
}

message WritePort {
  string host = 1;
  string connection_id = 2;
  // Empty: the Mac's side closed its half.
  bytes data = 3;
}

message PortWritten {}

message ClosePort {
  string host = 1;
  string connection_id = 2;
}

message PortClosed {}

// Links the Mac's humata and humatad into ~/.local/bin, where a terminal
// finds them. A file there of either name that isn't such a link is left
// alone, and no shell profile is changed.
message LinkCommands {
  // Only say how they're linked.
  bool check = 1;
}

enum CommandLinkState {
  COMMAND_LINK_STATE_UNSPECIFIED = 0;
  // Nothing of that name is in the folder.
  COMMAND_LINK_STATE_MISSING = 1;
  // A link to this Humata's.
  COMMAND_LINK_STATE_LINKED = 2;
  // A link to another copy, as from an older copy of the app.
  COMMAND_LINK_STATE_STALE = 3;
  // Something else of that name, which is never replaced.
  COMMAND_LINK_STATE_OTHER = 4;
}

message CommandLink {
  string name = 1;
  CommandLinkState state = 2;
}

message CommandsLinked {
  // ~/.local/bin, in full.
  string folder = 1;
  repeated CommandLink links = 2;
  // Whether the login shell's PATH has the folder, so a terminal finds
  // what's linked there.
  bool on_path = 3;
  // Empty, or why the login shell's variables couldn't be read when the
  // daemon started, so agents here run without them.
  string environment_problem = 4;
}

// Search across every session's messages, replies, tool calls and their
// output, review comments and specs.
message Search {
  // Words to find, every one of them; the last may be the start of a word.
  // A time in it, as "last week" or "past 3 days", narrows to then.
  string query = 1;
  // Words that mean much the same, found as well and marked related.
  repeated string related = 2;
  string project_id = 3;
  string item_id = 4;
  string session_id = 5;
  // The most hits; 0 for 50.
  uint32 limit = 6;
  // When the query names no time: from and before these, if set.
  int64 since_unix_ms = 7;
  int64 until_unix_ms = 8;
}

enum SearchHitKind {
  SEARCH_HIT_KIND_UNSPECIFIED = 0;
  SEARCH_HIT_KIND_MESSAGE = 1;
  SEARCH_HIT_KIND_REPLY = 2;
  SEARCH_HIT_KIND_TOOL_CALL = 3;
  SEARCH_HIT_KIND_TOOL_OUTPUT = 4;
  SEARCH_HIT_KIND_COMMENT = 5;
  SEARCH_HIT_KIND_SPEC = 6;
}

message SearchHit {
  SearchHitKind kind = 1;
  // Empty for a spec.
  string session_id = 2;
  string session_name = 3;
  // The event in the session's history; empty for a comment or a spec.
  string event_id = 4;
  // The turn it's in, from 1; 0 for a comment or a spec.
  uint32 turn = 5;
  int64 time_unix_ms = 6;
  string project_id = 7;
  string item_id = 8;
  string host = 9;
  // The review thread of a comment.
  int64 thread_id = 10;
  // The text around what was found, each word found between U+E000 and
  // U+E001.
  string snippet = 11;
  // Found by a related word, not the query's own.
  bool related = 12;
}

message SearchResults {
  repeated SearchHit hits = 1;
  // The query's words searched, without the time it named.
  string words = 2;
  // The time searched, if any.
  int64 since_unix_ms = 3;
  int64 until_unix_ms = 4;
}

message LandSession {
  string session_id = 1;
  // The branch to commit on, as "humata/fix-the-migrations".
  string branch = 2;
  string message = 3;
  // Push each landed branch to its repository's origin.
  bool push = 4;
  // For the Mac: push, then open a pull request in each repository, or
  // find the one open for the branch.
  bool open_pull_requests = 5;
}

message LandedRepository {
  string name = 1;
  string branch = 2;
  // The commit made of its changes; empty if it had none since it last
  // landed.
  string commit = 3;
  // The branch its work goes into.
  string base = 4;
  // Its origin remote, empty if it has none.
  string origin_url = 5;
  bool pushed = 6;
}

message SessionLanded {
  repeated LandedRepository repositories = 1;
  repeated PullRequest pull_requests = 2;
}

enum PullRequestState {
  PULL_REQUEST_STATE_OPEN = 0;
  PULL_REQUEST_STATE_MERGED = 1;
  PULL_REQUEST_STATE_CLOSED = 2;
}

// Where the reviewers stand, each by their last review.
enum ReviewStanding {
  REVIEW_STANDING_NONE = 0;
  REVIEW_STANDING_CHANGES_REQUESTED = 1;
  REVIEW_STANDING_COMMENTED = 2;
  REVIEW_STANDING_APPROVED = 3;
}

enum ChecksState {
  CHECKS_STATE_NONE = 0;
  CHECKS_STATE_PENDING = 1;
  CHECKS_STATE_PASSING = 2;
  CHECKS_STATE_FAILING = 3;
}

message PullRequest {
  string session_id = 1;
  // The session's task, if it has one.
  string item_id = 2;
  // The session's name for the repository.
  string repository = 3;
  // On GitHub, as "owner/name".
  string github_repository = 4;
  uint64 number = 5;
  string url = 6;
  string title = 7;
  string branch = 8;
  string base = 9;
  PullRequestState state = 10;
  ReviewStanding review = 11;
  ChecksState checks = 12;
  // When it was last read from GitHub.
  int64 read_unix_ms = 13;
}

message ListPullRequests {
  // One of them.
  string session_id = 1;
  string item_id = 2;
  // Read them from GitHub first, not only as last read.
  bool refresh = 3;
}

message PullRequests {
  repeated PullRequest pull_requests = 1;
}

message UpdateFromBase {
  string session_id = 1;
}

enum MergeOutcome {
  MERGE_OUTCOME_UP_TO_DATE = 0;
  MERGE_OUTCOME_MERGED = 1;
  MERGE_OUTCOME_CONFLICTS = 2;
}

message MergedRepository {
  string name = 1;
  // What was merged in, as "origin/main".
  string upstream = 2;
  MergeOutcome outcome = 3;
  repeated string conflicts = 4;
}

message BaseUpdated {
  repeated MergedRepository repositories = 1;
  // The conflicts were sent to the agent to resolve.
  bool sent_to_agent = 2;
}

message ImportIssues {
  string project_id = 1;
}

message IssuesImported {
  // The tasks made.
  repeated Item items = 1;
  // Issues imported before, left as they are.
  uint32 skipped = 2;
}

message LandedBranch {
  string repository = 1;
  string branch = 2;
  // The commit the pull request merged; with `archive`, a branch whose
  // checkout has moved past it, or has changes not committed, is work done
  // since and keeps the session as it is.
  string merged_tip = 3;
}

message DeleteBranches {
  string session_id = 1;
  repeated LandedBranch branches = 2;
  // Archive the session first, which removes its worktrees, unless any
  // branch has work past its `merged_tip`.
  bool archive = 3;
}

message BranchesDeleted {
  // The session had work past what merged, so it was left as it was: not
  // archived, and no branch deleted.
  bool kept = 1;
}

// Where a skill was found.
enum SkillOrigin {
  SKILL_ORIGIN_UNSPECIFIED = 0;
  // ~/.claude/skills on its host.
  SKILL_ORIGIN_CLAUDE_USER = 1;
  // ~/.copilot/skills on its host.
  SKILL_ORIGIN_COPILOT_USER = 2;
  // A repository's .claude/skills.
  SKILL_ORIGIN_CLAUDE_REPOSITORY = 3;
  // A repository's .github/skills.
  SKILL_ORIGIN_GITHUB_REPOSITORY = 4;
  // One of the project's own, kept by Humata.
  SKILL_ORIGIN_PROJECT = 5;
}

// A repository to look for skills in, on the host asked.
message SkillFolder {
  string project_id = 1;
  // Its name in the project.
  string name = 2;
  // Its folder on the host; empty for the host's clone of it, if it has one.
  string path = 3;
}

// For hosts: the skills in the agents' folders in the home folder, and in
// each of `repositories`.
message ScanSkills {
  repeated SkillFolder repositories = 1;
}

message FoundSkill {
  string name = 1;
  string description = 2;
  // The SKILL.md on its host; empty for a project's own.
  string path = 3;
  SkillOrigin origin = 4;
  // The project, for a repository's or the project's own.
  string project_id = 5;
  // The repository's name in the project, for a repository's.
  string repository = 6;
  // A SHA-256 of the file, hex; a pick holds only while the files are the
  // same.
  string hash = 7;
  // "" for the Mac.
  string host = 8;
}

message SkillsScanned {
  repeated FoundSkill skills = 1;
}

// Every skill on the Mac and the hosts that answer, and every clash among
// those one session would get.
message ListSkills {}

message SkillClash {
  string name = 1;
  // Each different file of that name, by hash; one session would get all.
  repeated FoundSkill candidates = 2;
  // The hash of the one picked; empty until someone picks.
  string winner = 3;
}

message SkillList {
  repeated FoundSkill skills = 1;
  repeated SkillClash clashes = 2;
  // Hosts that couldn't be reached, whose skills aren't listed.
  repeated string unreachable = 3;
}

// Picks which of the skills named `name` wins, for every project and host,
// while the files are the ones in `candidates`, by hash.
message PickSkill {
  string name = 1;
  repeated string candidates = 2;
  string winner = 3;
}

message SkillPicked {}
