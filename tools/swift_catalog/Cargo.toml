[package]
name = "swift-catalog"
description = "Regenerates the Swift release and macOS SDK catalogs in bazel/toolchains/swift."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "swift_catalog"
path = "src/main.rs"

[dependencies]
