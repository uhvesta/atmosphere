# Test VM for cross-compiled Linux binaries; see tools/e2e/e2e.sh.
# Runs arm64 binaries natively and x86_64 binaries through Rosetta.
# The host directory /tmp/monty-oxide-cross is mounted read-only.
base: template:debian-13
vmType: vz
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
cpus: 2
memory: 2GiB
disk: 8GiB
containerd:
  system: false
  user: false
mounts:
  - location: /tmp/monty-oxide-cross
    mountPoint: /tmp/monty-oxide-cross
    writable: false
provision:
  # x86_64 glibc binaries need the amd64 dynamic loader and libc.
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      dpkg --add-architecture amd64
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y libc6:amd64
