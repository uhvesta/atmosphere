[package]
name = "bootstrap-revup"
description = "Installs revup into .tools/revup from tools/scripts/bootstrap/versions.lock."
version = "0.0.0"
publish = false
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "revup"
